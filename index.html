":"HRV6-M10-107","moduleId":"m10","module":"HR商务沟通与汇报","term":"Meeting agenda","zh":"会议议程","definition":"列出会议目标、议题、主持人及时间安排的文件。","example":"Please circulate the meeting agenda before the HR review.","collocation":"share the meeting agenda","dialogue":[{"role":"Stakeholder","en":"How should we communicate the next step to stakeholders?","zh":"我们应如何向相关方沟通下一步安排？","translationSource":"逐句审校补译"},{"role":"HR Project Lead","en":"Please circulate the meeting agenda before the HR review.","zh":"请在人力资源评审会前分发会议议程。"}],"usage":"","distinction":"","aliases":[],"new":true,"order":535,"collocationZh":"分享会议议程","collocationReview":"语义匹配","ipaUK":"ˈmiːtɪŋ əˈdʒendə","ipaUS":"ˈmiːtɪŋ əˈdʒendə","ipaSource":"音素词典与英式语音规则推导","speakTerm":"Meeting agenda","exampleZh":"请在人力资源评审会前分发会议议程。","ipaReview":"音素级自动核查，非人工逐字校音","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"},{"id":"HRV6-M10-108","moduleId":"m10","module":"HR商务沟通与汇报","term":"Decision memo","zh":"决策备忘录／决策建议书","definition":"为管理层集中呈现备选方案、证据、风险及建议决策的短文档。","example":"The decision memo summarizes the proposed policy changes.","collocation":"draft a decision memo","dialogue":[{"role":"Stakeholder","en":"How should we communicate the next step to stakeholders?","zh":"我们应如何向相关方沟通下一步安排？","translationSource":"逐句审校补译"},{"role":"HR Project Lead","en":"The decision memo summarizes the proposed policy changes.","zh":"决策备忘录汇总了拟议的政策变更。"}],"usage":"","distinction":"","aliases":[],"new":true,"order":536,"collocationZh":"起草决策备忘录","collocationReview":"语义匹配","ipaUK":"dɪˈsɪʒən ˈmeməʊ","ipaUS":"dɪˈsɪʒən ˈmemoʊ","ipaSource":"音素词典与英式语音规则推导","speakTerm":"Decision memo","exampleZh":"决策备忘录汇总了拟议的政策变更。","ipaReview":"音素级自动核查，非人工逐字校音","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"},{"id":"HRV6-M10-109","moduleId":"m10","module":"HR商务沟通与汇报","term":"Stakeholder engagement","zh":"相关方沟通与参与","definition":"在项目或政策过程中与关键部门和人员持续沟通并争取参与支持。","example":"Stakeholder engagement is critical during a global policy rollout.","collocation":"strengthen stakeholder engagement","dialogue":[{"role":"Stakeholder","en":"How should we communicate the next step to stakeholders?","zh":"我们应如何向相关方沟通下一步安排？","translationSource":"逐句审校补译"},{"role":"HR Project Lead","en":"Stakeholder engagement is critical during a global policy rollout.","zh":"全球政策推广期间，利益相关方参与至关重要。"}],"usage":"","distinction":"","aliases":[],"new":true,"order":537,"collocationZh":"加强相关方沟通与参与","collocationReview":"语义匹配","ipaUK":"ˈsteɪkhəʊldə enˈɡeɪdʒmənt","ipaUS":"ˈsteɪkˌhoʊldɚ enˈɡeɪdʒmənt","ipaSource":"音素词典与英式语音规则推导","speakTerm":"Stakeholder engagement","exampleZh":"全球政策推广期间，利益相关方参与至关重要。","ipaReview":"音素级自动核查，非人工逐字校音","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"},{"id":"HRV6-M10-110","moduleId":"m10","module":"HR商务沟通与汇报","term":"Working session","zh":"专题工作会议／协同研讨会","definition":"为共同讨论、解决问题或完成具体产出而举行的工作会议。","example":"Let's schedule a working session to finalize the HR process.","collocation":"host a working session","dialogue":[{"role":"Stakeholder","en":"How should we communicate the next step to stakeholders?","zh":"我们应如何向相关方沟通下一步安排？","translationSource":"逐句审校补译"},{"role":"HR Project Lead","en":"Let's schedule a working session to finalize the HR process.","zh":"我们安排一次工作会议，敲定人力资源流程吧。"}],"usage":"","distinction":"","aliases":[],"new":true,"order":538,"collocationZh":"主持专题工作会议","collocationReview":"语义匹配","ipaUK":"ˈwɜːkɪŋ ˈseʃən","ipaUS":"ˈwɝːkɪŋ ˈseʃən","ipaSource":"音素词典与英式语音规则推导","speakTerm":"Working session","exampleZh":"我们安排一次工作会议，敲定人力资源流程吧。","ipaReview":"音素级自动核查，非人工逐字校音","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"},{"id":"HRV6-M10-111","moduleId":"m10","module":"HR商务沟通与汇报","term":"Compliance update","zh":"合规进展通报／合规要求更新","definition":"就法律合规变化、检查发现和整改工作向相关方通报的材料。","example":"HR shared a compliance update with regional managers.","collocation":"send a compliance update","dialogue":[{"role":"Stakeholder","en":"How should we communicate the next step to stakeholders?","zh":"我们应如何向相关方沟通下一步安排？","translationSource":"逐句审校补译"},{"role":"HR Project Lead","en":"HR shared a compliance update with regional managers.","zh":"人力资源部门向区域管理者通报了最新合规动态。"}],"usage":"","distinction":"","aliases":[],"new":true,"order":539,"collocationZh":"发送合规进展通报","collocationReview":"语义匹配","ipaUK":"kəmˈplaɪəns ˈʌpdeɪt","ipaUS":"kəmˈplaɪəns əpˈdeɪt","ipaSource":"音素词典与英式语音规则推导","speakTerm":"Compliance update","exampleZh":"人力资源部门向区域管理者通报了最新合规动态。","ipaReview":"音素级自动核查，非人工逐字校音","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"},{"id":"HRV6-M10-112","moduleId":"m10","module":"HR商务沟通与汇报","term":"Follow-up email","zh":"会后跟进邮件","definition":"确认会议结论、行动项和责任人并继续推进事项的邮件。","example":"I will send a follow-up email with the agreed next steps.","collocation":"send a follow-up email","dialogue":[{"role":"Stakeholder","en":"How should we communicate the next step to stakeholders?","zh":"我们应如何向相关方沟通下一步安排？","translationSource":"逐句审校补译"},{"role":"HR Project Lead","en":"I will send a follow-up email with the agreed next steps.","zh":"我会发送一封后续邮件，列明已商定的下一步行动。"}],"usage":"","distinction":"","aliases":[],"new":true,"order":540,"collocationZh":"发送会后跟进邮件","collocationReview":"语义匹配","ipaUK":"ˈfɒləʊ ʌp ˈiːmeɪl","ipaUS":"ˈfɑːloʊ ʌp iːˈmeɪl","ipaSource":"音素词典与英式语音规则推导","speakTerm":"Follow-up email","exampleZh":"我会发送一封后续邮件，列明已商定的下一步行动。","ipaReview":"音素级自动核查，非人工逐字校音","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"},{"id":"HRV8-001","moduleId":"m10","module":"HR商务沟通与汇报","term":"Revise","zh":"修订（人力资源政策／岗位说明书等）","definition":"在 HR 工作中指根据反馈、组织变化或法律要求，对岗位说明书、员工手册、薪酬政策等正式文件作出修改或修订。","example":"We need to revise the job description before posting the vacancy.","collocation":"revise a job description","collocationZh":"修订岗位说明书","dialogue":[{"role":"HRBP","en":"Could you revise the job description to reflect the new responsibilities?","zh":"你能否修订岗位说明书，反映新增的岗位职责？"},{"role":"Hiring Manager","en":"Sure. I will send the revised version for approval.","zh":"当然。我会将修订稿提交审批。"}],"usage":"revise 是“修订（文件、政策）”，与 review（审阅）不同；在业务沟通中还可以说 revise the compensation policy（修订薪酬政策）。","new":true,"order":541,"aliases":["revise a policy","修订制度","修订政策"],"distinction":"revise ≠ review：前者指实际修改文本，后者指审阅、复核。","collocationReview":"人工校订","ipaUK":"rɪˈvaɪz","ipaUS":"rɪˈvaɪz","ipaSource":"词典重点校订","speakTerm":"Revise","exampleZh":"发布岗位招聘信息前，我们需要修订岗位说明书。","ipaReview":"重点词典参考","ipaNote":"IPA 使用通用教学记音法；语音实际口音取决于设备语音包。"}],"scenarios":[{"id":"S01","moduleId":"m1","title":"招聘需求确认","titleEn":"Planning a new hire","lines":[{"role":"Hiring Manager","en":"We need to hire two engineers next quarter. Has the headcount been approved?","zh":"下季度我们需要招聘两名工程师。编制获批了吗？"},{"role":"Recruiter","en":"Not yet. Please submit a job requisition with the business justification.","zh":"还没有。请提交招聘申请单并说明业务理由。"},{"role":"Hiring Manager","en":"Once it is approved, how quickly can we start sourcing candidates?","zh":"获批后，我们多快能开始寻访候选人？"},{"role":"Recruiter","en":"We can publish the job posting and start outreach within two working days.","zh":"我们可以在两个工作日内发布职位信息并开始主动接触候选人。"}],"quiz":"What document needs approval before hiring begins?","answer":"job requisition","quizZh":"招聘开始前需要审批哪份文件？","answerZh":"招聘申请单"},{"id":"S02","moduleId":"m1","title":"录用进度沟通","titleEn":"Discussing an offer","lines":[{"role":"Recruiter","en":"The final candidate has a six-week notice period.","zh":"最终候选人的离职通知期是六周。"},{"role":"Hiring Manager","en":"Can we adjust the start date in the offer letter?","zh":"我们能在录用通知书中调整入职日期吗？"},{"role":"Recruiter","en":"Yes. I will confirm the salary expectations and send the revised offer.","zh":"可以。我会确认薪酬期望，然后发送修订后的录用通知。"},{"role":"Hiring Manager","en":"Please keep the candidate updated throughout the process.","zh":"请在整个过程中持续向候选人同步进展。"}],"quiz":"What document is being revised?","answer":"offer letter","quizZh":"正在修订哪份文件？","answerZh":"录用通知书"},{"id":"S03","moduleId":"m2","title":"薪资区间与公平","titleEn":"Explaining salary bands","lines":[{"role":"HRBP","en":"The proposed salary is above the midpoint. Does it fit the band?","zh":"拟议工资高于区间中点。它仍在薪资范围内吗？"},{"role":"Compensation Partner","en":"Yes, but we should review internal equity before making the offer.","zh":"是的，但在发出录用前应复核内部薪酬公平。"},{"role":"HRBP","en":"Can we share the salary band with the hiring manager?","zh":"我们可以向用人经理提供薪资区间吗？"},{"role":"Compensation Partner","en":"Of course. I will also explain the compa-ratio and approval rules.","zh":"当然。我还会解释薪酬比率和审批规则。"}],"quiz":"Which ratio compares pay with a range midpoint?","answer":"compa-ratio","quizZh":"哪项比率用于比较员工薪酬与薪资区间中点？","answerZh":"薪酬对中值比率（Compa-ratio）"},{"id":"S04","moduleId":"m2","title":"奖金方案沟通","titleEn":"Discussing a bonus plan","lines":[{"role":"Manager","en":"Is the target bonus part of the employee’s base salary?","zh":"目标奖金包含在员工基本工资里吗？"},{"role":"Rewards Partner","en":"No. It is variable pay and depends on the plan conditions.","zh":"不包含。它属于浮动薪酬，取决于激励计划条件。"},{"role":"Manager","en":"What if the team exceeds the performance threshold?","zh":"如果团队超过绩效门槛，会怎样？"},{"role":"Rewards Partner","en":"The final payout will follow the approved incentive formula.","zh":"最终发放额会按照获批的激励公式执行。"}],"quiz":"Is a target bonus fixed base salary or variable pay?","answer":"variable pay","quizZh":"目标奖金属于固定基本工资还是浮动薪酬？","answerZh":"浮动薪酬"},{"id":"S05","moduleId":"m3","title":"绩效校准讨论","titleEn":"Calibrating performance ratings","lines":[{"role":"HRBP","en":"Some teams gave higher ratings than others for similar results.","zh":"有些团队对相似成果给出了更高的绩效等级。"},{"role":"Manager","en":"Should we change the ratings during calibration?","zh":"我们应该在校准会上调整评级吗？"},{"role":"HRBP","en":"We should compare evidence against the same rating criteria first.","zh":"我们应该先用一致的评级标准比较实际证据。"},{"role":"Manager","en":"Agreed. I will bring examples of the employee’s outcomes.","zh":"同意。我会带上员工工作成果的具体例子。"}],"quiz":"What evidence should inform performance ratings?","answer":"documented evidence","quizZh":"绩效评级应依据哪些信息？","answerZh":"有记录的事实证据"},{"id":"S06","moduleId":"m3","title":"绩效改进沟通","titleEn":"Discussing a performance improvement plan","lines":[{"role":"Manager","en":"I am concerned that project deadlines have been missed repeatedly.","zh":"我担心项目截止日期多次延误。"},{"role":"HRBP","en":"Have you provided specific feedback and support?","zh":"你是否提供了具体反馈和支持？"},{"role":"Manager","en":"Yes. We should now agree on measurable improvement milestones.","zh":"提供了。现在我们需要确定可衡量的改进里程碑。"},{"role":"HRBP","en":"Let us document the expectations, resources and review dates in the PIP.","zh":"我们把预期、支持资源和复盘日期写入绩效改进计划。"}],"quiz":"What does PIP stand for?","answer":"performance improvement plan","quizZh":"PIP 是什么的缩写？","answerZh":"绩效改进计划"},{"id":"S07","moduleId":"m4","title":"培训需求评估","titleEn":"Assessing learning needs","lines":[{"role":"L&D Partner","en":"Our managers say stakeholder communication is a major challenge.","zh":"经理们反馈，利益相关方沟通是一个主要难点。"},{"role":"HRBP","en":"Should we launch training right away?","zh":"我们应该马上启动培训吗？"},{"role":"L&D Partner","en":"First, we need a training needs assessment to confirm the gaps.","zh":"首先，我们需要通过培训需求评估确认能力差距。"},{"role":"HRBP","en":"Good. Then we can define learning outcomes and choose the format.","zh":"好。之后我们再确定学习成果并选择培训形式。"}],"quiz":"What should be done before choosing the training format?","answer":"training needs assessment","quizZh":"在选择培训形式前应先开展什么工作？","answerZh":"培训需求评估"},{"id":"S08","moduleId":"m4","title":"培训效果复盘","titleEn":"Reviewing training effectiveness","lines":[{"role":"L&D Manager","en":"Course completion reached ninety percent, but has behavior changed?","zh":"课程完成率达到了百分之九十，但行为有改变吗？"},{"role":"Facilitator","en":"We can ask managers to observe whether new skills are used at work.","zh":"我们可以请经理观察员工是否将新技能用于工作。"},{"role":"L&D Manager","en":"That will help us assess learning transfer.","zh":"这有助于评估学习迁移。"},{"role":"Facilitator","en":"Let us collect follow-up evidence after sixty days.","zh":"我们在六十天后收集后续证据。"}],"quiz":"What is the transfer of skills into daily work called?","answer":"learning transfer","quizZh":"将学到的技能运用于日常工作称为什么？","answerZh":"学习迁移／培训成果转化"},{"id":"S09","moduleId":"m5","title":"汇报关系解释","titleEn":"Understanding reporting lines","lines":[{"role":"Employee","en":"Can you explain the reporting line in this organization?","zh":"你能解释一下这个组织中的汇报关系吗？"},{"role":"HRBP","en":"You report directly to the country manager. That is your solid-line report.","zh":"你直接向国家经理汇报，这是你的实线汇报关系。"},{"role":"Employee","en":"And what does the dotted-line relationship mean?","zh":"那虚线汇报关系意味着什么？"},{"role":"HRBP","en":"The regional lead provides functional guidance but is not your direct manager.","zh":"区域负责人提供职能指导，但不是你的直属经理。"}],"quiz":"Which term describes a functional, indirect reporting relationship?","answer":"dotted-line reporting","quizZh":"哪种术语描述职能上的间接汇报关系？","answerZh":"虚线汇报关系"},{"id":"S10","moduleId":"m5","title":"继任计划讨论","titleEn":"Reviewing succession plans","lines":[{"role":"HR Director","en":"Do we have a ready-now successor for the operations director role?","zh":"运营总监岗位有可以立即接任的人选吗？"},{"role":"Talent Partner","en":"Not yet. Two potential successors need more cross-functional exposure.","zh":"暂时没有。两名潜在继任者还需要更多跨职能历练。"},{"role":"HR Director","en":"Can we add job rotation to their development plans?","zh":"我们能把岗位轮换加入他们的发展计划吗？"},{"role":"Talent Partner","en":"Yes. We will review successor readiness again in six months.","zh":"可以。我们将在六个月后再次评估继任者准备度。"}],"quiz":"What is the formal process for preparing future role holders?","answer":"succession planning","quizZh":"为未来关键岗位培养接任者的正式流程叫什么？","answerZh":"继任规划"},{"id":"S11","moduleId":"m6","title":"员工申诉处理","titleEn":"Handling an employee grievance","lines":[{"role":"Employee","en":"I would like to raise a concern about how my complaint was handled.","zh":"我想反映一下我的投诉处理过程存在的问题。"},{"role":"HR Partner","en":"Thank you for telling us. We will explain the grievance procedure.","zh":"谢谢你告知我们。我们会说明员工申诉程序。"},{"role":"Employee","en":"Will the information be kept confidential?","zh":"相关信息会被保密吗？"},{"role":"HR Partner","en":"We will limit access to those who need the information for a fair review.","zh":"我们会把信息访问权限限制在公平审查所必需的人员范围内。"}],"quiz":"Which procedure addresses a formal employee complaint?","answer":"grievance procedure","quizZh":"处理正式员工投诉所使用的程序是什么？","answerZh":"员工申诉程序"},{"id":"S12","moduleId":"m6","title":"调查与合规","titleEn":"Investigating a policy concern","lines":[{"role":"Manager","en":"Someone reported a possible code-of-conduct violation.","zh":"有人举报可能违反行为准则的情况。"},{"role":"HR Partner","en":"We should start an impartial workplace investigation.","zh":"我们应该开展公正的职场调查。"},{"role":"Manager","en":"Should I make a decision before we interview witnesses?","zh":"我们应该在询问证人之前就作出决定吗？"},{"role":"HR Partner","en":"No. Gather the facts first and follow due process.","zh":"不应该。先收集事实并遵守正当程序。"}],"quiz":"What principle requires a fair procedure before a decision?","answer":"due process","quizZh":"什么原则要求在作出决定之前遵循公平程序？","answerZh":"正当程序"},{"id":"S13","moduleId":"m7","title":"敬业度调研复盘","titleEn":"Acting on engagement feedback","lines":[{"role":"People Partner","en":"The engagement survey shows employees want more career conversations.","zh":"敬业度调查显示员工希望有更多职业发展沟通。"},{"role":"Team Lead","en":"How do we show that their feedback matters?","zh":"我们如何让员工感受到他们的反馈受到重视？"},{"role":"People Partner","en":"Agree on visible actions and share progress after the next pulse survey.","zh":"确定可见的改进行动，并在下次脉搏调查后同步进度。"},{"role":"Team Lead","en":"I will start monthly one-on-one development check-ins.","zh":"我会开始每月一次的一对一发展沟通。"}],"quiz":"Which survey is usually short and frequent?","answer":"pulse survey","quizZh":"哪一种调查通常更简短、开展得更频繁？","answerZh":"脉搏调查"},{"id":"S14","moduleId":"m7","title":"心理安全与发言","titleEn":"Creating psychological safety","lines":[{"role":"Manager","en":"People rarely challenge ideas during team meetings.","zh":"大家很少在团队会议上提出不同意见。"},{"role":"HRBP","en":"Psychological safety improves when leaders welcome questions.","zh":"当领导者欢迎提问时，心理安全感会提升。"},{"role":"Manager","en":"What should I do when someone points out a mistake?","zh":"有人指出错误时，我该怎么做？"},{"role":"HRBP","en":"Thank them, ask for details and respond without blaming them.","zh":"感谢对方、询问具体情况，并在回应时避免责备。"}],"quiz":"What term means feeling safe to speak up?","answer":"psychological safety","quizZh":"让员工放心表达意见的心理状态叫什么？","answerZh":"心理安全感"},{"id":"S15","moduleId":"m8","title":"HR数据口径","titleEn":"Aligning people metrics","lines":[{"role":"Analyst","en":"The headcount report and payroll report show different totals.","zh":"人员编制报告和薪资报表的人数不一致。"},{"role":"HR Manager","en":"Could the reports be using different definitions?","zh":"是否可能因为报表采用了不同的统计口径？"},{"role":"Analyst","en":"Yes. We should document headcount and FTE separately in the data dictionary.","zh":"是的。我们应该在数据字典中分别定义人数和全职当量。"},{"role":"HR Manager","en":"Please confirm the calculation rules before the board meeting.","zh":"请在董事会会议前确认计算规则。"}],"quiz":"Which document defines metric calculation rules?","answer":"data dictionary","quizZh":"哪份文件规定指标的定义和计算口径？","answerZh":"数据字典"},{"id":"S16","moduleId":"m8","title":"HR工单与服务","titleEn":"Resolving an HR service ticket","lines":[{"role":"Employee","en":"My leave balance in the HR system looks incorrect.","zh":"我在人事系统里的假期余额似乎不正确。"},{"role":"HR Service Desk","en":"Please open an HR service ticket so we can track the issue.","zh":"请创建一个 HR 服务工单，方便我们跟踪问题。"},{"role":"Employee","en":"How long will it take?","zh":"大约需要多久？"},{"role":"HR Service Desk","en":"Our service level agreement sets a two-working-day response target.","zh":"我们的服务级别协议规定，目标响应时间为两个工作日。"}],"quiz":"What does SLA stand for?","answer":"service level agreement","quizZh":"SLA 是什么的缩写？","answerZh":"服务级别协议"},{"id":"S17","moduleId":"m9","title":"派遣启动会议","titleEn":"Preparing an international assignment","lines":[{"role":"Mobility Lead","en":"The employee will relocate to Singapore for eighteen months.","zh":"员工将派往新加坡工作十八个月。"},{"role":"HRBP","en":"Have we checked work permit and tax residency requirements?","zh":"我们核查过工作许可和税收居民身份要求了吗？"},{"role":"Mobility Lead","en":"The immigration review is underway, and tax advisers are assessing the assignment.","zh":"移民事务审查正在进行，税务顾问也在评估此次派遣。"},{"role":"HRBP","en":"Please include the approved allowances in the assignment letter.","zh":"请把获批的相关津贴写入派遣函。"}],"quiz":"Which document summarizes the terms of an assignment?","answer":"assignment letter","quizZh":"哪份文件概述国际派遣的条件与条款？","answerZh":"派遣函"},{"id":"S18","moduleId":"m9","title":"外派薪资与税务","titleEn":"Coordinating international payroll","lines":[{"role":"Payroll Lead","en":"The employee remains on home-country payroll but works in the host country.","zh":"员工仍通过派出国发薪，但在东道国工作。"},{"role":"Mobility Lead","en":"Do we need shadow payroll for local reporting?","zh":"当地申报是否需要影子薪资核算？"},{"role":"Payroll Lead","en":"Possibly. We need a jurisdiction-specific tax review first.","zh":"有可能。我们需要先按当地法规开展税务评估。"},{"role":"Mobility Lead","en":"Let us document the decision and explain tax equalization separately.","zh":"我们记录决策，并另行解释税负平衡机制。"}],"quiz":"Which payroll process may report income without paying it again?","answer":"shadow payroll","quizZh":"哪种薪资核算流程可以申报收入而不再重复发薪？","answerZh":"影子薪资核算"},{"id":"S19","moduleId":"m10","title":"经营层汇报","titleEn":"Presenting to executives","lines":[{"role":"HR Director","en":"What is the key takeaway from the overseas talent program review?","zh":"海外人才项目复盘的核心结论是什么？"},{"role":"HRBP","en":"The pilot reduced delays, but the approval workflow still needs simplification.","zh":"试点减少了延误，但审批流程仍需简化。"},{"role":"HR Director","en":"Please lead with the recommendation and show the supporting data points.","zh":"请先讲建议方案，再展示支持结论的数据。"},{"role":"HRBP","en":"I will revise the executive summary and share it before the meeting.","zh":"我会修改管理层摘要并在会议前发出。"}],"quiz":"Which section helps executives grasp the key points quickly?","answer":"executive summary","quizZh":"哪个章节帮助管理层快速把握要点？","answerZh":"管理层／经营层摘要"},{"id":"S20","moduleId":"m10","title":"会议跟进","titleEn":"Following up after a meeting","lines":[{"role":"Project Owner","en":"Before we close, can we confirm the next steps?","zh":"结束会议前，我们能确认一下下一步安排吗？"},{"role":"HR Manager","en":"Legal will review the policy, and finance will validate the cost assumptions.","zh":"法务会审阅政策，财务会验证成本假设。"},{"role":"Project Owner","en":"I will capture the action items and owners in the meeting minutes.","zh":"我会在会议纪要里记录行动项和责任人。"},{"role":"HR Manager","en":"Great. Please flag any blockers before Friday.","zh":"很好。如有阻碍事项，请在周五前提出。"}],"quiz":"Where should action owners be documented after the meeting?","answer":"meeting minutes","quizZh":"会议结束后，行动项的负责人应该记录在哪里？","answerZh":"会议纪要"}],"references":[{"name":"SHRM HR Glossary","url":"https://www.shrm.org/topics-tools/tools/hr-glossary"},{"name":"CIPD Profession Map — Talent management","url":"https://www.cipd.org/en/the-people-profession/the-profession-map/explore-the-profession-map/specialist-knowledge/talent-management/"},{"name":"CIPD — Performance management guide","url":"https://www.cipd.org/en/knowledge/guides/effective-performance-management/"},{"name":"ATD — Learning and development","url":"https://www.td.org/talent-development-glossary-terms/what-is-learning-and-development"},{"name":"Acas — Garden leave during notice","url":"https://www.acas.org.uk/notice-periods/when-an-employee-is-not-required-to-work-their-notice"},{"name":"SHRM — Background checks vs reference checks","url":"https://www.shrm.org/in/topics-tools/news/blogs/conducting-candidate-reference-and-background-checks"}],"editorial_note":"V14 发音与双语内容审校：541 术语逐条完成字段完整性/音素词典比对；新增 535 句英文对话中文译文；20 组情景问答补充中文。重点易误读术语依据 Cambridge 核对。其余音标为 CMU 音素词典与 eSpeak 规则推导、未进行真人逐条校音；少量不在词典中的专业术语会标记待核对。"};

function icon(k,cls=''){return '<svg class="i '+cls+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[k]||ICONS.spark)+'</svg>'}
function h(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function ipaView(w,mini=false){
 const note=w.ipaSource==='词典重点校订'?'已针对易误读术语参考词典修订。':'英式发音由英语语音规则生成，美式按词典音素拼合；尚非逐条真人校音。';
 return `<div class="ipa-panel ${mini?'mini':''}" aria-label="英式美式音标" title="${h(note)}">
  ${[['UK','英',w.ipaUK],['US','美',w.ipaUS]].map(([accent,title,ipa])=>`<div class="ipa-row"><span class="accent-label">${title}</span><span class="ipa-text">${ipa?'/'+h(ipa)+'/':'待核验'}</span><button class="ipa-sound" data-play-accent="${accent}" data-word-id="${h(w.id)}" aria-label="播放${title}式发音">${icon('sound','sm')}</button></div>`).join('')}
 <span class="ipa-footnote">${h(w.ipaSource)} · 音频使用本机英／美语音包；复杂术语建议听音核对</span>
 </div>`;
}
function phraseView(w){return `<div class="phrase-translation"><span class="phrase-kicker">常用短语 · 中英对照</span><b>${h(w.collocation||w.term)}</b><small>中文：${h(w.collocationZh||w.zh)}</small>${w.collocationReview==='语义匹配'?'<em class="phrase-note">语义匹配译法，建议结合公司用语核对</em>':''}</div>`}
function speakAccent(id,accent){let w=byId(id);if(!w)return;speechStop();tts(w.speakTerm||w.term,accent==='UK'?'en-GB':'en-US')}

function hashText(str){let hash=2166136261;for(const ch of String(str)){hash=Math.imul(hash^ch.charCodeAt(0),16777619)}return hash>>>0}
function byId(id){return DB.words.find(x=>x.id===id)};
function modById(id){return DB.modules.find(m=>m.id===id)};

 const item=STORE.words[w.id]||{};
 switch(status){
  case 'new':return !item.seen&&(item.level||0)<3;
  case 'learning':return !!item.seen&&(item.level||0)<3;
  case 'mastered':return (item.level||0)>=3;
  case 'favorites':return !!item.favorite;
  case 'due':return !!item.seen&&item.due<=Date.now();
  case 'added':return w.id.startsWith('HRV6');
  default:return true;
 }
}
function filteredWords(){
 const q=state.query.trim().toLowerCase();
 return wordsInScope().filter(w=>hasWordStatus(w,state.filter))
  .sort((a,b)=>q?wordScore(a,q)-wordScore(b,q):0);
}

function sceneRoles(s){return [...new Set(s.lines.map(l=>l.role))]}
function startRoleplay(s){
 speechStop();stopRoleRecognition();
 state.roleplay=true;state.roleplayRole=sceneRoles(s)[1]||sceneRoles(s)[0];
 state.roleplayStep=0;state.roleInput='';state.roleFeedback=null;state.roleReference=false;state.roleplayAnswers={};
}
function stopRoleRecognition(){if(roleRecognizer){try{roleRecognizer.abort()}catch(e){}roleRecognizer=null}state.roleListening=false}
function roleSimilarity(input,ref){
 const key=t=>new Set(String(t).toLowerCase().replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(x=>x.length>2&&!['the','and','for','you','our','that','with','this','are','have','can','will','would','could','should','please','into','from'].includes(x)));
 const expected=key(ref),actual=key(input),matches=[...expected].filter(w=>actual.has(w));
 return {matches,expected:[...expected],pct:expected.size?Math.round(100*matches.length/expected.size):0};
}
function checkRoleAnswer(){
 const s=DB.scenarios.find(x=>x.id===state.sceneId),line=s?.lines[state.roleplayStep];
 if(!line)return;
 const field=document.getElementById('roleAnswer');state.roleInput=(field?.value||state.roleInput||'').trim();
 if(!state.roleInput){toast('请先尝试说出或输入一句英文，也可以查看参考表达');field?.focus();return}
 state.roleFeedback=roleSimilarity(state.roleInput,line.en);state.roleReference=true;
 state.roleplayAnswers[state.roleplayStep]=state.roleInput;render();
}
function advanceRoleplay(){
 const s=DB.scenarios.find(x=>x.id===state.sceneId);if(!s)return;
 const line=s.lines[state.roleplayStep];if(!line)return;
 if(line.role===state.roleplayRole&&!state.roleFeedback&&!state.roleReference){toast('先练习表达，或点“查看参考”后继续');return}
 stopRoleRecognition();state.roleplayStep++;state.roleInput='';state.roleFeedback=null;state.roleReference=false;
 if(state.roleplayStep===s.lines.length){
  STORE.roleplays??={};const key=s.id+'-'+today();
  if(!STORE.roleplays[key]){STORE.roleplays[key]={role:state.roleplayRole,doneAt:new Date().toISOString()};STORE.xp+=5;save();toast('完成角色扮演！+5 XP')}
 }
 render();document.getElementById('roleplayStage')?.scrollIntoView({behavior:'smooth',block:'start'});
}

 ${ended?`<div class="role-done"><div class="role-done-icon">✓</div><h2>本轮角色扮演完成！</h2><p>你完成了 ${s.lines.length} 句双向交流，练习记录已保存到本机。</p><button class="primary" data-action="roleRestart">再练一轮 ${icon('repeat','sm')}</button></div>`:line.role===state.roleplayRole?`

function startRoleMic(){
 const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Rec){toast('当前浏览器不提供语音转写；可直接输入英文，角色扮演仍可完整进行');document.getElementById('roleAnswer')?.focus();return}
 if(!window.isSecureContext){toast('语音识别需要 HTTPS 安全页面；可直接输入英文');return}
 stopRoleRecognition();
 try{
  roleRecognizer=new Rec();const rec=roleRecognizer;
  rec.lang='en-US';rec.interimResults=false;rec.continuous=false;
  const atStep=state.roleplayStep,atScene=state.sceneId;
  rec.onresult=e=>{if(state.sceneId!==atScene||state.roleplayStep!==atStep)return;const heard=[...e.results].map(r=>r[0]?.transcript||'').join(' ').trim();const field=document.getElementById('roleAnswer');state.roleInput=(field?.value?field.value+' ':'')+heard;if(field)field.value=state.roleInput;toast('已转写，可修改后点击“对照我的表达”')};
  rec.onerror=e=>{if(e.error!=='aborted')toast(e.error==='not-allowed'?'麦克风权限未开启，可改用键盘输入':'语音转写失败，可改用键盘输入');state.roleListening=false;roleRecognizer=null;updateRoleMicButton()};
  rec.onend=()=>{state.roleListening=false;roleRecognizer=null;updateRoleMicButton()};
  state.roleListening=true;rec.start();updateRoleMicButton();
 }catch(e){state.roleListening=false;roleRecognizer=null;toast('无法启用语音转写，请输入英文回答')}
}
function updateRoleMicButton(){const b=document.querySelector('[data-action="roleMic"]');if(b)b.innerHTML=icon('mic','sm')+(state.roleListening?' 正在聆听…':' 语音输入（支持时）')}

function makeQuiz(items){let source=items&&items.length?items:DB.words;let pool=[...source].sort(()=>Math.random()-.5).slice(0,Math.min(10,source.length));if(pool.length<4)pool=[...DB.words].sort(()=>Math.random()-.5).slice(0,10);let arr=pool.map(w=>{let others=DB.words.filter(x=>x.id!==w.id&&x.moduleId===w.moduleId).sort(()=>Math.random()-.5).slice(0,3);return{wordId:w.id,options:[w,...others].sort(()=>Math.random()-.5).map(x=>({id:x.id,zh:x.zh})),chosen:null}});return {items:arr,index:0,done:false,credited:false}}

n></div><div class="quiz-box"><span class="quiz-number">CHOOSE THE CORRECT MEANING</span><h2 class="quiz-term">${h(word.term)}</h2><button class="listen" data-play-word="${h(word.id)}">${icon('sound','sm')} 听单词发音</button><div class="quiz-options">${item.options.map((op,i)=>`<button data-answer="${h(op.id)}" ${chosen?'disabled':''} class="quiz-option ${chosen?(op.id===word.id?'correct':op.id===item.chosen?'wrong':''):''}"><span class="letter">${'ABCD'[i]}</span><span>${h(op.zh)}</span>${chosen&&op.id===word.id?icon('check','sm'):''}</button>`).join('')}</div>${chosen?`<div class="quiz-explain"><b>${correct?'回答正确，继续保持！':'差一点！正确答案是 '+h(word.zh)}</b><br>${h(word.definition)}<br><span class="tiny">例句：${h(word.example)}</span><br><span class="tiny example-side-zh">中文：${h(word.exampleZh||'')}</span></div>`:''}<div class="quiz-bottom"><button class="textbtn" data-detail="${h(word.id)}">完整词条 ${icon('right','sm')}</button><button class="primary" data-action="nextQuestion" ${chosen?'':'disabled'}>${idx===total-1?'查看成绩':'下一题'} ${icon('right','sm')}</button></div></div></div>`}

l></span>${icon('right','sm')}</button>`).join('')}<p class="muted tiny">延伸推荐来自相同 HR 专业模块。</p>`,practice:`<h3>请选择最准确的中文释义</h3><div class="quiz-options">${choices.map(c=>`<button class="quiz-option ${state.detailChoice!==null?(c.id===w.id?'correct':state.detailChoice===c.id?'wrong':''):''}" data-detail-answer="${h(c.id)}"><span>${h(c.zh)}</span></button>`).join('')}</div>${state.detailChoice!==null?`<div class="quiz-explain">${state.detailChoice===w.id?'回答正确！':'正确答案：'+h(w.zh)}<br>${h(w.example)}<br><span class="example-side-zh">${h(w.exampleZh||'')}</span></div>`:''}`}[state.detailTab]||'';return `<div class="overlay" data-action="closeOverlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="词条详情：${h(w.term)}"><div class="sheet-handle"></div><div class="sheet-head"><span class="tag lav">${h(modById(w.moduleId)?.title)}</span><button class="iconbtn" data-action="closeDetail" aria-label="关闭详情">${icon('close')}</button></div><h2>${h(w.term)}</h2><div class="sheet-zh">${h(w.zh)}</div>${ipaView(w,true)}<div style="display:flex;gap:10px;margin-top:15px"><button class="listen" data-play-word="${h(w.id)}">${icon('sound','sm')} 设备英语朗读 ${STORE.rate}×</button><button class="listen fav-action ${e.favorite?'active':''}" data-fav="${h(w.id)}" aria-pressed="${!!e.favorite}">${icon('heart','sm')} ${e.favorite?'已收藏':'收藏'}</button></div><nav class="sheet-tabbar" aria-label="词条内容切换">${tabs.map(([id,label])=>`<button class="sheet-tab ${state.detailTab===id?'active':''}" data-detail-tab="${id}">${label}</button>`).join('')}</nav><div class="sheet-section">${body}</div><div class="sheet-footer"><button class="secondary" data-action="detailNext">下一个词条 ${icon('right','sm')}</button><button class="primary" data-action="learnThis">用卡片练习 ${icon('layers','sm')}</button></div></section></div>`}

function portableProgress(){return {version:8,exported:new Date().toISOString(),progress:{...STORE}}}
function validProgress(p){return p&&typeof p==='object'&&p.words&&typeof p.words==='object'&&!Array.isArray(p.words)&&p.days&&typeof p.days==='object'&&Number.isFinite(Number(p.xp||0))}
function applyBackup(parsed){let progress=parsed&&parsed.progress?parsed.progress:parsed;if(!validProgress(progress))throw Error('备份格式不正确');let safeWords={};for(const [id,item] of Object.entries(progress.words)){if(!byId(id)||!item||typeof item!=='object')continue;safeWords[id]={level:Math.max(0,Math.min(5,Number(item.level)||0)),seen:!!item.seen,favorite:!!item.favorite,due:Number.isFinite(+item.due)?+item.due:null,last:Number.isFinite(+item.last)?+item.last:null,lastDay:typeof item.lastDay==='string'?item.lastDay:null};}let safeDays={};for(const [date,n] of Object.entries(progress.days)){if(/^\d{4}-\d{2}-\d{2}$/.test(date))safeDays[date]=Math.max(0,Math.min(1000,Number(n)||0))}STORE={words:safeWords,days:safeDays,roleplays:Object.fromEntries(Object.entries(progress.roleplays||{}).filter(([key,val])=>/^S\d{2}-\d{4}-\d{2}-\d{2}$/.test(key)&&val&&typeof val==='object').slice(0,200)),xp:Math.max(0,Number(progress.xp)||0),dark:!!progress.dark,goal:[5,8,10,15,20].includes(+progress.goal)?+progress.goal:8,rate:[.75,.9,1,1.15].includes(+progress.rate)?+progress.rate:.9};if(!save())throw Error('无法写入本地存储');state.deck=[];state.quiz=null;state.syncOpen=false;nav('me');toast('已恢复 '+Object.keys(safeWords).length+' 个词条的学习数据')}
function bytesTo64(bytes){let binary='';for(let i=0;i<bytes.length;i+=8192){binary+=String.fromCharCode(...bytes.subarray(i,i+8192))}return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64ToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');let b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function generateTransferCode(){let raw=new TextEncoder().encode(JSON.stringify(portableProgress())),bytes=raw,prefix='HRF8-RAW-';if(typeof CompressionStream==='function'){let cs=new CompressionStream('gzip');let writer=cs.writable.getWriter();let result=new Response(cs.readable).arrayBuffer();await writer.write(raw);await writer.close();bytes=new Uint8Array(await result);prefix='HRF8-GZ-'}return prefix+bytesTo64(bytes)}
async function readTransferCode(code){let c=code.replace(/\s+/g,'');let zipped=c.startsWith('HRF8-GZ-');let uncompressed=c.startsWith('HRF8-RAW-');if(!zipped&&!uncompressed)throw Error('不是支持的 HR Fluent V8 迁移码');let bytes=b64ToBytes(c.slice(zipped?8:9));if(bytes.length>400000)throw Error('迁移码过大');if(zipped){if(typeof DecompressionStream!=='function')throw Error('当前浏览器不支持解压迁移码，请改用 JSON 文件备份');let ds=new DecompressionStream('gzip');let writer=ds.writable.getWriter();let result=new Response(ds.readable).arrayBuffer();await writer.write(bytes);await writer.close();bytes=new Uint8Array(await result);}return JSON.parse(new TextDecoder().decode(bytes))}

case'copyCode':{let el=document.getElementById('generatedCode');if(!el?.value){toast('请先生成迁移码');break}copyText(el.value,el);break}
case'restoreCode':{let value=document.getElementById('restoreCode')?.value||'';if(!value.trim()){toast('请先粘贴迁移码');break}if(!confirm('恢复迁移码将覆盖此设备现有的学习记录，确定继续吗？'))break;readTransferCode(value).then(applyBackup).catch(e=>toast('恢复失败：'+e.message));break}
case'backFromQuiz':nav('quiz');break;case'continue':startDeck();nav('study');break;case'showAdded':state.query='';state.module='all';state.filter='added';state.visible=24;nav('words');break;case'flip':if(Date.now()-lastSwipe<350)break;state.flipped=!state.flipped;render();break;case'prev':if(state.deckIndex>0){state.deckIndex--;state.flipped=false;render()}break;case'next':if(state.deckIndex<state.deck.length-1){state.deckIndex++;state.flipped=false;render()}break;case'reshuffle':startDeck();render();toast('新的学习组已准备好');break;case'more':state.visible+=24;render();break;case'clearFilters':state.query='';state.module='all';state.filter='all';state.visible=24;render();break;case'listToDeck':{let a=filteredWords().slice(0,Math.max(1,Number(STORE.goal)||8)).map(w=>w.id);if(a.length===0){toast('当前没有可学习的词汇');break}startDeck(a);nav('study');break}case'backScenes':speechStop();stopRoleRecognition();state.sceneId=null;state.roleplay=false;state.sceneAnswer=false;render();break;
case'stopScene':stopScenePlayback();break;
case'toggleRoleplay':{const sc=DB.scenarios.find(x=>x.id===state.sceneId);if(!sc)break;if(!state.roleplay)startRoleplay(sc);else{stopRoleRecognition();state.roleplay=false}render();break}
case'roleRestart':{const sc=DB.scenarios.find(x=>x.id===state.sceneId);if(sc)startRoleplay(sc);render();break}
case'roleMic':startRoleMic();break;
case'roleCheck':checkRoleAnswer();break;
case'roleReference':state.roleReference=!state.roleReference;render();break;
case'roleNext':advanceRoleplay();break;
case'toggleSceneZh':state.sceneZh=!state.sceneZh;render();break;case'sceneAnswer':state.sceneAnswer=!state.sceneAnswer;render();break;case'newQuiz':startQuiz();render();break;case'nextQuestion':{let q=state.quiz,item=q.items[q.index];if(!item||item.chosen===null)return;if(q.index<q.items.length-1){q.index++}else{q.done=true;if(!q.credited){let n=q.items.filter(i=>i.chosen===i.wordId).length;STORE.xp+=n*5;q.credited=true;save()}}render();break}case'reviewWrong':{let ids=state.quiz.items.filter(i=>i.chosen!==i.wordId).map(i=>i.wordId);startDeck(ids);nav('study');break}case'closeDetail':state.detailId=null;render();break;case'closeOverlay':if(ev.target===btn&&btn.classList.contains('overlay')){state.detailId=null;render()}break;case'detailNext':{let n=DB.words.findIndex(w=>w.id===state.detailId),w=DB.words[(n+1)%DB.words.length];openDetail(w.id);break}case'learnThis':{let w=byId(state.detailId),others=DB.words.filter(x=>x.moduleId===w.moduleId&&x.id!==w.id).slice(0,19);startDeck([w.id,...others.map(x=>x.id)]);nav('study');break}case'dark':STORE.dark=!STORE.dark;save();render();break;case'export':{let blob=new Blob([JSON.stringify({version:8,exported:new Date().toISOString(),progress:STORE},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hr-fluent-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出');break}case'reset':if(confirm('确定清空当前设备的学习进度、收藏和积分吗？此操作不可撤销。')){STORE={words:{},days:{},xp:0,dark:STORE.dark,goal:STORE.goal,rate:STORE.rate};save();state.deck=[];render();toast('学习记录已清空')}break;case'streak':toast(`已连续学习 ${streak()} 天，今日完成 ${todayCount()} 个单词`);break;}}
document.addEventListener('click',ev=>{let b=ev.target.closest('button,[data-action="flip"],.overlay');if(!b)return;if(b.dataset.playAccent){ev.stopPropagation();speakAccent(b.dataset.wordId,b.dataset.playAccent);return}if(b.dataset.playWord){ev.stopPropagation();playWord(b.dataset.playWord);return}if(b.dataset.playScene){ev.stopPropagation();playScene(b.dataset.playScene);return}if(b.dataset.say){ev.stopPropagation();speechStop();tts(b.dataset.say);return}if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.module){setModule(b.dataset.module);return}
if(b.dataset.statusFilter){
 const selected=b.dataset.statusFilter;
 state.filter=state.filter===selected?'all':selected;
 state.visible=24;
 render();
 // Preserve visibility of the status controls after a result list is shortened.
 const filters=document.getElementById('wordStatusFilters');
 if(filters){
  const box=filters.getBoundingClientRect();
  if(box.top<0||box.bottom>window.innerHeight-95)filters.scrollIntoView({block:'start',behavior:'instant'});
 }
 return;
}
if(b.dataset.moduleFilter){state.module=b.dataset.moduleFilter;state.visible=24;render();return}if(b.dataset.rate){rateWord(b.dataset.rate==='1');return}if(b.dataset.scene){speechStop();stopRoleRecognition();state.sceneId=b.dataset.scene;state.roleplay=false;state.sceneAnswer=false;state.sceneReveal=1;state.sceneZh=true;render();window.scrollTo(0,0);return}if(b.dataset.roleSelect){const sc=DB.scenarios.find(x=>x.id===state.sceneId);if(sc&&state.roleplay&&state.roleplayRole!==b.dataset.roleSelect){stopRoleRecognition();state.roleplayRole=b.dataset.roleSelect;state.roleplayStep=0;state.roleInput='';state.roleFeedback=null;state.roleReference=false;state.roleplayAnswers={};render()}return}if(b.dataset.detail){openDetail(b.dataset.detail);return}if(b.dataset.fav){ev.stopPropagation();let e=entry(b.dataset.fav);e.favorite=!e.favorite;save();render();toast(e.favorite?'已加入收藏':'已取消收藏');return}if(b.dataset.detailTab){state.detailTab=b.dataset.detailTab;state.detailChoice=null;render();return}if(b.dataset.detailAnswer){state.detailChoice=b.dataset.detailAnswer;render();return}if(b.dataset.answer){const q=state.quiz,i=q.items[q.index];if(i.chosen!==null)return;i.chosen=b.dataset.answer;render();return}if(b.dataset.action){ev.stopPropagation();handleAction(b.dataset.action,b,ev)}});
document.addEventListener('input',ev=>{if(ev.target.id==='roleAnswer'){state.roleInput=ev.target.value;return}if(ev.target.id==='wordSearch'){state.query=ev.target.value;state.visible=24;let temp=document.createElement('div');temp.innerHTML=wordsView();let res=temp.querySelector('#wordResults');let old=document.querySelector('#wordResults');if(old&&res)old.innerHTML=res.innerHTML;}});
document.addEventListener('change',ev=>{if(ev.target.id==='wordFilter'){state.filter=ev.target.value;state.visible=24;render()}if(ev.target.id==='voiceRate'){STORE.rate=Number(ev.target.value);save();render();toast('朗读速度：'+STORE.rate+'×')}if(ev.target.id==='dailyGoal'){STORE.goal=Number(ev.target.value);state.deck=[];save();render();toast('每日目标已更新；下一组卡片将按新目标生成')}});
document.addEventListener('change',ev=>{if(ev.target?.id!=='progressUpload')return;let f=ev.target.files?.[0];if(!f)return;if(f.size>800000){toast('备份文件过大，无法导入');return}f.text().then(s=>{let parsed=JSON.parse(s);if(confirm('即将用备份覆盖当前学习记录，确定恢复吗？'))applyBackup(parsed)}).catch(e=>toast('导入失败：'+e.message));ev.target.value='';});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.syncOpen){state.syncOpen=false;render();return}if(ev.key==='Escape'&&state.bookmarkOpen){state.bookmarkOpen=false;render();return}if(ev.key==='Escape'&&state.detailId){state.detailId=null;render();return}if(ev.target.matches('input,select'))return;if(state.tab==='study'&&!state.detailId){if(ev.code==='Space'){ev.preventDefault();state.flipped=!state.flipped;render()}else if(ev.key==='ArrowLeft'&&state.deckIndex>0){state.deckIndex--;state.flipped=false;render()}else if(ev.key==='ArrowRight'&&state.deckIndex<state.deck.length-1){state.deckIndex++;state.flipped=false;render()}}});
let swipeX=null;document.addEventListener('touchstart',ev=>{if(ev.target.closest('.tapcard'))swipeX=ev.touches[0].clientX},{passive:true});document.addEventListener('touchend',ev=>{if(swipeX===null)return;let dx=ev.changedTouches[0].clientX-swipeX;swipeX=null;if(Math.abs(dx)<75)return;lastSwipe=Date.now();if(dx<0&&state.deckIndex<state.deck.length-1)state.deckIndex++;if(dx>0&&state.deckIndex>0)state.deckIndex--;state.flipped=false;render();},{passive:true});
render();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
