.head.appendChild(script)}}else{document.addEventListener('DOMContentLoaded',()=>{document.body.textContent='V18.2.2：当前部署路径不受支持。'})}</script><noscript><style>#boot,#root{display:none!important}</style><main class="static-fallback"><h1>HR Fluent V18.2｜中英对照阅读</h1><p>此页面提供 650 个词条及例句。启用 JavaScript 即可使用搜索、闪卡及收藏等功能。</p>
<section><h2>招聘与人才获取</h2>
<details><summary><span lang="en">Job requisition</span> — 招聘申请单</summary><p>正式提出招聘需求并供审批、跟踪的申请记录，通常包括岗位、人数及招聘理由。</p><p lang="en">The recruiter cannot open the vacancy until the job requisition is approved.</p><p>招聘申请获批后，招聘专员才能启动该岗位招聘。</p></details>
<details><summary><span lang="en">Headcount approval</span> — 编制审批</summary><p>对拟新增或补充的人员编制进行授权的流程，通常涉及预算和业务需求。</p><p lang="en">Finance granted headcount approval for three additional analysts.</p><p>财务部门批准了新增三名分析师的编制。</p></details>
<details><summary><span lang="en">Workforce planning</span> — 人力规划</summary><p>根据业务战略预测人员需求与供给，并制定弥补人员数量和能力差距的行动计划。</p><p lang="en">Our workforce planning process includes a review of critical skills.</p><p>我们在人力规划过程中会盘点关键技能。</p></details>
<details><summary><span lang="en">Job description</span> — 岗位说明书（JD）</summary><p>说明岗位职责、工作范围及汇报关系的文件，也可包含任职要求。</p><p lang="en">The job description should distinguish essential duties from occasional tasks.</p><p>岗位说明书应区分核心职责和偶尔承担的任务。</p></details>
<details><summary><span lang="en">Job posting</span> — 职位招聘公告／招聘信息</summary><p>向潜在应聘者发布的职位空缺信息，通常包含职责、要求和申请方式。</p><p lang="en">The job posting lists the location and application deadline.</p><p>招聘公告列出了工作地点和申请截止日期。</p></details>
<details><summary><span lang="en">Employer branding</span> — 雇主品牌建设</summary><p>通过真实员工体验、雇主价值主张及传播活动塑造和维护雇主形象。</p><p lang="en">Employer branding can help candidates understand our workplace culture.</p><p>雇主品牌建设有助于候选人了解我们的职场文化。</p></details>
<details><summary><span lang="en">Candidate sourcing</span> — 人才寻访</summary><p>主动识别、寻找并接触潜在候选人的招聘活动。</p><p lang="en">Candidate sourcing is particularly important for specialist roles.</p><p>对于专业技术岗位，人才寻访尤为重要。</p></details>
<details><summary><span lang="en">Talent pool</span> — 人才库</summary><p>为当前或未来招聘需求而维护的潜在候选人集合。</p><p lang="en">A well-maintained talent pool can support future hiring needs.</p><p>维护良好的人才库可以支持未来招聘需求。</p></details>
<details><summary><span lang="en">Applicant tracking system (ATS)</span> — 招聘管理系统</summary><p>用于管理招聘申请、候选人信息及招聘流程的系统，简称 ATS。</p><p lang="en">The applicant tracking system records each candidate’s current stage.</p><p>招聘管理系统记录每位候选人当前所处的阶段。</p></details>
<details><summary><span lang="en">Resume screening</span> — 简历筛选</summary><p>依据岗位相关标准初步评估简历，确定是否进入后续招聘环节。</p><p lang="en">Resume screening should focus on the requirements of the role.</p><p>简历筛选应聚焦岗位要求。</p></details>
<details><summary><span lang="en">Phone screen</span> — 电话初筛</summary><p>通过简短电话沟通核对候选人的基本条件，初步评估岗位匹配度。</p><p lang="en">I’ve scheduled a phone screen with the candidate for tomorrow.</p><p>我已安排明天与这位候选人进行电话初筛。</p></details>
<details><summary><span lang="en">Screening criteria</span> — 筛选标准</summary><p>在招聘初期用于评估候选人是否满足岗位相关条件、能否进入下一环节的标准。</p><p lang="en">We should align on the screening criteria before reviewing resumes.</p><p>开始筛选简历前，我们应先就筛选标准达成一致。</p></details>
<details><summary><span lang="en">Hiring manager</span> — 用人经理</summary><p>提出或确认岗位需求、评估候选人并参与录用决策的用人部门管理者。</p><p lang="en">The hiring manager wants to meet three shortlisted candidates.</p><p>用人经理希望面试三位入围候选人。</p></details>
<details><summary><span lang="en">Interview panel</span> — 面试小组</summary><p>为某个岗位共同面试和评估候选人的面试官小组。</p><p lang="en">Our interview panel includes HR, engineering and product leaders.</p><p>我们的面试小组包括人力资源、工程和产品部门的负责人。</p></details>
<details><summary><span lang="en">Structured interview</span> — 结构化面试</summary><p>按预先制定的核心问题和统一评分规则评估同一岗位候选人的面试方式。</p><p lang="en">A structured interview helps reduce inconsistent evaluations.</p><p>结构化面试有助于提升面试评价的一致性。</p></details>
<details><summary><span lang="en">Competency-based interview</span> — 胜任力面试</summary><p>以岗位所需的胜任力为框架，通过相关问题收集证据并评估候选人的面试方法。</p><p lang="en">The competency-based interview will focus on stakeholder management.</p><p>此次胜任力面试将重点考察利益相关方管理能力。</p></details>
<details><summary><span lang="en">Behavioral interview</span> — 行为面试</summary><p>通过候选人过去的实际经历收集行为证据，以评估与岗位相关的能力。通常会追问候选人面临的情境、采取的行动和取得的结果。</p><p lang="en">In a behavioral interview, ask for a specific example of conflict resolution.</p><p>在行为面试中，应请候选人举出解决冲突的具体事例。</p></details>
<details><summary><span lang="en">Assessment center</span> — 评价中心</summary><p>通过多项模拟练习，由受训人员按预设标准观察和评估候选人或员工能力的测评方法。</p><p lang="en">The assessment center includes a group exercise and a case presentation.</p><p>此次评价中心测评包括一项小组练习和一次案例展示。</p></details>
<details><summary><span lang="en">Take-home assignment</span> — 独立测评任务</summary><p>招聘中交由候选人在面试之外独立完成并按要求提交的测评任务。</p><p lang="en">We gave the candidate a take-home assignment with a clear deadline.</p><p>我们给候选人布置了一项独立测评任务，并明确了提交期限。</p></details>
<details><summary><span lang="en">Reference check</span> — 职业推荐人核查</summary><p>按适用规定和组织流程联系职业推荐人，了解候选人的相关工作经历、表现和协作情况。</p><p lang="en">We will conduct the reference check after the final interview.</p><p>我们将在终面结束后进行推荐人核查。</p></details>
<details><summary><span lang="en">Background check</span> — 候选人背景调查（背调）</summary><p>在适用法律允许的范围内，按规定履行告知、授权等要求后，对候选人的任职、学历等背景信息进行核实。</p><p lang="en">For this role, the offer is conditional on a satisfactory background check.</p><p>这个岗位的录用以背景调查结果符合要求为前提。</p></details>
<details><summary><span lang="en">Candidate experience</span> — 候选人体验</summary><p>候选人在了解职位、申请、面试和接收录用决定等招聘环节中的整体感受。</p><p lang="en">Timely updates can improve the candidate experience.</p><p>及时告知招聘进展有助于改善候选人体验。</p></details>
<details><summary><span lang="en">Offer letter</span> — 录用通知书</summary><p>以书面形式向候选人提出录用，通常载明岗位、薪酬、拟入职日期及适用的录用条件。</p><p lang="en">Please review the offer letter before sending it to the candidate.</p><p>将录用通知书发送给候选人前，请先审核。</p></details>
<details><summary><span lang="en">Compensation expectations</span> — 薪酬期望</summary><p>候选人对拟入职岗位报酬的预期，可包括基本工资、奖金及其他薪酬项目。</p><p lang="en">We discussed the candidate’s compensation expectations in the first interview.</p><p>我们在首轮面试中讨论了这位候选人的薪酬期望。</p></details>
<details><summary><span lang="en">Salary negotiation</span> — 薪资谈判</summary><p>候选人与雇主围绕基本工资等薪资条件进行协商的过程。</p><p lang="en">Salary negotiations with our preferred candidate are still underway.</p><p>我们仍在与首选候选人进行薪资谈判。</p></details>
<details><summary><span lang="en">Notice period</span> — 离职／解雇通知期</summary><p>员工辞职或雇主终止雇佣时，按适用法律或合同约定应提前通知对方的期限。</p><p lang="en">The candidate has a one-month notice period at the current company.</p><p>该候选人在现公司需履行一个月的离职通知期。</p></details>
<details><summary><span lang="en">Onboarding</span> — 新员工入职与融入</summary><p>新员工完成入职手续、了解制度、熟悉岗位并逐步融入团队的过程。</p><p lang="en">The onboarding plan includes a buddy and first-week check-ins.</p><p>入职计划包括安排一名入职伙伴，并在第一周定期沟通。</p></details>
<details><summary><span lang="en">Probation period</span> — 试用期</summary><p>在适用法律及雇佣安排下设立的入职初期阶段，用于评估员工与岗位的匹配度。</p><p lang="en">We will review performance near the end of the probation period.</p><p>我们会在试用期即将结束时评估其工作表现。</p></details>
<details><summary><span lang="en">Time to fill</span> — 岗位填补周期</summary><p>从招聘需求获批／职位开放到候选人接受录用等特定终点的时间；统计起止点需统一。</p><p lang="en">Our time to fill decreased after we streamlined approvals.</p><p>简化审批流程后，我们的岗位填补周期缩短了。</p></details>
<details><summary><span lang="en">Quality of hire</span> — 招聘质量</summary><p>衡量录用成效的指标或一组指标，通常依据入职后一段时间的表现、留任等信息，具体口径因组织而异。</p><p lang="en">Our quality-of-hire measure combines six-month performance and retention.</p><p>我们的招聘质量指标综合考虑入职六个月时的表现和留任情况。</p></details>
<details><summary><span lang="en">Talent acquisition</span> — 人才获取（TA）</summary><p>为满足组织当前及未来的人才需求而开展的工作，可涵盖雇主品牌、候选人寻访、甄选及录用等环节。</p><p lang="en">Our talent acquisition strategy focuses on engineering skills that are hard to find in the market.</p><p>我们的人才获取策略重点关注市场上紧缺的工程技能。</p></details>
<details><summary><span lang="en">Time to hire</span> — 候选人招聘周期</summary><p>从候选人进入招聘流程到接受录用的时间长度（或企业定义的其他终点）。</p><p lang="en">We reduced time to hire by simplifying interview scheduling.</p><p>简化面试安排后，我们缩短了候选人招聘周期。</p></details>
<details><summary><span lang="en">Sourcing channel</span> — 人才寻访渠道</summary><p>招聘人员用于发现并接触潜在候选人的渠道，如人才平台、专业社群及员工内推。</p><p lang="en">We compare sourcing channels to improve the candidate pipeline.</p><p>我们比较不同寻访渠道的效果，以改善候选人在各招聘阶段的供给情况。</p></details>
<details><summary><span lang="en">Employee referral</span> — 员工内推</summary><p>在职员工向组织推荐外部潜在候选人的做法，也可指一次具体推荐。</p><p lang="en">Employee referrals account for a quarter of our new hires.</p><p>员工内推占我们新入职人数的四分之一。</p></details>
<details><summary><span lang="en">Candidate pipeline</span> — 候选人储备（按招聘阶段跟进）</summary><p>针对某个岗位或岗位类别持续识别、跟进的人选及其所处的招聘阶段。</p><p lang="en">We have several candidates in the pipeline for senior roles, but only one has reached the final interview stage.</p><p>我们正在跟进几位高级岗位的候选人，但只有一位进入了终面阶段。</p></details>
<details><summary><span lang="en">Talent mapping</span> — 人才地图梳理</summary><p>在招聘中，系统了解目标地区、行业和企业中的相关人才分布，为后续寻访提供线索。</p><p lang="en">Talent mapping helps us identify experts in emerging markets.</p><p>梳理人才地图有助于我们识别新兴市场中的专家。</p></details>
<details><summary><span lang="en">Interview scorecard</span> — 面试评分表</summary><p>按统一维度记录候选人面试评分及相关证据的表格。</p><p lang="en">Please complete the interview scorecard before the debrief.</p><p>请在面试复盘会前填写面试评分表。</p></details>
<details><summary><span lang="en">Hiring freeze</span> — 招聘冻结</summary><p>组织在一定时期内暂停或限制部分或全部岗位招聘的措施，适用范围和例外依组织政策而定。</p><p lang="en">Under our hiring freeze, critical vacancies can proceed only with an approved exception.</p><p>按我们的招聘冻结规定，关键空缺岗位也要获得例外审批才能继续招聘。</p></details>
<details><summary><span lang="en">Contingent worker</span> — 灵活用工人员</summary><p>组织为短期、阶段性或按需工作使用的人员。所涉用工形式及法律身份随组织口径和适用规则而异。</p><p lang="en">For this project, we brought in two contingent workers through an approved staffing agency.</p><p>这个项目通过一家获准合作的人力服务机构引入了两位灵活用工人员。</p></details>
<details><summary><span lang="en">Recruitment funnel</span> — 招聘漏斗</summary><p>用各阶段人数和相邻阶段转化率呈现招聘进程的分析方法，具体起止环节可按组织口径设定。</p><p lang="en">Our recruitment funnel shows a drop-off after the technical test.</p><p>招聘漏斗显示，技术测试过后，进入后续环节的人数明显减少。</p></details>
<details><summary><span lang="en">Application form</span> — 求职申请表／应聘申请表</summary><p>候选人应聘某职位时填写的标准化个人与工作背景表单。</p><p lang="en">Please complete the application form before your interview.</p><p>面试前请填写应聘申请表。</p></details>
<details><summary><span lang="en">Campus recruiting</span> — 校园招聘</summary><p>雇主通过高校及相关线上渠道面向在校生和应届毕业生开展的招聘活动。</p><p lang="en">Our campus recruiting campaign starts in September.</p><p>我们的校园招聘活动将于九月启动。</p></details>
<details><summary><span lang="en">External labor market</span> — 外部劳动力市场</summary><p>企业外部劳动力的供给与需求、工资水平和人才流动等市场环境。</p><p lang="en">The external labor market for experienced engineers is tight.</p><p>经验丰富的工程师在外部人才市场上供不应求。</p></details>
<details><summary><span lang="en">Candidate</span> — （招聘）候选人</summary><p>招聘中被考虑或评估是否适合某个岗位的人，可能是主动应聘者，也可能由招聘团队寻访获得。</p><p lang="en">We have shortlisted three candidates for the final interview.</p><p>我们已选出三位候选人参加最终面试。</p></details>
<details><summary><span lang="en">Competency model</span> — 胜任力模型</summary><p>系统描述岗位、岗位族或组织所需的知识、技能和可观察行为等胜任力的框架，可用于招聘、评估与发展。</p><p lang="en">The interview questions are aligned with our competency model.</p><p>面试问题与我们的胜任力模型相匹配。</p></details>
<details><summary><span lang="en">Initial interview</span> — 初轮面试／初试</summary><p>招聘流程中的第一轮面试，用于初步了解候选人的经历、能力及岗位匹配度。</p><p lang="en">The initial interview will focus on your relevant experience.</p><p>首轮面试将重点了解您与该岗位相关的经历。</p></details>
<details><summary><span lang="en">Job analysis</span> — 岗位分析</summary><p>系统收集和分析岗位任务、职责、工作条件和任职所需能力的过程。</p><p lang="en">We completed the job analysis before revising the job description.</p><p>修订岗位说明书前，我们完成了岗位分析。</p></details>
<details><summary><span lang="en">Job requirements and qualifications</span> — 岗位要求与任职资格</summary><p>招聘中对工作条件和任职人员的要求，包括技能、经验、学历、证书或执照等，可区分必备与优先条件。</p><p lang="en">The job requirements and qualifications are listed in the posting.</p><p>招聘信息中列明了岗位要求与任职资格。</p></details>
<details><summary><span lang="en">Behavior-based interview (BBI)</span> — 行为面试（BBI）</summary><p>通过请候选人描述过往实际经历中的情境、个人行动和结果，评估与岗位相关的胜任力。</p><p lang="en">We use behavior-based interviews to assess problem-solving skills.</p><p>我们通过行为面试评估候选人解决问题的能力。</p></details>
<details><summary><span lang="en">Interview guide</span> — 面试提纲／面试指南</summary><p>供面试官组织面试的文件，可包含问题、追问提示、评分标准和流程说明。</p><p lang="en">Please review the interview guide before meeting the candidate.</p><p>与候选人见面前，请先查阅面试指南。</p></details>
<details><summary><span lang="en">Candidate shortlist</span> — 候选人入围名单／候选人短名单</summary><p>经过初步筛选、进入重点评估或面试阶段的候选人名单。</p><p lang="en">The recruiter sent the candidate shortlist to the hiring manager.</p><p>招聘专员将入围候选人名单发给了用人经理。</p></details>
<details><summary><span lang="en">Hiring decision</span> — 录用决策</summary><p>根据岗位需求和评估结果，决定是否录用以及拟录用谁。</p><p lang="en">We need the panel&#x27;s feedback before making the hiring decision.</p><p>作出录用决定前，我们需要面试小组的反馈。</p></details>
<details><summary><span lang="en">Offer acceptance rate</span> — 录用通知接受率</summary><p>在约定统计口径下，被接受的录用通知数占纳入统计的录用通知总数的比例。统计规则应说明待答复或撤回的通知如何处理。</p><p lang="en">Our offer acceptance rate improved after we simplified approvals.</p><p>简化审批流程之后，录用通知接受率提高了。</p></details>
<details><summary><span lang="en">Candidate withdrawal</span> — 候选人退出招聘流程</summary><p>候选人在招聘流程中主动退出面试或拒绝继续参与的情况。</p><p lang="en">We recorded the candidate withdrawal in the ATS.</p><p>我们已在招聘管理系统（ATS）中记录该候选人主动退出。</p></details>
<details><summary><span lang="en">Job advertisement</span> — 岗位招聘广告</summary><p>为吸引求职者申请某个空缺岗位而发布的广告，通常列明岗位要点、应聘条件和申请方式。</p><p lang="en">We updated the job advertisement to reflect the new salary range.</p><p>我们更新了招聘广告，写明新的薪资区间。</p></details>
<details><summary><span lang="en">Interview feedback</span> — 面试反馈／面试评价</summary><p>面试官对候选人能力、表现与岗位匹配度形成的具体评价。</p><p lang="en">Please submit your interview feedback by the end of the day.</p><p>请在今天下班前提交面试反馈。</p></details>
<details><summary><span lang="en">Pre-employment screening</span> — 入职前核验／雇用前筛查</summary><p>在建立雇佣关系或正式入职前，按岗位需要及适用规则核验候选人的任职资格或相关背景。部分流程会在发出有条件录用通知后进行。</p><p lang="en">Before arranging pre-employment screening, the recruiter checks the requirements for the role and location.</p><p>安排入职前核验之前，招聘专员先核对该岗位及工作地点适用的要求。</p></details>
<details><summary><span lang="en">Applicant</span> — 求职申请人／应聘者</summary><p>已针对某个职位提交应聘申请的人员。</p><p lang="en">Each applicant receives a confirmation email.</p><p>每位应聘者都会收到一封确认邮件。</p></details>
<details><summary><span lang="en">Internship program</span> — 实习项目</summary><p>为实习生提供实践经验的结构化项目。</p><p lang="en">We will launch an internship program this summer.</p><p>我们将在今年夏天启动实习项目。</p></details>
<details><summary><span lang="en">Intern</span> — 实习生</summary><p>参加实习以获得工作经验的人员。</p><p lang="en">Each intern will have a designated mentor.</p><p>每位实习生都将有一名指定导师。</p></details>
<details><summary><span lang="en">Hiring</span> — 招聘／录用</summary><p>招募并录用员工的过程。</p><p lang="en">The company decided to freeze hiring for noncritical roles.</p><p>公司决定暂停非关键岗位招聘。</p></details>
<details><summary><span lang="en">Panel interview</span> — 多面试官面试</summary><p>由多位面试官共同面试候选人的形式。</p><p lang="en">The candidate will attend a panel interview tomorrow.</p><p>候选人明天将参加多面试官面试。</p></details>
<details><summary><span lang="en">Make an offer</span> — 发出录用邀请</summary><p>在招聘中，向候选人提出录用并告知相关条件，例如薪资或拟定的到岗日期。</p><p lang="en">We plan to make an offer to the selected candidate next week.</p><p>我们计划下周向选定的候选人发出录用邀请。</p></details>
<details><summary><span lang="en">Backfill</span> — 补招／填补空缺岗位</summary><p>为既有岗位因调动、离职或休假等产生的空缺安排人员，可为临时或长期补位。</p><p lang="en">We need approval to backfill this role, either through an internal transfer or external recruitment.</p><p>我们需要获得审批，通过内部调动或外部招聘填补该岗位空缺。</p></details>
</section>
<section><h2>薪酬激励与福利</h2>
<details><summary><span lang="en">Base salary</span> — 基本工资</summary><p>员工按约定定期获得的固定基本工资，通常与奖金、提成等浮动报酬分开列示。</p><p lang="en">The base salary for this position is reviewed annually.</p><p>该岗位的基本工资每年评估一次。</p></details>
<details><summary><span lang="en">Gross salary</span> — 税前工资</summary><p>扣除个人适用税费及其他工资扣款前的工资金额。</p><p lang="en">The offer letter lists the annual gross salary.</p><p>录用通知书列明了税前年薪。</p></details>
<details><summary><span lang="en">Net pay</span> — 实发工资</summary><p>扣除适用税费及扣款后的到手金额。</p><p lang="en">Your net pay may change when your tax withholding changes.</p><p>当预扣税款发生变化时，您的实发工资也可能改变。</p></details>
<details><summary><span lang="en">Total rewards</span> — 全面回报</summary><p>组织为员工提供的整体回报，通常涵盖薪酬、福利、认可及职业发展等有形或无形回报。</p><p lang="en">Our total rewards approach includes benefits and career development.</p><p>我们的全面回报体系涵盖员工福利和职业发展机会。</p></details>
<details><summary><span lang="en">Compensation package</span> — 薪酬待遇组合</summary><p>针对具体岗位或个人拟定的综合报酬安排，可包括基本工资、奖金、股权及福利，具体项目视方案而定。</p><p lang="en">We put together a competitive compensation package for our preferred candidate.</p><p>我们为首选候选人拟定了一套有竞争力的薪酬待遇方案。</p></details>
<details><summary><span lang="en">Salary band</span> — 薪资区间</summary><p>薪酬体系为某岗位或薪级设定的基本薪资区间，通常有明确的上下限。</p><p lang="en">The proposed starting salary falls within the updated salary band.</p><p>拟定的起薪在更新后的薪资区间内。</p></details>
<details><summary><span lang="en">Pay grade</span> — 薪级／薪酬等级</summary><p>薪酬体系中用于给岗位分级并关联适用薪资区间的等级。</p><p lang="en">The compensation team assigned the new role to pay grade six.</p><p>薪酬团队将新岗位划入第六薪级。</p></details>
<details><summary><span lang="en">Salary benchmark</span> — 薪资基准／市场薪资基准</summary><p>根据市场数据选定、用于比较某岗位或职级薪资水平的参考值。</p><p lang="en">We check the salary benchmark before adjusting the pay range.</p><p>调整薪资区间前，我们会核对市场薪资基准。</p></details>
<details><summary><span lang="en">Market adjustment</span> — 市场调薪</summary><p>根据外部劳动力市场的薪资数据，为保持或恢复薪资竞争力而作的调整。</p><p lang="en">A market adjustment may be needed for scarce technical skills.</p><p>对于紧缺技术人才，可能需要进行市场薪酬调整。</p></details>
<details><summary><span lang="en">Internal equity</span> — 内部薪酬公平性</summary><p>使组织内部岗位及员工间的薪资关系有合理依据的原则，比较时可考虑职责、经验及绩效等相关因素。</p><p lang="en">We reviewed the proposed starting salary for internal equity before approving the offer.</p><p>批准录用方案前，我们先从内部薪酬公平性的角度审查了拟定起薪。</p></details>
<details><summary><span lang="en">Pay transparency</span> — 薪酬透明度</summary><p>向相关人员说明或披露薪资区间、定薪规则及薪酬决策依据的程度。</p><p lang="en">Pay transparency helps employees understand how pay decisions are made.</p><p>提高薪酬透明度有助于员工理解薪酬决策的依据。</p></details>
<details><summary><span lang="en">Pay compression</span> — 薪酬压缩</summary><p>按资历、职责或职级通常应存在的薪资差距缩得过小的现象。</p><p lang="en">Pay compression became a concern after the market adjustment.</p><p>市场调薪后，薪酬压缩问题引起了关注。</p></details>
<details><summary><span lang="en">Annual bonus</span> — 年度奖金</summary><p>以年度为核定周期的奖金，资格、金额和发放时间按适用计划确定。</p><p lang="en">Under our plan, the annual bonus depends on company and individual performance.</p><p>按公司的计划，年度奖金取决于公司业绩和个人绩效。</p></details>
<details><summary><span lang="en">Performance bonus</span> — 绩效奖金</summary><p>与个人、团队或组织绩效挂钩的奖金。</p><p lang="en">The performance bonus is tied to agreed goals.</p><p>绩效奖金与事先约定的目标挂钩。</p></details>
<details><summary><span lang="en">Sign-on bonus</span> — 签约奖金</summary><p>雇主为吸引候选人接受录用邀约并入职提供的额外奖金，支付方式和条件依具体约定而定。</p><p lang="en">The sign-on bonus will be paid under the terms of the offer.</p><p>签约奖金将按录用邀约中的条款发放。</p></details>
<details><summary><span lang="en">Retention bonus</span> — 留任奖金</summary><p>为鼓励现有员工留任至约定日期或完成指定阶段而设置的奖金，资格及付款条件依方案而定。</p><p lang="en">We proposed a retention bonus for the project team.</p><p>我们建议为项目团队设立留任奖金。</p></details>
<details><summary><span lang="en">Commission</span> — 销售提成</summary><p>在销售薪酬中，按规定的交易或业绩口径计算的浮动报酬。</p><p lang="en">The sales team earns commission on eligible deals.</p><p>销售团队可就符合条件的交易获得提成。</p></details>
<details><summary><span lang="en">Incentive plan</span> — 激励计划</summary><p>规定奖励对象、目标或条件、计算口径和兑现方式的方案。</p><p lang="en">The incentive plan should be clear and easy to administer.</p><p>激励计划应清晰易懂，便于执行。</p></details>
<details><summary><span lang="en">Long-term incentive (LTI)</span> — 长期激励</summary><p>以较长的服务期或业绩周期为基础、鼓励员工关注长期成果的奖励安排，可采用股权或现金等形式。</p><p lang="en">The long-term incentive plan is designed for key leaders.</p><p>这项长期激励计划面向关键管理人员。</p></details>
<details><summary><span lang="en">Stock option</span> — 股票期权</summary><p>在计划规定的条件和期限内，按约定行权价买入公司股票的权利。</p><p lang="en">Some employees receive stock options as part of their package.</p><p>部分员工的薪酬方案中包含股票期权。</p></details>
<details><summary><span lang="en">Restricted stock unit (RSU)</span> — 限制性股票单位</summary><p>一种以股票价值计量的奖励单位，满足适用的归属和交付条件后，按计划以股票或等值现金结算。</p><p lang="en">The employee received restricted stock units with a vesting schedule.</p><p>该员工获得了附有归属安排的限制性股票单位。</p></details>
<details><summary><span lang="en">Equity vesting</span> — 股权归属</summary><p>股权奖励达到协议约定的服务期、业绩等条件后，持有人取得相应权利的过程，可一次或分批完成。</p><p lang="en">Equity vesting normally follows the terms of the award agreement.</p><p>股权归属通常依照授予协议的条款执行。</p></details>
<details><summary><span lang="en">Benefits enrollment</span> — 福利登记／福利参保登记</summary><p>员工选择并加入适用福利计划的流程。</p><p lang="en">Benefits enrollment opens next Monday for eligible employees.</p><p>符合条件的员工可于下周一开始办理福利登记。</p></details>
<details><summary><span lang="en">Health insurance</span> — 医疗保险</summary><p>依据保险计划条款分担合资格医疗费用的保障，可作为雇主提供的福利之一。</p><p lang="en">Please check which health insurance options are available locally.</p><p>请核实当地提供哪些医疗保险方案。</p></details>
<details><summary><span lang="en">Retirement plan</span> — 退休保障计划／退休福利计划</summary><p>为退休后提供收入或积累储蓄的安排，可采用按公式给付、账户缴费等模式。</p><p lang="en">Retirement plan rules can vary by country and employer.</p><p>退休计划规则可能因国家和雇主而异。</p></details>
<details><summary><span lang="en">Paid time off (PTO)</span> — 带薪休假</summary><p>员工按适用规定或组织政策可以带薪休假的时间，具体涵盖哪些类别因制度而异。</p><p lang="en">Employees can request paid time off through the HR system.</p><p>员工可通过人力资源系统申请带薪休假。</p></details>
<details><summary><span lang="en">Payroll cycle</span> — 薪资核算与发放周期／发薪周期</summary><p>工资核算与支付的固定节奏。</p><p lang="en">Our payroll cycle closes on the last working day of the month.</p><p>我们每月的薪资核算在最后一个工作日截止。</p></details>
<details><summary><span lang="en">Tax withholding</span> — 税款预扣／代扣税款</summary><p>在薪资场景中，由发薪方依据适用税务规则从工资中预先扣缴税款，也可指相应扣款。</p><p lang="en">The payroll team checks which tax withholding rules apply to employees who work across borders.</p><p>薪资团队会核对跨境工作人员适用哪些税款预扣规则。</p></details>
<details><summary><span lang="en">Overtime pay</span> — 加班工资／加班报酬</summary><p>对符合条件且超过适用工时标准或约定的工作时间支付的工资，资格及支付标准依适用规定和用工安排而定。</p><p lang="en">The payroll team checks the applicable overtime pay rules before processing the extra hours.</p><p>薪资团队在处理额外工时前，会核对适用的加班工资规则。</p></details>
<details><summary><span lang="en">Merit increase</span> — 绩效加薪</summary><p>以员工绩效为主要依据上调其基本薪资的做法，资格和增幅按适用政策确定。</p><p lang="en">Merit increases are considered during the annual compensation review.</p><p>年度薪酬评审期间会考虑绩效加薪。</p></details>
<details><summary><span lang="en">Compa-ratio</span> — 薪资与区间中点比率</summary><p>员工基本薪资除以对应薪资区间中点所得的比率，分子和分母应采用相同的计薪周期、币种及工时口径。</p><p lang="en">A compa-ratio below one means pay is below the range midpoint.</p><p>比率低于 1，表示员工的基本薪资低于对应薪资区间中点。</p></details>
<details><summary><span lang="en">Pay range midpoint</span> — 薪资区间中点</summary><p>组织设定的薪资区间中间参考值，可用于定薪比较和计算薪资与区间中点比率。</p><p lang="en">We use the pay range midpoint to compare base salaries within a grade.</p><p>我们用薪资区间中点作为参照，比较同一薪级内的基本薪资。</p></details>
<details><summary><span lang="en">Salary survey</span> — 薪酬调查</summary><p>按岗位、级别或地区等口径收集、整理市场薪酬数据的调查。</p><p lang="en">We use a salary survey to benchmark critical positions.</p><p>我们使用薪酬调查数据对关键岗位的薪酬做市场对标。</p></details>
<details><summary><span lang="en">Variable pay</span> — 浮动薪酬</summary><p>金额或支付随个人、团队或组织业绩等约定条件变化的薪酬部分，例如按业绩计算的提成或奖金。</p><p lang="en">Variable pay can account for a larger share of compensation in sales than in support roles.</p><p>与支持类岗位相比，销售岗位的浮动薪酬占比可能更高。</p></details>
<details><summary><span lang="en">Target bonus</span> — 目标奖金</summary><p>奖金计划为达到规定目标时设定的参考发放水平，可用金额或基本薪资的百分比表示。</p><p lang="en">The target bonus is fifteen percent of annual base salary.</p><p>目标奖金为年度基本工资的 15%。</p></details>
<details><summary><span lang="en">Pay-for-performance</span> — 绩效付薪</summary><p>使员工、团队或组织的绩效结果影响基本薪资调整、奖金等薪酬决定的原则或机制。</p><p lang="en">Our pay-for-performance policy uses clear evaluation criteria.</p><p>我们的绩效付薪政策采用明确的评价标准。</p></details>
<details><summary><span lang="en">Benefits eligibility</span> — 福利资格／福利参与资格</summary><p>根据福利计划条款和适用规定，员工是否满足参加某项福利或获得保障的条件。</p><p lang="en">Benefits eligibility depends on the applicable plan rules and may vary by employee group.</p><p>福利资格由适用计划的规则决定，不同员工类别的条件可能不同。</p></details>
<details><summary><span lang="en">Flexible benefits</span> — 弹性福利</summary><p>允许员工在计划规定的项目、组合或额度内选择福利的安排。</p><p lang="en">Flexible benefits let employees choose options that fit their needs.</p><p>弹性福利让员工能在计划范围内选择适合自己需求的项目。</p></details>
<details><summary><span lang="en">Pay equity</span> — 薪酬公平性</summary><p>考察可比工作和不同员工群体间的薪酬差异是否有与工作相关的合理依据，具体比较标准应结合适用规定。</p><p lang="en">The pay equity review compares roles with similar responsibilities and considers relevant pay factors.</p><p>薪酬公平性审查会比较职责相近的岗位，并考虑相关的定薪因素。</p></details>
<details><summary><span lang="en">Deferred compensation</span> — 递延薪酬</summary><p>按事先约定在未来日期或约定事件发生时支付的报酬，具体支付条件依相关协议和规定确定。</p><p lang="en">Part of the executive’s pay package is structured as deferred compensation.</p><p>这名高管的薪酬方案有一部分采用递延薪酬形式。</p></details>
<details><summary><span lang="en">Tuition reimbursement</span> — 学费报销／员工学费报销</summary><p>企业福利计划按规定报销员工参加获批课程、学位项目或继续教育发生的学费。</p><p lang="en">Under our policy, employees can apply for tuition reimbursement after completing an approved course.</p><p>按我们的政策，员工完成获批课程后可申请学费报销。</p></details>
<details><summary><span lang="en">Tuition assistance</span> — 员工学费资助</summary><p>雇主为员工教育培训提供的财务支持，可能通过预付、补贴或报销实现。</p><p lang="en">Our tuition assistance program supports job-related degree courses.</p><p>我们的学费资助计划覆盖与工作相关的学位课程。</p></details>
<details><summary><span lang="en">Education assistance program</span> — 员工教育资助计划</summary><p>雇主按制度支持员工教育或职业学习的福利计划，可覆盖获批的课程、学位或认证等费用。</p><p lang="en">The education assistance program covers selected professional courses.</p><p>员工教育资助计划涵盖部分专业课程。</p></details>
<details><summary><span lang="en">Reimbursement policy</span> — 费用报销政策</summary><p>明确可报销支出、额度、审批、凭证及付款时间的公司规则。</p><p lang="en">Please check the reimbursement policy before paying the course fee.</p><p>支付课程费用前，请先查看报销政策。</p></details>
<details><summary><span lang="en">Benefits package</span> — 员工福利组合／福利待遇方案</summary><p>雇主提供的保险、休假、学习补助等福利项目的组合，具体内容依雇主制度和适用规定而定。</p><p lang="en">The benefits package includes medical coverage and learning support.</p><p>福利方案包括医疗保障和学习支持。</p></details>
<details><summary><span lang="en">Salary review</span> — 薪资评审／调薪评审</summary><p>依据岗位、市场水平、绩效或预算等因素，评估现有薪资是否需要调整的过程。</p><p lang="en">The annual salary review will take place in March.</p><p>年度薪资评审将于三月进行。</p></details>
<details><summary><span lang="en">Pay slip</span> — 工资单／薪资明细单</summary><p>按发薪周期列示应发工资、税费及其他扣款、实发金额等内容的凭单。</p><p lang="en">Employees can download their pay slips from the HR portal.</p><p>员工可以从人力资源门户下载工资单。</p></details>
<details><summary><span lang="en">Salary increase</span> — 加薪／基本薪资上调</summary><p>员工基本薪资提高，可因绩效、晋升或市场调整等发生。</p><p lang="en">The salary increase will take effect next month.</p><p>此次加薪将于下个月生效。</p></details>
<details><summary><span lang="en">Promotion increase</span> — 晋升加薪</summary><p>雇主依据薪资政策，在员工晋升时对其基本薪资作出的上调。</p><p lang="en">In this case, the promotion increase takes effect on the promotion date.</p><p>这次晋升加薪与晋升在同一天生效。</p></details>
<details><summary><span lang="en">Cost-of-living adjustment (COLA)</span> — 生活成本调整（COLA）</summary><p>为应对生活成本变化而作的工资或津贴调整，具体机制依制度。</p><p lang="en">The company approved a cost-of-living adjustment for eligible employees.</p><p>公司批准按生活成本变化为符合条件的员工调整薪资。</p></details>
<details><summary><span lang="en">Bonus eligibility</span> — 奖金资格／奖金领取资格</summary><p>员工是否符合奖金计划规定的参与或发放条件，具体取决于适用计划条款及相关规定。</p><p lang="en">Under this plan, bonus eligibility depends on an employee’s status at the end of the quarter.</p><p>按这项计划，奖金资格取决于员工在季度末的任职状态。</p></details>
<details><summary><span lang="en">Total cash compensation</span> — 现金薪酬总额</summary><p>指定期间内的基本工资与纳入统计口径的现金奖金、佣金等现金薪酬之和，可按目标额或实发额列示。</p><p lang="en">The offer includes a breakdown of total cash compensation.</p><p>录用方案列明了现金薪酬总额的构成。</p></details>
<details><summary><span lang="en">Employee stock purchase plan (ESPP)</span> — 员工股票购买计划</summary><p>允许符合条件的员工按计划规则购买公司股票的安排，参与资格、付款方式和购买条件依计划而定。</p><p lang="en">Eligible employees can enroll in the company’s employee stock purchase plan during the enrollment period.</p><p>符合条件的员工可在报名期内参加公司的员工股票购买计划。</p></details>
<details><summary><span lang="en">Dependent care assistance</span> — 受扶养人照护支持／家属照护补助</summary><p>雇主为照护符合条件的子女或其他受扶养人提供的支持，可采取费用补助、报销或提供照护服务等形式，具体依计划及适用规定。</p><p lang="en">The benefits team introduced dependent care assistance this year.</p><p>福利团队今年推出了受扶养人照护支持项目。</p></details>
<details><summary><span lang="en">Wellness allowance</span> — 员工健康津贴</summary><p>雇主依据政策为健身、身心健康活动等合资格支出提供的津贴或补助。</p><p lang="en">Employees can use the wellness allowance for eligible fitness activities.</p><p>员工可将健康津贴用于符合规定的健身活动。</p></details>
<details><summary><span lang="en">Payroll deduction</span> — 工资扣款／工资代扣款项</summary><p>工资核算时按适用规定或有效授权从应发工资中扣除的款项，例如代扣税款或由员工承担的福利缴费。</p><p lang="en">Check that the payroll deduction matches the amount on the benefits enrollment form.</p><p>请核对工资扣款金额是否与福利登记表上的金额一致。</p></details>
<details><summary><span lang="en">Housing provident fund</span> — 住房公积金</summary><p>中国内地的住房专项储金制度，通常由适用单位和职工按规定缴存。缴存和使用涉及当地执行规则。</p><p lang="en">Employees can check their housing provident fund contributions online.</p><p>员工可以在线查询住房公积金缴存记录。</p></details>
<details><summary><span lang="en">Annual incentive plan (AIP)</span> — 年度激励计划</summary><p>以年度绩效周期为依据的激励安排，通常列明适用对象、考核指标及奖励计算规则。</p><p lang="en">The annual incentive plan links bonuses to business results.</p><p>年度激励计划将奖金与经营业绩挂钩。</p></details>
<details><summary><span lang="en">Short-term incentive (STI)</span> — 短期激励</summary><p>通常以一年或更短周期为基础的激励。</p><p lang="en">The company offers a short-term incentive tied to quarterly results.</p><p>公司提供与季度业绩挂钩的短期激励。</p></details>
<details><summary><span lang="en">Allowance</span> — 津贴／补贴</summary><p>雇主针对特定开支、工作条件或派遣安排发放的津贴或补贴。</p><p lang="en">Employees on assignment receive a travel allowance under the policy.</p><p>根据政策，派遣员工可获得差旅津贴。</p></details>
<details><summary><span lang="en">Insurance</span> — 保险</summary><p>通过保险合同转移约定风险的保障安排。</p><p lang="en">HR explains the insurance coverage during onboarding.</p><p>人力资源部门在员工入职时说明保险保障范围。</p></details>
<details><summary><span lang="en">Pension plan</span> — 养老金计划</summary><p>为成员退休后提供养老金的安排，给付方式、缴费规则和适用资格因计划及地区而异。</p><p lang="en">Eligible employees can contribute to the pension plan.</p><p>符合条件的员工可以向养老金计划缴费。</p></details>
<details><summary><span lang="en">Pay mix</span> — 薪酬组合</summary><p>基本薪资和浮动薪酬等组成部分在某一薪酬口径中的比例配置。</p><p lang="en">We increased the variable pay component of the pay mix for sales roles.</p><p>我们提高了销售岗位薪酬组合中浮动薪酬的占比。</p></details>
<details><summary><span lang="en">Salary range penetration</span> — 薪酬区间渗透率</summary><p>衡量实际薪资在指定薪资区间内的相对位置，通常按（实际薪资－区间下限）÷（区间上限－区间下限）计算，区间宽度须大于零。</p><p lang="en">Her salary range penetration is 50 percent because her salary is halfway between the range minimum and maximum.</p><p>她的工资处于区间最低值与最高值的正中间，因此区间渗透率为50%。</p></details>
<details><summary><span lang="en">Broadbanding</span> — 宽带薪酬</summary><p>把多个较窄的薪级合并为数量更少、跨度更大的薪酬带的薪酬结构设计方式。</p><p lang="en">After introducing broadbanding, the company went from twelve pay grades to four broad bands.</p><p>采用宽带薪酬后，公司把原来的十二个薪级合并为四个宽薪酬带。</p></details>
<details><summary><span lang="en">Pay progression</span> — 薪酬增长／薪酬增长机制</summary><p>员工的薪资在既定薪酬框架内随时间上升的过程，或管理这一过程的规则。</p><p lang="en">Pay progression may depend on skills, performance or time in the role.</p><p>薪酬增长可能取决于技能、绩效或任职时间。</p></details>
<details><summary><span lang="en">Market pricing</span> — 市场薪酬定价</summary><p>将本企业岗位与外部调查中的可比岗位匹配，并参考外部薪酬数据为本企业岗位设定有竞争力的薪酬水平。</p><p lang="en">We use market pricing to establish competitive pay ranges for comparable jobs.</p><p>我们通过市场薪酬定价为可比岗位制定具有竞争力的薪酬区间。</p></details>
<details><summary><span lang="en">Job-based pay</span> — 岗位薪酬</summary><p>主要依据岗位职责、要求和相对价值确定薪酬的方式。</p><p lang="en">A job-based pay structure links pay primarily to the value of the job.</p><p>岗位薪酬体系主要将薪酬与岗位价值挂钩。</p></details>
<details><summary><span lang="en">Skill-based pay</span> — 技能薪酬</summary><p>根据员工掌握并能证明具备的相关技能确定或调整薪酬的方式。</p><p lang="en">Skill-based pay rewards employees for acquiring and demonstrating relevant skills.</p><p>技能薪酬对员工掌握并展示相关技能给予薪酬回报。</p></details>
<details><summary><span lang="en">Bonus pool</span> — 奖金池</summary><p>在特定考核周期或激励计划下，可供分配的奖金总额。</p><p lang="en">The company sets the bonus pool based on its financial results and incentive plan rules.</p><p>公司根据财务业绩及激励计划规则确定奖金池。</p></details>
<details><summary><span lang="en">Clawback provision</span> — 追回条款</summary><p>在规定条件和适用规则下，要求返还或以其他方式追回已支付或已授予报酬的合同、政策或计划条款。</p><p lang="en">The incentive plan includes a clawback provision for specified circumstances.</p><p>该激励计划包含适用于特定情形的追回条款。</p></details>
<details><summary><span lang="en">Performance shares</span> — 绩效股份（股权激励）</summary><p>以企业或个人达到预设绩效条件为依据，确定实际获得或归属数量的股份类激励。</p><p lang="en">The number of performance shares earned depends on the achievement of specified performance goals.</p><p>最终获得的绩效股份数量取决于规定绩效目标的达成情况。</p></details>
<details><summary><span lang="en">Vesting schedule</span> — 归属时间表</summary><p>列明激励权益在何时及按何种节奏归属的时间安排，归属仍须满足计划条件。</p><p lang="en">The vesting schedule specifies when employees acquire rights to their equity awards, subject to plan conditions.</p><p>归属时间表规定员工在满足计划条件时何时取得股权奖励相关权利。</p></details>
<details><summary><span lang="en">Benefits harmonization</span> — 福利制度整合</summary><p>协调不同组织或员工群体的福利安排，使制度在可行范围内衔接或逐步趋同。</p><p lang="en">HR is reviewing both companies’ benefit plans as part of benefits harmonization after the merger.</p><p>作为并购后福利制度整合的一部分，HR正在审查两家公司的福利计划。</p></details>
</section>
<section><h2>绩效管理</h2>
<details><summary><span lang="en">Performance cycle</span> — 绩效周期</summary><p>从设定目标到持续跟踪、沟通反馈和阶段或期末评价的一轮绩效管理过程。</p><p lang="en">Our performance cycle begins with goal setting in January.</p><p>我们的绩效周期从一月设定目标开始。</p></details>
<details><summary><span lang="en">Goal setting</span> — 目标设定</summary><p>确定预期成果、优先事项、时限和达成标准的过程。</p><p lang="en">Effective goal setting requires clear priorities.</p><p>有效的目标设定需要明确优先事项。</p></details>
<details><summary><span lang="en">SMART goals</span> — SMART 目标</summary><p>按 SMART 标准表述的目标，通常要求具体、可衡量、可实现、与工作重点相关并有明确时限。</p><p lang="en">Managers help employees write SMART goals for the quarter.</p><p>管理者协助员工设定本季度的 SMART 目标。</p></details>
<details><summary><span lang="en">Key performance indicators (KPIs)</span> — 关键绩效指标</summary><p>用于持续跟踪某项关键业务或工作表现的可衡量指标。</p><p lang="en">The team tracks key performance indicators in a monthly report.</p><p>团队在月报中跟踪关键绩效指标。</p></details>
<details><summary><span lang="en">Objectives and key results (OKRs)</span> — 目标与关键结果</summary><p>由目标和用于验证目标达成程度的关键结果组成的目标管理框架。</p><p lang="en">We review our OKRs at the end of each quarter.</p><p>我们在每个季度末回顾目标与关键结果（OKR）。</p></details>
<details><summary><span lang="en">Performance review</span> — 绩效评估</summary><p>对员工在一定周期内的工作表现和成果进行的正式回顾或评价，也可讨论后续目标和发展安排。</p><p lang="en">The performance review should include specific evidence.</p><p>绩效评估应包含具体的事实依据。</p></details>
<details><summary><span lang="en">Self-assessment</span> — 自我评价／绩效自评</summary><p>绩效评估中，员工对照目标和标准反思、说明自身表现并提供事例的做法，也指形成的书面材料。</p><p lang="en">Please submit your self-assessment before the manager review.</p><p>请在直属主管开展评估前提交绩效自评。</p></details>
<details><summary><span lang="en">Peer feedback</span> — 同事反馈</summary><p>由同级同事或实际协作的同事就工作表现、行为或合作方式提供的反馈。</p><p lang="en">Peer feedback can highlight collaboration strengths.</p><p>同事反馈能够帮助发现团队协作方面的优势。</p></details>
<details><summary><span lang="en">360-degree feedback</span> — 360 度反馈</summary><p>从多个角色收集对同一员工工作行为或能力的反馈，来源可包括上级、同事、下属或员工本人。</p><p lang="en">We use 360-degree feedback for leadership development.</p><p>我们用 360 度反馈支持领导力发展。</p></details>
<details><summary><span lang="en">Calibration meeting</span> — 绩效校准会</summary><p>评估者共同核对绩效标准、评级和事实依据，以提高不同团队评价尺度一致性的会议。</p><p lang="en">The calibration meeting will review ratings across departments.</p><p>绩效校准会将审查各部门的绩效评级。</p></details>
<details><summary><span lang="en">Performance rating</span> — 绩效等级</summary><p>依据绩效标准对员工在某一周期内的表现给出的等级。</p><p lang="en">Each performance rating must be supported by evidence.</p><p>每个绩效等级都须有事实依据。</p></details>
<details><summary><span lang="en">Rating scale</span> — 评分量表</summary><p>用于划分和解释评分档位的一套标准，通常包含等级名称及各档的含义。</p><p lang="en">The new rating scale has five clearly defined levels.</p><p>新的评分量表有五个等级，每一级都有明确定义。</p></details>
<details><summary><span lang="en">Competency framework</span> — 胜任力模型</summary><p>按岗位或层级组织能力要求的一套框架，可包含通用能力、专业能力及相应行为标准。</p><p lang="en">The competency framework defines what effective coaching looks like at each management level.</p><p>胜任力模型说明了各管理层级应如何有效辅导员工。</p></details>
<details><summary><span lang="en">Behavioral indicators</span> — 行为指标</summary><p>用于判断某项胜任力是否体现出来的可观察行为描述，可按熟练程度分级。</p><p lang="en">Behavioral indicators show managers what to look for when assessing a competency.</p><p>行为指标说明经理评估某项胜任力时应观察哪些表现。</p></details>
<details><summary><span lang="en">Continuous feedback</span> — 持续反馈</summary><p>在日常工作中持续、及时地交流对工作表现的观察、肯定和改进建议。</p><p lang="en">Continuous feedback helps employees adjust quickly.</p><p>持续反馈有助于员工及时调整工作方式。</p></details>
<details><summary><span lang="en">One-on-one meeting</span> — 一对一会议</summary><p>两人单独进行的工作沟通。在绩效管理中，常指经理与员工定期讨论近况、困难和发展需求的会议。</p><p lang="en">The one-on-one meeting is a good time to discuss blockers.</p><p>碰到工作卡点，可以在一对一会议上讨论。</p></details>
<details><summary><span lang="en">Mid-year check-in</span> — 年中绩效回顾</summary><p>在年度绩效周期中途回顾目标进展、讨论所需支持，并按需要调整后续安排的沟通。</p><p lang="en">We use the mid-year check-in to revisit priorities.</p><p>我们借年中绩效回顾重新审视工作重点。</p></details>
<details><summary><span lang="en">Year-end review</span> — 年终绩效评估</summary><p>在年度绩效周期末回顾工作成果、行为表现和发展情况的正式评估。</p><p lang="en">The year-end review will focus on results and lessons learned.</p><p>年终绩效评估将着重讨论工作成果和经验教训。</p></details>
<details><summary><span lang="en">Performance improvement plan (PIP)</span> — 绩效改进计划</summary><p>针对具体绩效差距设定改进目标、期限、支持措施和评估方式的正式计划。</p><p lang="en">The performance improvement plan specifies weekly targets and the support available to the employee.</p><p>绩效改进计划明确了每周目标以及员工可获得的支持。</p></details>
<details><summary><span lang="en">Underperformance</span> — 绩效不达标</summary><p>工作表现低于岗位要求或约定的绩效标准。</p><p lang="en">Managers should address underperformance with timely feedback.</p><p>发现绩效不达标时，经理应及时给出反馈。</p></details>
<details><summary><span lang="en">High performer</span> — 高绩效员工</summary><p>在一段时间内持续达到较高绩效水平的员工，具体标准由组织明确。</p><p lang="en">The high performer took on a challenging cross-team project.</p><p>这位高绩效员工承担了一项具有挑战性的跨团队项目。</p></details>
<details><summary><span lang="en">Stretch goal</span> — 挑战性目标</summary><p>高于通常绩效预期、需要额外努力或新的做法才有望实现的目标。</p><p lang="en">We agreed on a stretch goal for the next quarter.</p><p>我们商定了下一季度的一项挑战性目标。</p></details>
<details><summary><span lang="en">Goal alignment</span> — 目标对齐</summary><p>使组织、团队和个人目标相互支持，并协调跨团队优先事项的过程或状态。</p><p lang="en">Goal alignment helps everyone focus on shared priorities.</p><p>目标对齐有助于大家把精力放在共同的重点上。</p></details>
<details><summary><span lang="en">Performance gap</span> — 绩效差距</summary><p>按同一口径比较时，实际工作表现与预期绩效标准之间的差距。</p><p lang="en">We found a performance gap in on-time project delivery.</p><p>我们发现项目按时交付的表现没有达到预期。</p></details>
<details><summary><span lang="en">Development plan</span> — 发展计划</summary><p>列明拟提升的能力、学习实践、支持资源及检视安排的成长计划。</p><p lang="en">The development plan includes training and mentoring.</p><p>发展计划包括培训和导师指导。</p></details>
<details><summary><span lang="en">Recognition</span> — 员工认可与表彰</summary><p>通过感谢、表扬或奖励，对员工的具体贡献和积极行为表示肯定。</p><p lang="en">Regular recognition can reinforce desired behaviors.</p><p>经常肯定员工的具体表现，有助于强化组织倡导的工作行为。</p></details>
<details><summary><span lang="en">Promotion readiness</span> — 晋升准备度</summary><p>员工在多大程度上已具备承担目标职级或更高职责的能力和相关经验。</p><p lang="en">Promotion readiness requires evidence beyond strong current performance.</p><p>判断员工是否准备好晋升，还需考察其当前岗位绩效以外的证据。</p></details>
<details><summary><span lang="en">Manager assessment</span> — 直属经理评价</summary><p>由直属经理在绩效流程中根据工作成果、行为表现等对员工做出的评价。</p><p lang="en">The manager assessment should reference observable outcomes.</p><p>直属经理在评价中应引用可核实的工作成果。</p></details>
<details><summary><span lang="en">Rating bias</span> — 绩效评分偏差</summary><p>绩效评分因近期印象、单一突出特征等与评估标准无关的因素而发生的系统性偏移。</p><p lang="en">Calibration helps us reduce rating bias across teams.</p><p>绩效校准有助于减少团队之间的评分偏差。</p></details>
<details><summary><span lang="en">Performance documentation</span> — 绩效记录</summary><p>记录绩效目标、反馈、工作实例与评估决定的材料，包括纸质或电子记录。</p><p lang="en">Good performance documentation supports fair decisions.</p><p>完整的绩效记录有助于作出公正判断。</p></details>
<details><summary><span lang="en">Performance calibration</span> — 绩效校准</summary><p>跨经理或团队对照同一绩效标准和相关证据，复核初步评级的一致性。</p><p lang="en">Performance calibration should be based on documented evidence.</p><p>绩效校准应以有记录可查的证据为依据。</p></details>
<details><summary><span lang="en">Performance conversation</span> — 绩效沟通</summary><p>经理与员工围绕工作目标、实际表现、改进措施和发展需要进行的双向交流。</p><p lang="en">A good performance conversation includes specific examples.</p><p>有效的绩效沟通会结合具体事例。</p></details>
<details><summary><span lang="en">Goal cascading</span> — 目标逐级分解</summary><p>将组织目标逐级转化为下属团队或个人可执行、可衡量的目标。</p><p lang="en">Goal cascading connects team priorities to business strategy.</p><p>通过逐级分解目标，团队的工作重点可以与业务战略衔接。</p></details>
<details><summary><span lang="en">Balanced scorecard</span> — 平衡计分卡</summary><p>把战略目标转化为多维度指标与行动的管理工具，经典框架包括财务、客户、内部流程、学习与成长四个视角。</p><p lang="en">The balanced scorecard tracks financial and nonfinancial outcomes.</p><p>平衡计分卡用于跟踪财务和非财务成果。</p></details>
<details><summary><span lang="en">Performance threshold</span> — 绩效门槛</summary><p>取得某项绩效评级、获得特定激励资格或进入后续评估所需达到的最低绩效要求。</p><p lang="en">Under this plan, teams must meet a performance threshold to qualify for an incentive payout.</p><p>根据本方案，团队须达到绩效门槛，才有资格获得激励奖金。</p></details>
<details><summary><span lang="en">Improvement milestone</span> — 改进里程碑</summary><p>绩效改进过程中，在约定时间前需要达到并可核验的阶段性成果。</p><p lang="en">The first improvement milestone is to complete five handovers in a row without missing a required field.</p><p>第一个改进里程碑是连续完成五次交接，每次都填齐必填项。</p></details>
<details><summary><span lang="en">Evidence-based assessment</span> — 基于证据的评估</summary><p>按既定标准，依据可核查的工作成果、行为记录等材料作出的评估。</p><p lang="en">Evidence-based assessment uses work samples and documented outcomes to support rating decisions.</p><p>基于证据的评估以工作样本和有记录的成果为评级提供依据。</p></details>
<details><summary><span lang="en">Goal weighting</span> — 目标权重</summary><p>绩效评价中各项目标在综合评价所占的比例，或分配这些比例的方法。</p><p lang="en">Goal weighting reflects each objective&#x27;s relative importance.</p><p>目标权重反映各项目标在综合评估中的相对重要性。</p></details>
<details><summary><span lang="en">Feedback loop</span> — 反馈闭环</summary><p>收集并处理反馈、向反馈者说明采取的行动或处理决定，再跟踪结果的循环。</p><p lang="en">We need a feedback loop to verify the changes are working.</p><p>我们需要建立反馈闭环，确认改动是否奏效。</p></details>
<details><summary><span lang="en">Career conversation</span> — 职业发展面谈</summary><p>经理、导师或 HR 与员工探讨职业兴趣、长期方向和可尝试的发展机会的交流。</p><p lang="en">At our company, managers hold career conversations twice a year.</p><p>在我们公司，经理每年与员工开展两次职业发展面谈。</p></details>
<details><summary><span lang="en">Performance appraisal</span> — 员工绩效考核／评价</summary><p>根据岗位目标和绩效标准对员工在一定周期的工作表现作出正式评价。</p><p lang="en">The annual performance appraisal includes an assessment by the employee’s manager.</p><p>年度绩效考核包括直属主管对员工表现的评估。</p></details>
<details><summary><span lang="en">Performance feedback</span> — 绩效反馈</summary><p>根据具体工作行为或结果，向员工说明表现及其影响，肯定有效做法或讨论改进方向的沟通。</p><p lang="en">Managers should provide specific performance feedback throughout the year.</p><p>管理者应在全年持续提供具体的绩效反馈。</p></details>
<details><summary><span lang="en">Rating distribution</span> — 绩效等级分布</summary><p>各个绩效等级中员工人数或占比的分布情况。</p><p lang="en">HR reviewed the rating distribution before calibration.</p><p>人力资源团队在绩效校准前检查了各等级的分布情况。</p></details>
<details><summary><span lang="en">Forced distribution</span> — 绩效强制分布法</summary><p>要求将员工以预设人数、比例或区间分配到各绩效等级的评价办法。</p><p lang="en">The company decided not to use forced distribution this year.</p><p>公司决定今年不采用强制分布法。</p></details>
<details><summary><span lang="en">Performance objective</span> — 绩效目标</summary><p>在绩效周期内对员工或团队明确设定的工作成果与要求。</p><p lang="en">Each performance objective should have clear success criteria.</p><p>每项绩效目标都应有明确的达成标准。</p></details>
<details><summary><span lang="en">Key result</span> — 关键结果（OKR）</summary><p>用于衡量目标是否实现的可验证结果，属于 OKR 框架的一部分。</p><p lang="en">We revised the key result to include a clear metric.</p><p>我们修订了关键结果，加入明确的衡量指标。</p></details>
<details><summary><span lang="en">Performance evidence</span> — 绩效事实依据</summary><p>支撑绩效评价的具体工作成果、数据与可核实行为记录。</p><p lang="en">The manager collected performance evidence before the review.</p><p>经理在绩效评估前收集了绩效事实依据。</p></details>
<details><summary><span lang="en">Goal achievement rate</span> — 目标达成率</summary><p>按预先约定的公式衡量一个或多个目标完成程度的比率，常用百分比表示。</p><p lang="en">The goal achievement rate is one input into the review.</p><p>目标达成率是绩效评估的参考因素之一。</p></details>
<details><summary><span lang="en">Mid-year performance review</span> — 年中绩效回顾／年中绩效评估</summary><p>在绩效年度中段回顾目标进展、工作成果和后续安排，可按组织流程调整目标或作中期评价。</p><p lang="en">The mid-year performance review will include development goals.</p><p>年中绩效回顾将涵盖个人发展目标。</p></details>
<details><summary><span lang="en">Performance rating appeal</span> — 绩效评级申诉</summary><p>员工对绩效评级提出异议，并按适用程序申请正式复核的做法。</p><p lang="en">Under our policy, employees have ten working days after receiving their rating to submit a performance rating appeal.</p><p>按公司政策，员工可在收到评级后的十个工作日内提交绩效评级申诉。</p></details>
<details><summary><span lang="en">Manager effectiveness</span> — 管理者效能／管理效能</summary><p>管理者在带领团队达成目标、提供工作支持和发展员工等方面的实际效果。</p><p lang="en">The survey collects employees’ views on manager effectiveness across departments.</p><p>这项调查收集各部门员工对管理者效能的看法。</p></details>
<details><summary><span lang="en">Continuous performance management</span> — 持续绩效管理</summary><p>在绩效周期内通过定期目标回顾、具体反馈和辅导来支持员工表现的管理方式，可与正式年度考核并行。</p><p lang="en">Continuous performance management encourages timely coaching.</p><p>持续绩效管理鼓励管理者及时辅导员工。</p></details>
<details><summary><span lang="en">Align on goals</span> — 就目标达成一致</summary><p>就目标达成共同理解和一致意见。</p><p lang="en">Let&#x27;s align on goals before the next review cycle.</p><p>我们在下一轮评估周期开始前先就目标达成一致吧。</p></details>
<details><summary><span lang="en">Goals</span> — 目标</summary><p>希望在一定时期内实现的工作结果。</p><p lang="en">Managers should set measurable goals with employees.</p><p>管理者应与员工共同设定可衡量的目标。</p></details>
</section>
<section><h2>学习培训与人才发展</h2>
<details><summary><span lang="en">Learning needs analysis</span> — 学习需求分析</summary><p>从业务目标和目标人群出发，识别知识与技能差距，并判断培训、辅导或在岗实践等学习支持能否弥补差距。</p><p lang="en">We completed a learning needs analysis before designing the program.</p><p>在设计培训项目之前，我们完成了学习需求分析。</p></details>
<details><summary><span lang="en">Learning objective</span> — 学习目标</summary><p>课程或学习活动旨在让学员掌握并能展示的知识、技能或行为。</p><p lang="en">Each module has a measurable learning objective.</p><p>每个课程模块都有可衡量的学习目标。</p></details>
<details><summary><span lang="en">Training roadmap</span> — 培训路线图</summary><p>围绕业务或能力目标，按阶段安排培训项目、实施顺序和关键节点的规划。</p><p lang="en">The training roadmap covers the next two quarters.</p><p>培训路线图涵盖未来两个季度。</p></details>
<details><summary><span lang="en">Training budget</span> — 培训预算</summary><p>为一定时期内的培训活动及相关支出安排的经费，可涵盖讲师、课程、工具和场地等费用。</p><p lang="en">The training budget has been approved for this year.</p><p>今年的培训预算已经获批。</p></details>
<details><summary><span lang="en">Onboarding curriculum</span> — 新员工入职课程体系</summary><p>按入职阶段安排的学习内容与活动组合，帮助新员工熟悉组织、岗位及开展工作所需的工具与规则。</p><p lang="en">The onboarding curriculum includes product and security training.</p><p>新员工入职课程体系包含产品和安全培训。</p></details>
<details><summary><span lang="en">Instructor-led training</span> — 讲师主导式培训</summary><p>由讲师实时讲解、组织练习和回答问题的培训，可在线下现场或线上同步进行。</p><p lang="en">Instructor-led training gives participants time to discuss complex cases with the instructor.</p><p>在讲师主导式培训中，学员有时间与讲师讨论复杂案例。</p></details>
<details><summary><span lang="en">Virtual classroom</span> — 线上课堂</summary><p>供讲师与学员远程同步上课和互动的在线环境，常支持讨论、演示及分组活动。</p><p lang="en">The virtual classroom allows participants to ask questions.</p><p>学员可以在线上课堂实时提问。</p></details>
<details><summary><span lang="en">E-learning</span> — 在线学习</summary><p>借助电子设备和数字内容开展的学习，在企业培训中多指通过网络平台学习课程。</p><p lang="en">Our self-paced e-learning course lets employees choose when to study.</p><p>这门按个人进度学习的在线课程允许员工自行安排学习时间。</p></details>
<details><summary><span lang="en">Learning management system (LMS)</span> — 学习管理系统</summary><p>用于分配和发布课程、管理报名并记录学习进度及完成情况的平台。</p><p lang="en">The learning management system tracks course completion.</p><p>学习管理系统用于跟踪课程完成情况。</p></details>
<details><summary><span lang="en">Blended learning</span> — 混合式学习</summary><p>将线上学习与讲师指导、现场活动或实操等环节有计划地结合起来，使不同环节服务于同一组学习目标。</p><p lang="en">Blended learning combines short videos with workshops.</p><p>混合式学习将短视频与工作坊结合起来。</p></details>
<details><summary><span lang="en">Microlearning</span> — 微学习</summary><p>将学习内容组织成短小单元，每个单元围绕一个具体主题或学习目标。</p><p lang="en">Microlearning is useful for quick policy refreshers.</p><p>微学习适合快速复习公司政策。</p></details>
<details><summary><span lang="en">Training attendance</span> — 培训出勤情况</summary><p>员工是否参加培训的情况，可按需要记录到场、线上签到或实际参训时长。</p><p lang="en">Training attendance rose from 18 to 24 after we moved the session to the afternoon.</p><p>培训改到下午后，出勤人数从 18 人增加到 24 人。</p></details>
<details><summary><span lang="en">Completion rate</span> — 培训／课程完成率</summary><p>在约定统计期间内，符合课程完成条件的人数占所选统计人群的比例，分母可为应学人数、报名人数或实际参训人数。</p><p lang="en">The completion rate reached 92 percent this month.</p><p>本月的课程完成率达到了92%。</p></details>
<details><summary><span lang="en">Knowledge check</span> — 知识测验</summary><p>用简短题目或任务检验学员是否掌握课程要点，结果常用于即时反馈。</p><p lang="en">A short knowledge check follows each lesson.</p><p>每节课后都有一次简短的知识测验。</p></details>
<details><summary><span lang="en">Skills assessment</span> — 技能评估</summary><p>通过实操任务、工作样本或测验，按明确标准判断某项技能的掌握程度。</p><p lang="en">The skills assessment identified gaps in data analysis.</p><p>技能评估发现了数据分析方面的技能差距。</p></details>
<details><summary><span lang="en">Competency gap</span> — 胜任力差距</summary><p>个人或团队当前展现的胜任力水平与岗位或业务所需水平之间的差距。</p><p lang="en">We found a competency gap in stakeholder communication.</p><p>我们发现，与岗位要求相比，利益相关方沟通能力仍有差距。</p></details>
<details><summary><span lang="en">Upskilling</span> — 技能提升</summary><p>在现有岗位或职业领域中学习新的相关技能，或提高已有技能水平，以应对职责变化。</p><p lang="en">Upskilling helps employees adapt to new tools.</p><p>提升技能有助于员工适应新工具。</p></details>
<details><summary><span lang="en">Reskilling</span> — 转岗技能再培训</summary><p>帮助员工掌握不同岗位或显著不同的工作任务所需的新技能的培养过程。</p><p lang="en">Reskilling supports employees moving into new roles.</p><p>转岗技能再培训帮助员工为承担新岗位的工作做好准备。</p></details>
<details><summary><span lang="en">Coaching</span> — 教练式辅导</summary><p>围绕具体工作或发展目标，通过提问、观察与反馈，帮助个人反思并尝试改进的辅导。</p><p lang="en">Coaching helps managers improve decision-making skills.</p><p>教练式辅导帮助管理者提升决策能力。</p></details>
<details><summary><span lang="en">Mentoring</span> — 导师指导</summary><p>由具有相关经验的导师与学员建立发展关系，持续提供职业建议、经验分享和反思支持。</p><p lang="en">Our mentoring program matches new managers with experienced colleagues.</p><p>我们的导师计划为新任经理匹配经验丰富的同事。</p></details>
<details><summary><span lang="en">Job shadowing</span> — 跟岗学习</summary><p>跟随有经验的同事观察真实工作流程、判断和操作，以了解岗位如何运作。</p><p lang="en">Job shadowing helps new hires understand customer support.</p><p>跟岗学习有助于新员工了解客户支持工作。</p></details>
<details><summary><span lang="en">Cross-training</span> — 交叉培训</summary><p>让团队成员学习其他岗位或同事负责的任务，以便协作或在需要时补位。</p><p lang="en">Cross-training allows team members to cover critical tasks.</p><p>交叉培训让团队成员能在需要时相互补位，承担关键任务。</p></details>
<details><summary><span lang="en">Learning path</span> — 学习路径</summary><p>为达到岗位或能力目标而安排的课程、练习和在岗任务的学习顺序。</p><p lang="en">The learning path includes beginner and advanced modules.</p><p>该学习路径包括初级和高级课程模块。</p></details>
<details><summary><span lang="en">Leadership development</span> — 领导力发展</summary><p>有计划地培养引导团队、制定方向、作出决策和带动协作等领导能力。</p><p lang="en">Leadership development is a priority in our program for new managers.</p><p>领导力发展是我们新任经理培养项目的重点。</p></details>
<details><summary><span lang="en">Management trainee program</span> — 管理培训生项目（管培生计划）</summary><p>通常面向职业早期人才，通过有计划的轮岗、培训和项目实践，为未来承担管理及相关业务职责作准备。</p><p lang="en">The management trainee program includes rotations across functions.</p><p>管理培训生项目包括跨职能轮岗。</p></details>
<details><summary><span lang="en">Individual development plan (IDP)</span> — 个人发展计划</summary><p>由员工制定或与经理共同制定的个人成长计划，列明发展目标、行动、支持资源和进度安排。</p><p lang="en">At our company, employees can update their individual development plans each quarter.</p><p>在我们公司，员工可以每季度更新个人发展计划。</p></details>
<details><summary><span lang="en">70-20-10 model</span> — 70-20-10 学习模型</summary><p>用约 70% 的工作实践、20% 的他人互动、10% 的正式学习说明多渠道培养的参考模型。</p><p lang="en">The 70-20-10 model reminds us to include on-the-job learning.</p><p>70-20-10 学习模型提醒我们把在岗实践纳入培养方案。</p></details>
<details><summary><span lang="en">Learning transfer</span> — 学习迁移</summary><p>学习者把学到的知识、技能或做法应用到实际工作，并在后续工作中持续使用的过程。</p><p lang="en">Manager follow-ups can improve learning transfer.</p><p>经理的后续跟进有助于员工把所学用到工作中。</p></details>
<details><summary><span lang="en">Training effectiveness</span> — 培训有效性</summary><p>培训在多大程度上实现预定目标，可依据知识技能、工作行为或业务结果的变化评估。</p><p lang="en">We’ll evaluate the training’s effectiveness three months after the last workshop.</p><p>我们会在最后一场工作坊结束三个月后评估培训效果。</p></details>
<details><summary><span lang="en">Return on learning investment</span> — 学习投入回报</summary><p>衡量学习项目的可归因收益相对于项目成本的水平。按货币口径计算投资回报率时，从可归因的货币收益中减去总成本，再除以总成本。</p><p lang="en">To estimate the return on learning investment, we compared the cost of the course with the savings attributable to it.</p><p>为估算学习投入回报，我们将课程成本与可归因于该课程的成本节省额作了比较。</p></details>
<details><summary><span lang="en">Training needs assessment (TNA)</span> — 培训需求评估</summary><p>结合业务、岗位和员工表现来识别能力缺口，并判断哪些问题适合通过培训解决、哪些人需要什么培训。</p><p lang="en">The training needs assessment identified gaps in stakeholder communication.</p><p>培训需求评估发现了利益相关方沟通方面的能力差距。</p></details>
<details><summary><span lang="en">Instructional design</span> — 教学设计</summary><p>根据学习者的需求和预期学习成果，系统设计并评估课程内容、练习、反馈及测评方式的过程。</p><p lang="en">In instructional design, we use the intended learning outcomes to choose activities and assessments.</p><p>进行教学设计时，我们根据预期学习成果选择活动和测评方式。</p></details>
<details><summary><span lang="en">Learning outcome</span> — 学习成果</summary><p>学习者完成学习后预期能展示，或经评估已经展示的知识、技能或行为。</p><p lang="en">The learning outcome for this module is the ability to classify three types of service request.</p><p>本模块的预期学习成果是学员能够对三类服务请求进行分类。</p></details>
<details><summary><span lang="en">Facilitator</span> — 引导师</summary><p>在培训或工作坊中设计或主持互动环节，引导参与者讨论、反思并形成下一步行动的人。</p><p lang="en">The facilitator asked each group to share one lesson from the exercise.</p><p>引导师请每组分享一项从练习中得到的收获。</p></details>
<details><summary><span lang="en">Learning analytics</span> — 学习数据分析</summary><p>收集和分析学习活动、进度、结果及相关情境的数据，用于了解学习过程和改进培训。</p><p lang="en">Learning analytics shows which courses have low completion rates.</p><p>学习数据分析显示哪些课程的完成率偏低。</p></details>
<details><summary><span lang="en">Capability building</span> — 能力建设</summary><p>通过人才培养、流程改进和工具支持等措施，建立个人、团队或组织持续开展某类工作的能力。</p><p lang="en">Capability building is central to our digital transformation plan.</p><p>能力建设是我们数字化转型计划的核心。</p></details>
<details><summary><span lang="en">Learning agility</span> — 学习敏捷性</summary><p>在陌生或变化的情境中从经验和反馈中学习，并能调整做法、把所学用于后续任务的能力。</p><p lang="en">Our talent review considers learning agility when discussing leadership potential.</p><p>我们在人才盘点时，会把学习敏捷性纳入对领导潜力的讨论。</p></details>
<details><summary><span lang="en">Peer learning</span> — 同伴学习</summary><p>经验相近或面对相似任务的人通过交流经验、互相示范和反馈开展的学习。</p><p lang="en">Peer learning sessions help teams share practical techniques.</p><p>同伴学习活动帮助团队分享实用技巧。</p></details>
<details><summary><span lang="en">Action learning</span> — 行动学习</summary><p>小组围绕真实业务问题，通过提问、采取行动和反思来推进问题解决与成员学习的方法。</p><p lang="en">Action learning teams work on live business challenges.</p><p>行动学习小组会围绕真实的业务难题开展工作。</p></details>
<details><summary><span lang="en">Kirkpatrick model</span> — 柯氏四级评估模型</summary><p>从反应、学习、行为和结果四个层次评估培训，各层次分别关注学员体验、知识技能等学习成效、工作应用和预期业务结果的实现情况。</p><p lang="en">We use the Kirkpatrick model to plan how we’ll evaluate the training.</p><p>我们用柯氏四级评估模型来规划如何评估这次培训。</p></details>
<details><summary><span lang="en">Professional development</span> — 职业能力发展／专业发展</summary><p>帮助员工提升当前和未来岗位所需能力的持续学习发展过程。</p><p lang="en">We support professional development through internal courses.</p><p>我们通过内部课程支持员工发展职业能力。</p></details>
<details><summary><span lang="en">Certification reimbursement</span> — 专业认证费用报销</summary><p>雇主按制度偿付员工取得或维持获认可的专业认证所支出的合资格费用，具体项目取决于政策。</p><p lang="en">Our certification reimbursement policy covers exam fees for approved certifications.</p><p>公司的专业认证费用报销政策涵盖获批准的认证考试费用。</p></details>
<details><summary><span lang="en">Training repayment agreement</span> — 培训费用返还协议</summary><p>雇主承担培训费用时，约定员工在特定可适用条件下可能返还部分或全部合资格费用的协议。条款效力和可返还范围依适用法律及具体事实而定。</p><p lang="en">HR reviewed the training repayment agreement with legal counsel.</p><p>人力资源部门与法律顾问一起审查了培训费用返还协议。</p></details>
<details><summary><span lang="en">Learning stipend</span> — 学习津贴／个人学习额度</summary><p>雇主按制度为符合条件的员工提供的个人学习经费，通常设定固定金额或可用上限。</p><p lang="en">At our company, eligible employees receive an annual learning stipend.</p><p>在我们公司，符合条件的员工每年可获得学习津贴。</p></details>
<details><summary><span lang="en">Continuing education</span> — 继续教育／在职进修</summary><p>员工为更新知识、提升技能或获得资格持续参加的正规或非正规教育。</p><p lang="en">The policy supports continuing education related to the role.</p><p>该政策支持与岗位相关的继续教育。</p></details>
<details><summary><span lang="en">Professional certification</span> — 职业认证／专业资格认证</summary><p>由专业机构或其他认证组织按其标准认定个人具备某一专业领域所需知识、技能或经验的资格。</p><p lang="en">This role requires a relevant professional certification.</p><p>该岗位要求持有相关职业认证。</p></details>
<details><summary><span lang="en">Training nomination</span> — 培训人员提名／选派</summary><p>管理者或部门推荐特定员工参加培训课程或培养项目的流程或提名。</p><p lang="en">Managers must submit training nominations by Friday.</p><p>管理者须最迟于周五提交培训提名。</p></details>
<details><summary><span lang="en">Mandatory training</span> — 强制性培训／必修培训</summary><p>根据适用法规、岗位要求或组织政策，指定员工必须完成的培训。</p><p lang="en">Under our onboarding policy, new hires must complete their mandatory training within 30 days of starting.</p><p>按公司的入职政策，新员工须在入职后 30 天内完成必修培训。</p></details>
<details><summary><span lang="en">Skills matrix</span> — 员工技能矩阵</summary><p>按员工与技能维度列示能力水平、资格或培训差距的工具。</p><p lang="en">The skills matrix helps us identify capability gaps.</p><p>技能矩阵有助于我们识别技能缺口。</p></details>
<details><summary><span lang="en">Training evaluation</span> — 培训效果评估</summary><p>评估培训质量及成效的过程，可根据目标考察学员反馈、学习成果、工作中的应用或业务结果。</p><p lang="en">We will conduct a training evaluation after the program.</p><p>培训项目结束后，我们将开展培训效果评估。</p></details>
<details><summary><span lang="en">Learning budget</span> — 学习与发展预算</summary><p>组织用于课程、平台、教材及其他学习发展的资金计划。</p><p lang="en">The learning budget covers both internal and external training.</p><p>学习预算涵盖内部和外部培训。</p></details>
<details><summary><span lang="en">External training provider</span> — 外部培训服务商</summary><p>向组织提供培训课程、授课人员或其他培训服务的外部机构或个人。</p><p lang="en">We selected an external training provider for the leadership program.</p><p>我们为领导力项目选择了一家外部培训机构。</p></details>
<details><summary><span lang="en">Course completion certificate</span> — 课程结业证明／课程结业证书</summary><p>由课程提供方出具、证明学员按要求完成课程的文件。</p><p lang="en">Please upload your course completion certificate for reimbursement.</p><p>请上传课程结业证明，以便申请报销。</p></details>
<details><summary><span lang="en">Education benefit eligibility</span> — 教育福利申领资格</summary><p>员工按组织政策获得学费报销、教育资助等福利的资格，通常取决于员工和所选课程是否符合规定条件。</p><p lang="en">Under our policy, education benefit eligibility depends on length of service and prior course approval.</p><p>按公司政策，员工能否申领教育福利取决于司龄以及课程是否事先获批。</p></details>
<details><summary><span lang="en">Career development</span> — 职业发展</summary><p>个人在职业生涯中积累经验、发展能力并拓展职业机会的过程。</p><p lang="en">Managers should discuss career development with their team members.</p><p>管理者应与团队成员讨论职业发展。</p></details>
<details><summary><span lang="en">Training and development (T&amp;D)</span> — 培训与发展</summary><p>通过培训和发展活动提升员工当前及未来岗位能力。</p><p lang="en">We invest in training and development to build future capabilities.</p><p>我们对培训与发展投入资源，以培养未来所需的能力。</p></details>
<details><summary><span lang="en">Orientation training</span> — 新员工入职培训</summary><p>帮助新员工了解组织、制度及基本工作要求的入职培训。</p><p lang="en">New hires attend orientation training in their first week.</p><p>新员工在入职第一周参加入职培训。</p></details>
<details><summary><span lang="en">Skills training</span> — 技能培训</summary><p>针对具体工作技能开展的培训。</p><p lang="en">We provide skills training for new supervisors.</p><p>我们为新任主管提供技能培训。</p></details>
<details><summary><span lang="en">Learning and development (L&amp;D)</span> — 学习与发展</summary><p>组织促进员工学习、能力提升与发展的职能。</p><p lang="en">She leads learning and development for the region.</p><p>她负责该区域的学习与发展工作。</p></details>
<details><summary><span lang="en">Training program</span> — 培训项目</summary><p>围绕明确学习目标设计的培训活动组合。</p><p lang="en">We designed a training program for first-time managers.</p><p>我们为初任管理者设计了培训项目。</p></details>
<details><summary><span lang="en">Workshop</span> — 工作坊／研讨式培训</summary><p>以参与和实践为主的专题学习活动。</p><p lang="en">HR will facilitate a workshop on feedback skills.</p><p>HR将主持一场反馈技巧工作坊。</p></details>
<details><summary><span lang="en">Skills gap analysis</span> — 技能差距分析</summary><p>将个人或团队现有技能与工作所需的技能对照，找出差距，为培训、招聘或人员调配提供依据。</p><p lang="en">A skills gap analysis helped us identify training priorities.</p><p>技能差距分析帮助我们确定培训重点。</p></details>
<details><summary><span lang="en">Certification</span> — 认证／资格认证</summary><p>由相关机构确认符合特定标准或资格的过程或结果。</p><p lang="en">For this credential, employees must pass a practical assessment to obtain certification.</p><p>员工须通过实操考核，才能获得这项资格认证。</p></details>
<details><summary><span lang="en">Soft skills</span> — 软技能</summary><p>沟通、协作等非技术性能力。</p><p lang="en">The program helps employees develop soft skills such as communication and teamwork.</p><p>该项目帮助员工培养沟通与团队协作等软技能。</p></details>
<details><summary><span lang="en">Hard skills</span> — 硬技能／专业技术技能</summary><p>可在具体任务中展示和评估的技术或专业技能，例如焊接、编程或对账。</p><p lang="en">The interview includes a test to assess hard skills.</p><p>面试包含一项评估专业技能的测试。</p></details>
</section>
<section><h2>组织与人才发展（OD/TD）</h2>
<details><summary><span lang="en">Organization development (OD)</span> — 组织发展</summary><p>通过有计划地改善组织的协作、流程、文化等系统因素，提升组织效能和应对变化的能力。</p><p lang="en">Organization development focuses on long-term organizational effectiveness.</p><p>组织发展着眼于提高组织的长期效能。</p></details>
<details><summary><span lang="en">Talent development (TD)</span> — 人才发展</summary><p>通过培训、在岗实践、辅导和职业发展机会，系统提升员工能力，满足当前和未来的人才需求。</p><p lang="en">Our talent development strategy includes technical career paths as well as management training.</p><p>我们的人才发展战略既包括技术职业发展通道，也包括管理培训。</p></details>
<details><summary><span lang="en">Organization design</span> — 组织设计</summary><p>根据业务目标安排组织结构、职责分工、决策权限与协作方式的过程及其形成的方案。</p><p lang="en">The new organization design puts product and engineering in the same delivery teams.</p><p>新的组织设计将产品人员和工程人员编入同一批交付团队。</p></details>
<details><summary><span lang="en">Operating model</span> — 组织运营模式／组织运作模式</summary><p>描述组织如何配置人员、流程、技术和决策权限，以持续实现业务目标的运作安排。</p><p lang="en">The operating model specifies which decisions are made at headquarters and which are made by local teams.</p><p>组织运营模式明确哪些事项由总部统一决策，哪些由各地团队自行决策。</p></details>
<details><summary><span lang="en">Org chart</span> — 组织架构图</summary><p>展示组织内团队、岗位及汇报关系的图表，可按需要附上员工姓名或空缺状态。</p><p lang="en">Please update the org chart after the reorganization.</p><p>组织重组后，请更新组织架构图。</p></details>
<details><summary><span lang="en">Span of control</span> — 管理幅度</summary><p>一位管理者直接管理的人数，具体测量也可按直接汇报的岗位数统计。</p><p lang="en">A wide span of control may affect coaching capacity.</p><p>直接下属较多时，经理可能更难腾出时间辅导员工。</p></details>
<details><summary><span lang="en">Reporting line</span> — 汇报关系</summary><p>岗位或员工向哪位管理者汇报并承担相应责任的关系，可包括主要和辅助汇报关系。</p><p lang="en">The new reporting line becomes effective next month.</p><p>新的汇报关系将于下个月生效。</p></details>
<details><summary><span lang="en">Role clarity</span> — 职责清晰度</summary><p>员工对自身工作范围、责任、决策权限及与其他岗位分工的理解程度。</p><p lang="en">We improved role clarity during the merger by documenting who could approve exceptions.</p><p>团队合并期间，我们记录了谁有权批准例外事项，从而明确了岗位分工。</p></details>
<details><summary><span lang="en">Job architecture</span> — 岗位架构</summary><p>用于归类和分级岗位的体系，通常涵盖职族、岗位层级及与之对应的标准。</p><p lang="en">Job architecture helps standardize titles and career paths.</p><p>岗位架构有助于统一职位名称和职业发展路径。</p></details>
<details><summary><span lang="en">Job family</span> — 职族</summary><p>按相近职能、工作性质或知识技能归类的一组岗位，可包含多个职级。</p><p lang="en">In our job architecture, software engineering roles sit in the Technology job family.</p><p>在我们的岗位架构中，软件工程岗位归入技术职族。</p></details>
<details><summary><span lang="en">Job leveling</span> — 岗位定级</summary><p>按职责范围、复杂度、决策权限和业务影响等标准，为岗位确定层级的过程。</p><p lang="en">We are reviewing job leveling across business units.</p><p>我们正在复核各业务部门的岗位定级。</p></details>
<details><summary><span lang="en">Talent review</span> — 人才盘点</summary><p>管理者按约定标准集中审视员工的绩效、能力、潜力与发展需要，并讨论后续培养或继任安排。</p><p lang="en">The talent review will help us identify employees to consider for future leadership roles.</p><p>人才盘点将帮助我们找出有望承担领导职责的培养对象。</p></details>
<details><summary><span lang="en">Nine-box grid</span> — 人才九宫格</summary><p>将两个维度各分为三个等级，形成九个格子，常以绩效和潜力为轴辅助人才盘点。</p><p lang="en">The nine-box grid gives managers a starting point for discussing development needs.</p><p>人才九宫格为经理讨论员工的发展需求提供了一个起点。</p></details>
<details><summary><span lang="en">Talent calibration</span> — 人才校准</summary><p>让来自不同团队的评估者依据共同标准核对潜力、准备度等人才判断的一致性。</p><p lang="en">Talent calibration helps departments apply the same criteria when assessing potential.</p><p>人才校准有助于各部门用同一套标准评估员工潜力。</p></details>
<details><summary><span lang="en">Succession planning</span> — 继任规划</summary><p>识别关键岗位及潜在继任人选、评估准备程度，并安排培养与交接以维持业务连续性的过程。</p><p lang="en">Succession planning helps us prepare for leadership transitions.</p><p>继任规划有助于我们为领导岗位的交接做好准备。</p></details>
<details><summary><span lang="en">Critical role</span> — 关键岗位</summary><p>一旦空缺或失去所需能力，可能显著影响业务连续性、关键交付或战略目标的岗位。</p><p lang="en">We identified the critical roles for the next planning cycle.</p><p>我们明确了下一轮规划周期中的关键岗位。</p></details>
<details><summary><span lang="en">Key position</span> — 核心岗位</summary><p>对战略执行、关键业务成果或特定能力有重要影响的岗位，具体认定标准因组织而异。</p><p lang="en">We identified the key positions needed to support the regional expansion.</p><p>我们识别了支持区域扩张所需的核心岗位。</p></details>
<details><summary><span lang="en">High-potential employee (HiPo)</span> — 高潜人才</summary><p>依据明确标准与多方证据，被评估为有潜力在未来承担更复杂或范围更广职责的员工。</p><p lang="en">The team offered the high-potential employee a short assignment in another business unit.</p><p>团队为这位高潜人才提供了在另一个业务部门短期任职的机会。</p></details>
<details><summary><span lang="en">Leadership pipeline</span> — 领导人才梯队</summary><p>为不同层级领导岗位持续培养的人才储备，以及支持候选人逐步承担更大职责的路径。</p><p lang="en">Our leadership pipeline has few candidates ready for mid-level management roles.</p><p>我们的领导人才梯队中，已准备好承担中层管理职责的人选不多。</p></details>
<details><summary><span lang="en">Bench strength</span> — 后备人才储备</summary><p>组织对关键岗位可动用的后备人才深度，通常结合候选人数、接任准备度和岗位覆盖情况判断。</p><p lang="en">We improved our bench strength by preparing two people to step into priority roles.</p><p>我们为优先保障的岗位培养了两名可以接任的人选，增强了后备人才储备。</p></details>
<details><summary><span lang="en">Talent mobility</span> — 人才流动</summary><p>在企业人才管理中，指员工在岗位、职能、业务单元或地区之间的流动，可包括调岗、晋升、轮岗或派驻。</p><p lang="en">Talent mobility helps us fill roles with internal skills.</p><p>人才流动让我们能用内部具备相关技能的员工填补岗位空缺。</p></details>
<details><summary><span lang="en">Internal mobility</span> — 内部流动</summary><p>员工在同一组织内部的职业流动，例如调岗、晋升或临时调配。</p><p lang="en">We support internal mobility by posting all eligible vacancies on our internal job board.</p><p>我们在内部职位平台公开所有可开放给员工申请的空缺，以促进内部流动。</p></details>
<details><summary><span lang="en">Job rotation</span> — 岗位轮换</summary><p>员工阶段性参与不同岗位以积累经验。</p><p lang="en">Job rotation gives future leaders a wider perspective.</p><p>岗位轮换让未来的领导者获得更广阔的视野。</p></details>
<details><summary><span lang="en">Workforce segmentation</span> — 员工队伍细分</summary><p>按岗位族、技能、关键程度或工作地点等与规划有关的维度划分员工群体，为用工和能力规划提供依据。</p><p lang="en">Workforce segmentation helps prioritize development investment.</p><p>员工队伍细分有助于确定人才发展投入的优先次序。</p></details>
<details><summary><span lang="en">Change management</span> — 变革管理</summary><p>为推动组织变化而开展的管理工作，通常通过沟通、参与、培训和后续支持，帮助员工采用新的工作方式。</p><p lang="en">For this rollout, change management starts three months before the system goes live.</p><p>这次系统推行的变革管理工作在正式上线前三个月启动。</p></details>
<details><summary><span lang="en">Change readiness</span> — 变革准备度</summary><p>组织或员工对拟议变革的理解、支持和实际准备程度，可涉及技能、资源和管理支持。</p><p lang="en">We will assess change readiness before restructuring.</p><p>在组织重组前，我们将评估变革准备度。</p></details>
<details><summary><span lang="en">Stakeholder mapping</span> — 利益相关方梳理</summary><p>识别受项目或变革影响、或能影响其结果的人员和群体，并整理其影响力、受影响程度和相互关系。</p><p lang="en">Stakeholder mapping helps us plan targeted communication.</p><p>利益相关方梳理有助于我们制定有针对性的沟通计划。</p></details>
<details><summary><span lang="en">Organizational effectiveness</span> — 组织效能</summary><p>组织实现目标时的整体运作效果。</p><p lang="en">We track organizational effectiveness by reviewing service quality, delivery times and customer feedback.</p><p>我们通过分析服务质量、交付时间和客户反馈来跟踪组织效能。</p></details>
<details><summary><span lang="en">Strategic workforce planning</span> — 战略人力规划</summary><p>根据长期业务战略预测人员和技能需求，评估现有及潜在供给，识别差距并制定应对方案。</p><p lang="en">Strategic workforce planning helps us decide which capabilities to build internally and which to hire for.</p><p>战略人力规划帮助我们判断哪些能力应在内部培养，哪些需要通过招聘引入。</p></details>
<details><summary><span lang="en">Talent strategy</span> — 人才战略</summary><p>围绕吸引、培养、保留人才的整体方向。</p><p lang="en">Our talent strategy focuses on critical capabilities.</p><p>我们的人才战略聚焦于关键能力。</p></details>
<details><summary><span lang="en">Organizational restructuring</span> — 组织重组</summary><p>调整组织架构、岗位或汇报关系。</p><p lang="en">The organizational restructuring will combine two regional teams.</p><p>这次组织重组将把两个区域团队合并。</p></details>
<details><summary><span lang="en">Role mapping</span> — 岗位映射</summary><p>将当前岗位对应到目标组织结构中的角色。</p><p lang="en">Our rollout plan puts role mapping ahead of the change to the reporting structure.</p><p>按实施计划，我们先完成岗位映射，再调整汇报架构。</p></details>
<details><summary><span lang="en">Talent segmentation</span> — 人才分层分类</summary><p>按岗位要求、技能、发展需求或继任准备情况等划分人才群体，以安排相应的培养或保留措施。</p><p lang="en">Talent segmentation helps tailor development investment.</p><p>人才分层分类有助于按不同人才群体的需求安排发展投入。</p></details>
<details><summary><span lang="en">Successor readiness</span> — 继任者准备度</summary><p>继任候选人在多大程度上已能承担目标岗位的职责，常结合经验、能力及预计需要的培养时间判断。</p><p lang="en">Successor readiness is reviewed annually for critical positions.</p><p>公司每年评估关键岗位继任候选人的准备度。</p></details>
<details><summary><span lang="en">Leadership bench</span> — 领导人才储备</summary><p>可在未来承担关键领导岗位的人才群体。</p><p lang="en">We need to strengthen the leadership bench in Asia.</p><p>我们需要加强亚洲区域的领导人才储备。</p></details>
<details><summary><span lang="en">Critical talent</span> — 关键人才</summary><p>对战略能力或重要业务连续性影响较大的员工。</p><p lang="en">Critical talent retention is part of the annual talent plan.</p><p>关键人才保留是年度人才计划的一部分。</p></details>
<details><summary><span lang="en">Change impact assessment</span> — 变革影响评估</summary><p>识别组织变化对人员、岗位及流程的影响。</p><p lang="en">The change impact assessment identified new training needs.</p><p>变革影响评估发现了新的培训需求。</p></details>
<details><summary><span lang="en">Organizational health</span> — 组织健康度</summary><p>组织能否有效协作、执行目标并持续适应变化的整体状态，常结合领导力、协作和工作方式等维度评估。</p><p lang="en">Our organizational health review covers leadership and ways of working.</p><p>我们的组织健康度评估涵盖领导力和工作方式。</p></details>
<details><summary><span lang="en">Decision rights</span> — 决策权限</summary><p>机构对各类决策的授权安排，明确谁能作决定以及适用的权限范围。</p><p lang="en">Clear decision rights help teams avoid sending routine approvals to the wrong person.</p><p>明确决策权限有助于避免把常规审批送给不具备相应权限的人。</p></details>
<details><summary><span lang="en">RACI matrix</span> — RACI 职责矩阵</summary><p>按任务划分职责的矩阵。R 是执行者，A 是最终责任人，C 是需征询意见者，I 是需知会者。</p><p lang="en">The RACI matrix clarifies ownership across the project.</p><p>RACI 职责矩阵明确项目中各方的职责。</p></details>
<details><summary><span lang="en">Organizational structure</span> — 组织结构／组织架构</summary><p>组织部门、汇报关系、管理层级及岗位分工的总体安排。</p><p lang="en">The new organizational structure clarifies reporting relationships.</p><p>新的组织架构明确了汇报关系。</p></details>
<details><summary><span lang="en">Position management</span> — 岗位编制管理</summary><p>对获批岗位的设立、预算、变更、占用和撤销进行管理，可跟踪一个岗位对应的一名或多名任职者。</p><p lang="en">Position management helps us track whether vacant positions are approved and funded.</p><p>岗位编制管理有助于跟踪空缺岗位是否已获批并落实预算。</p></details>
<details><summary><span lang="en">Organizational hierarchy</span> — 组织层级结构</summary><p>组织内部从高到低的管理层级和汇报链条。</p><p lang="en">The organizational hierarchy will be simplified next quarter.</p><p>下季度将简化组织层级。</p></details>
<details><summary><span lang="en">Succession candidate</span> — 继任候选人</summary><p>在继任规划中被列为未来可能接任某个关键岗位的人选，通常还会评估其准备度。</p><p lang="en">We identified two succession candidates for the finance director role.</p><p>我们为财务总监岗位确定了两位继任候选人。</p></details>
<details><summary><span lang="en">Career pathing</span> — 职业发展路径规划</summary><p>帮助员工探索可行的晋升、横向流动和专业发展路线，并明确各路线所需能力的过程。</p><p lang="en">Career pathing helps employees understand growth opportunities.</p><p>职业发展路径规划帮助员工了解成长机会。</p></details>
<details><summary><span lang="en">Promotion criteria</span> — 晋升标准／晋升评审条件</summary><p>用于判断员工是否满足晋升职级要求的业绩、能力与行为标准。</p><p lang="en">The promotion criteria should be transparent to employees.</p><p>应向员工公开晋升标准。</p></details>
<details><summary><span lang="en">Talent pipeline</span> — 人才梯队／人才储备渠道</summary><p>为未来岗位需求持续识别、接触或培养潜在人选形成的储备，可面向内部发展或外部招聘。</p><p lang="en">We need a stronger leadership talent pipeline.</p><p>我们需要加强领导人才梯队储备。</p></details>
<details><summary><span lang="en">Lateral move</span> — 横向岗位调动／平级转岗</summary><p>员工在相近职级之间转换岗位或职能领域的内部流动。</p><p lang="en">A lateral move can broaden an employee&#x27;s experience.</p><p>平级转岗有助于员工拓宽工作经验。</p></details>
<details><summary><span lang="en">Workforce capacity planning</span> — 人力供需与产能规划</summary><p>根据预计工作量、人员技能和可用工时判断团队能否满足需求，并安排补员、排班或跨岗支援的过程。</p><p lang="en">During workforce capacity planning, we identified a likely staffing gap on the evening shift.</p><p>在人力产能规划中，我们发现晚班可能人手不足。</p></details>
<details><summary><span lang="en">Talent retention plan</span> — 人才保留计划／留才方案</summary><p>针对识别出的留才风险，制定职业发展、工作安排、薪酬或管理支持等改进措施的计划。</p><p lang="en">The talent retention plan targets hard-to-replace skills.</p><p>人才保留计划重点关注具备难以替代技能的员工。</p></details>
<details><summary><span lang="en">Succession bench</span> — 关键岗位继任人才储备</summary><p>组织为一个或多个关键岗位储备的潜在继任者群体，各人所处的准备阶段可能不同。</p><p lang="en">Our succession bench for regional leadership is still limited.</p><p>我们的区域管理岗位继任储备仍然不足。</p></details>
<details><summary><span lang="en">Organizational capability</span> — 组织能力</summary><p>组织通过人才、流程和机制持续实现战略目标的整体能力。</p><p lang="en">The transformation requires new organizational capabilities.</p><p>这次转型需要新的组织能力。</p></details>
<details><summary><span lang="en">Job grading</span> — 岗位等级划分／岗位定级</summary><p>根据岗位职责、复杂程度和影响范围等标准，把岗位归入相应等级的过程。</p><p lang="en">Job grading helps maintain consistent role levels.</p><p>岗位定级有助于保持岗位等级划分的一致性。</p></details>
<details><summary><span lang="en">Promotion</span> — 晋升</summary><p>员工升至更高职级或职责层级。</p><p lang="en">The manager recommended her for promotion.</p><p>经理推荐她晋升。</p></details>
<details><summary><span lang="en">Job transfer</span> — 岗位调动</summary><p>员工在岗位、部门或地点之间的调动。</p><p lang="en">She requested a job transfer to another department.</p><p>她申请调往另一个部门。</p></details>
<details><summary><span lang="en">Job title</span> — 职位名称</summary><p>用于标识岗位的正式名称。</p><p lang="en">Please update the job title in the HR system.</p><p>请在HR系统中更新职位名称。</p></details>
<details><summary><span lang="en">Job evaluation</span> — 岗位价值评估</summary><p>系统评估岗位相对价值，为薪酬和定级提供依据。</p><p lang="en">We conducted a job evaluation before setting the pay grade.</p><p>我们在确定薪酬等级前开展了岗位价值评估。</p></details>
<details><summary><span lang="en">Career path</span> — 职业发展路径</summary><p>员工职业发展中可能经历的岗位或层级路线。</p><p lang="en">We discussed a possible career path for the employee.</p><p>我们讨论了该员工可能的职业发展路径。</p></details>
<details><summary><span lang="en">Mergers and acquisitions (M&amp;A)</span> — 兼并与收购（并购）</summary><p>企业合并和收购交易的统称。人力资源工作可涉及交易前尽职调查、员工沟通和交易后的人员整合。</p><p lang="en">HR supports workforce integration during mergers and acquisitions.</p><p>HR在企业并购期间支持人员整合。</p></details>
<details><summary><span lang="en">Organizational diagnosis</span> — 组织诊断</summary><p>通过访谈、数据和流程观察等方式，系统分析组织运行现状、问题及可能成因的过程。</p><p lang="en">We conducted an organizational diagnosis to identify decision-making bottlenecks.</p><p>我们开展组织诊断，以识别决策瓶颈。</p></details>
<details><summary><span lang="en">Delayering</span> — 管理层级精简</summary><p>通过减少管理层级来调整组织结构的做法。</p><p lang="en">We assessed the impact of delayering on managers&#x27; workloads.</p><p>我们评估了管理层级精简对管理者工作量的影响。</p></details>
<details><summary><span lang="en">Matrix organization</span> — 矩阵式组织</summary><p>将多个管理维度组合起来的结构，员工可能同时受职能和项目等不同维度的管理。</p><p lang="en">In our matrix organization, designers report to a functional manager and take project direction from a product lead.</p><p>在我们的矩阵式组织中，设计师向职能经理汇报，并接受产品负责人对项目的指导。</p></details>
<details><summary><span lang="en">Functional structure</span> — 职能型组织结构</summary><p>主要按财务、营销、人力资源、研发等专业职能划分部门的组织结构。</p><p lang="en">Under the functional structure, all software engineers report through the engineering department.</p><p>在职能型组织结构下，所有软件工程师均通过工程部门逐级汇报。</p></details>
<details><summary><span lang="en">Divisional structure</span> — 事业部制组织结构</summary><p>主要按产品、市场、客户或地区组成业务单元的组织结构，各单元通常承担一定经营责任。</p><p lang="en">The company moved to a divisional structure organized around product lines.</p><p>公司转向按产品线划分的事业部制组织结构。</p></details>
<details><summary><span lang="en">Centralization</span> — 集中化</summary><p>将某类决策权集中到总部、上级或统一机构的组织安排。</p><p lang="en">Centralization of decision-making can improve consistency across regions.</p><p>决策权集中有助于提高各地区的一致性。</p></details>
<details><summary><span lang="en">Decentralization</span> — 分权化</summary><p>将部分决策权分配给较低管理层级或各地区、业务单元的组织安排。</p><p lang="en">Decentralization of authority can help local teams respond faster.</p><p>权限下放有助于当地团队更快响应。</p></details>
<details><summary><span lang="en">Change sponsorship</span> — 变革领导支持</summary><p>有权提供资源和作出决策的领导者为变革明确方向、承担责任并持续提供公开支持的做法。</p><p lang="en">Strong change sponsorship helps secure resources for implementation.</p><p>有力的变革领导支持有助于获得实施资源。</p></details>
<details><summary><span lang="en">Change champion</span> — 变革推动者</summary><p>在业务团队中推广变革、帮助同事采用新做法并反馈实施障碍的人。</p><p lang="en">Each department appointed a change champion to support the rollout.</p><p>各部门指定了一名变革推动者支持推广实施。</p></details>
<details><summary><span lang="en">Change adoption</span> — 变革采纳／新做法采用</summary><p>员工开始实际使用新系统、流程或工作方式的过程，或衡量实际使用的程度。</p><p lang="en">We monitor change adoption through actual use of the new process.</p><p>我们通过新流程的实际使用情况监测变革采纳情况。</p></details>
<details><summary><span lang="en">Succession risk</span> — 继任风险</summary><p>重要岗位的潜在继任者不足、就绪程度不高或交接准备不足所带来的运营中断风险。</p><p lang="en">We assess succession risk for critical leadership roles.</p><p>我们评估关键领导岗位的继任风险。</p></details>
<details><summary><span lang="en">Successor coverage</span> — 继任覆盖情况／继任覆盖率</summary><p>关键岗位拥有符合所设条件的潜在继任者的覆盖情况，可用岗位比例表示。</p><p lang="en">We aim to improve successor coverage for critical roles.</p><p>我们致力于提高关键岗位的继任覆盖水平。</p></details>
<details><summary><span lang="en">Emergency succession plan</span> — 应急继任计划</summary><p>为应对关键岗位突然空缺或负责人暂时无法履职而制定的连续性安排，通常明确临时接任、权限及通知流程。</p><p lang="en">The board reviews the emergency succession plan annually.</p><p>董事会每年审查应急继任计划。</p></details>
