.study-legend{align-items:center;gap:8px;margin:12px 0 15px}
.study-legend .legend-filter{appearance:none;border:1px solid transparent;border-radius:13px;
  min-height:38px;padding:7px 11px;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;touch-action:manipulation;transition:border-color .15s,box-shadow .15s,transform .15s,background .15s}
.study-legend .legend-filter:active{transform:scale(.97)}
.study-legend .legend-filter:focus-visible{outline:3px solid #a99cf9;outline-offset:3px}
.study-legend .legend-filter.all-status{background:#f2f0ff;color:#6854d1}
.study-legend .legend-filter.is-active{border-color:currentColor;box-shadow:0 0 0 2px rgba(103,82,242,.13),0 5px 13px rgba(40,35,90,.075)}
.study-legend .legend-filter.is-active::after{content:'✓';font-size:10px;font-weight:900;margin-left:1px}
.study-legend .legend-filter b{font-variant-numeric:tabular-nums}
.status-filter-help{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px;line-height:1.45}
body.dark .study-legend .legend-filter.all-status{background:#373251;color:#ded6ff}
body.dark .study-legend .legend-filter.is-active{box-shadow:0 0 0 2px rgba(145,132,255,.18)}
@media(max-width:760px){
 .study-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
 .study-legend .legend-filter{width:100%;min-width:0;padding:8px 4px;font-size:11px;min-height:44px;border-radius:11px;gap:4px}
 .study-legend .legend-filter .i{width:12px;height:12px}
 .study-legend .legend-filter b{margin-left:0}
 .status-filter-help{grid-column:1/-1;margin:0;font-size:10px}
}
@media(max-width:360px){.study-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}

job posting · 发布职位招聘信息</p></details><details><summary>Employer branding — 雇主品牌建设</summary><p><b>核心释义：</b>通过雇主价值主张、人才传播和员工体验管理塑造企业作为雇主的形象。</p><p><b>职场英文例句：</b>Our employer branding campaign highlights employee growth stories.</p><p><b>中文翻译：</b>我们的雇主品牌宣传活动重点展示员工的成长故事。</p><p><b>高频短语：</b>strengthen employer branding · 加强雇主品牌建设</p></details><details><summary>Candidate sourcing — 人才寻访</summary><p><b>核心释义：</b>主动寻找符合条件的潜在候选人。</p><p><b>职场英文例句：</b>Candidate sourcing is our priority for this hard-to-fill role.</p><p><b>中文翻译：</b>对于这个难招的岗位，主动寻访候选人是我们的首要任务。</p><p><b>高频短语：</b>improve candidate sourcing · 提升人才寻访效率</p></details><details><summary>Talent pool — 人才库</summary><p><b>核心释义：</b>便于长期维护关系的潜在候选人集合。</p><p><b>职场英文例句：</b>Let&#x27;s add these qualified applicants to our talent pool.</p><p><b>中文翻译：</b>我们把这些符合条件的应聘者加入人才库吧。</p><p><b>高频短语：</b>build a talent pool · 建立人才库</p></details><details><summary>Applicant tracking system (ATS) — 招聘管理系统</summary><p><b>核心释义：</b>跟踪候选人及招聘流程的工具。</p><p><b>职场英文例句：</b>All interview feedback is stored in the applicant tracking system.</p><p><b>中文翻译：</b>所有面试反馈都保存在招聘管理系统中。</p><p><b>高频短语：</b>update the ATS · 更新招聘管理系统中的候选人记录</p></details><details><summary>Resume screening — 简历筛选</summary><p><b>核心释义：</b>根据岗位标准初步评估履历。</p><p><b>职场英文例句：</b>Resume screening will be completed by Friday.</p><p><b>中文翻译：</b>简历筛选将在周五之前完成。</p><p><b>高频短语：</b>conduct resume screening · 进行简历筛选</p></details><details><summary>Phone screen — 电话初筛</summary><p><b>核心释义：</b>通过短通话确认基本匹配度。</p><p><b>职场英文例句：</b>I scheduled a phone screen with the candidate tomorrow.</p><p><b>中文翻译：</b>我已安排明天与这位候选人进行电话初筛。</p><p><b>高频短语：</b>arrange a phone screen · 安排电话初筛</p></details><details><summary>Screening criteria — 筛选标准</summary><p><b>核心释义：</b>用于判断候选人是否符合岗位要求。</p><p><b>职场英文例句：</b>We should align on the screening criteria before reviewing resumes.</p><p><b>中文翻译：</b>开始筛选简历前，我们应先就筛选标准达成一致。</p><p><b>高频短语：</b>define screening criteria · 制定候选人筛选标准</p></details><details><summary>Hiring manager — 用人经理</summary><p><b>核心释义：</b>负责岗位需求与最终用人决策的管理者。</p><p><b>职场英文例句：</b>The hiring manager wants to meet three shortlisted candidates.</p><p><b>中文翻译：</b>用人经理希望面试三位入围候选人。</p><p><b>高频短语：</b>consult the hiring manager · 与用人经理沟通</p></details><details><summary>Interview panel — 面试小组</summary><p><b>核心释义：</b>共同参与候选人评估的面试官。</p><p><b>职场英文例句：</b>Our interview panel includes HR, engineering and product leaders.</p><p><b>中文翻译：</b>我们的面试小组包括人力资源、工程和产品部门的负责人。</p><p><b>高频短语：</b>form an interview panel · 组建面试小组</p></details><details><summary>Structured interview — 结构化面试</summary><p><b>核心释义：</b>用统一问题与评分规则提高一致性。</p><p><b>职场英文例句：</b>A structured interview helps reduce inconsistent evaluations.</p><p><b>中文翻译：</b>结构化面试有助于减少评价标准不一致的情况。</p><p><b>高频短语：</b>run a structured interview · 开展结构化面试</p></details><details><summary>Competency-based interview — 基于胜任力的面试</summary><p><b>核心释义：</b>围绕岗位胜任力标准，要求候选人说明相关经验与具体行为证据的面试方法。</p><p><b>职场英文例句：</b>The competency-based interview will focus on stakeholder management.</p><p><b>中文翻译：</b>此次胜任力面试将重点考察利益相关方管理能力。</p><p><b>高频短语：</b>design competency-based questions · 设计胜任力面试题</p></details><details><summary>Behavioral interview — 行为面试（BBI）</summary><p><b>核心释义：</b>通过候选人过去的实际工作行为预测未来表现的面试方式，通常要求举例说明情境、行动与结果。</p><p><b>职场英文例句：</b>In a behavioral interview, ask for a specific example of conflict resolution.</p><p><b>中文翻译：</b>在行为面试中，应请候选人举出解决冲突的具体事例。</p><p><b>高频短语：</b>use behavioral interview questions · 使用行为面试问题</p></details><details><summary>Assessment center — 评价中心</summary><p><b>核心释义：</b>通过多种模拟任务评估人员能力。</p><p><b>职场英文例句：</b>The assessment center includes a group exercise and a case presentation.</p><p><b>中文翻译：</b>评价中心包括一项小组练习和一次案例展示。</p><p><b>高频短语：</b>attend an assessment center · 参加评价中心测评</p></details><details><summary>Take-home assignment — 居家作业式测评</summary><p><b>核心释义：</b>候选人在面试外完成的任务。</p><p><b>职场英文例句：</b>We gave the candidate a take-home assignment with a clear deadline.</p><p><b>中文翻译：</b>我们给候选人安排了一项有明确截止日期的课后测评任务。</p><p><b>高频短语：</b>review a take-home assignment · 评阅居家作业式测评任务</p></details><details><summary>Reference check — 工作推荐人核查（背调环节）</summary><p><b>核心释义：</b>联系候选人提供的前任上级或职业推荐人，验证其工作经历、表现及合作情况。</p><p><b>职场英文例句：</b>We will conduct the reference check after the final interview.</p><p><b>中文翻译：</b>我们将在终面结束后进行推荐人核查。</p><p><b>高频短语：</b>complete a reference check · 完成推荐人核查</p></details><details><summary>Background check — 候选人背景调查（背调）</summary><p><b>核心释义：</b>在合法、合规及适当授权的前提下，核实候选人的工作、教育等背景信息。</p><p><b>职场英文例句：</b>The offer is conditional on completing the background check.</p><p><b>中文翻译：</b>录用通知以完成背景调查为前提。</p><p><b>高频短语：</b>initiate a background check · 启动候选人背景调查</p></details><details><summary>Candidate experience — 候选人体验</summary><p><b>核心释义：</b>求职者在招聘全流程中的感受。</p><p><b>职场英文例句：</b>Fast feedback can improve the candidate experience.</p><p><b>中文翻译：</b>及时反馈可以改善候选人的招聘体验。</p><p><b>高频短语：</b>enhance candidate experience · 改善候选人体验</p></details><details><summary>Offer letter — 录用通知书</summary><p><b>核心释义：</b>载明录用条件的正式文件。</p><p><b>职场英文例句：</b>Please review the offer letter before sending it to the candidate.</p><p><b>中文翻译：</b>将录用通知书发送给候选人前，请先审核。</p><p><b>高频短语：</b>issue an offer letter · 发放录用通知书</p></details><details><summary>Compensation expectation — 薪酬期望</summary><p><b>核心释义：</b>候选人对拟入职岗位报酬的预期。</p><p><b>职场英文例句：</b>We discussed the candidate&#x27;s compensation expectation early in the process.</p><p><b>中文翻译：</b>我们在招聘流程早期就讨论了候选人的薪酬期望。</p><p><b>高频短语：</b>clarify compensation expectations · 确认薪酬期望</p></details><details><summary>Salary negotiation — 薪资谈判</summary><p><b>核心释义：</b>围绕薪资条件进行沟通。</p><p><b>职场英文例句：</b>The salary negotiation is still ongoing with the preferred candidate.</p><p><b>中文翻译：</b>我们仍在与首选候选人进行薪资谈判。</p><p><b>高频短语：</b>handle salary negotiation · 进行薪酬谈判</p></details><details><summary>Notice period — 离职／解雇通知期</summary><p><b>核心释义：</b>雇佣关系结束前，合同或法律要求一方向另一方提前发出通知的期限。</p><p><b>职场英文例句：</b>The candidate has a one-month notice period at the current company.</p><p><b>中文翻译：</b>该候选人在现公司需履行一个月的离职通知期。</p><p><b>高频短语：</b>confirm the notice period · 确认离职通知期</p></details><details><summary>Onboarding — 新员工入职与融入</summary><p><b>核心释义：</b>新员工完成入职手续、了解制度、熟悉岗位并逐步融入团队的过程。</p><p><b>职场英文例句：</b>The onboarding plan includes a buddy and first-week check-ins.</p><p><b>中文翻译：</b>入职计划包括指定伙伴及入职第一周的定期沟通。</p><p><b>高频短语：</b>improve onboarding · 完善新员工入职与融入流程</p></details><details><summary>Probation period — 试用期</summary><p><b>核心释义：</b>雇佣初期用于评估相互适配的阶段。</p><p><b>职场英文例句：</b>We will review performance near the end of the probation period.</p><p><b>中文翻译：</b>我们将在试用期结束前后评估其工作表现。</p><p><b>高频短语：</b>complete the probation period · 完成试用期</p></details><details><summary>Time to fill — 岗位招聘填补周期</summary><p><b>核心释义：</b>从招聘需求获批／职位开放到候选人接受录用等特定终点的时间；统计起止点需统一。</p><p><b>职场英文例句：</b>Our time to fill decreased after we streamlined approvals.</p><p><b>中文翻译：</b>简化审批流程后，我们的岗位填补周期缩短了。</p><p><b>高频短语：</b>reduce time to fill · 缩短岗位招聘填补周期</p></details><details><summary>Quality of hire — 招聘质量</summary><p><b>核心释义：</b>从新员工表现等角度衡量录用成效。</p><p><b>职场英文例句：</b>Quality of hire matters more than hiring speed alone.</p><p><b>中文翻译：</b>招聘质量比单纯追求招聘速度更重要。</p><p><b>高频短语：</b>measure quality of hire · 衡量招聘质量</p></details><details><summary>Talent acquisition — 人才招聘与获取（TA）</summary><p><b>核心释义：</b>以满足短中长期人才需求为目标的招聘全流程，包括雇主品牌、寻访、甄选、录用及入职衔接。</p><p><b>职场英文例句：</b>Our talent acquisition strategy prioritizes scarce engineering skills.</p><p><b>中文翻译：</b>我们的人才招聘战略优先关注紧缺的工程技术能力。</p><p><b>高频短语：</b>talent acquisition strategy · 人才招聘与获取策略</p></details><details><summary>Time to hire — 候选人招聘周期</summary><p><b>核心释义：</b>从候选人进入招聘流程到接受录用的时间长度（或企业定义的其他终点）。</p><p><b>职场英文例句：</b>We reduced time to hire by simplifying interview scheduling.</p><p><b>中文翻译：</b>简化面试安排后，我们缩短了招聘周期。</p><p><b>高频短语：</b>reduce time to hire · 缩短候选人招聘周期</p></details><details><summary>Sourcing channel — 人才寻访渠道</summary><p><b>核心释义：</b>接触潜在候选人的渠道来源。</p><p><b>职场英文例句：</b>We compare sourcing channels to improve the candidate pipeline.</p><p><b>中文翻译：</b>我们比较不同招聘渠道，以优化候选人储备。</p><p><b>高频短语：</b>evaluate sourcing channels · 评估人才寻访渠道</p></details><details><summary>Employee referral — 员工内推</summary><p><b>核心释义：</b>通过在职员工推荐潜在候选人。</p><p><b>职场英文例句：</b>Employee referrals account for a quarter of our new hires.</p><p><b>中文翻译：</b>员工内推占我们新入职人数的四分之一。</p><p><b>高频短语：</b>employee referral program · 员工内推计划</p></details><details><summary>Candidate pipeline — 候选人储备池／招聘候选人管道</summary><p><b>核心释义：</b>按招聘进度或潜在匹配度持续管理的候选人群体及其转化阶段。</p><p><b>职场英文例句：</b>We need a stronger candidate pipeline for senior roles.</p><p><b>中文翻译：</b>对于高级岗位，我们需要更充足的候选人储备。</p><p><b>高频短语：</b>build a candidate pipeline · 建立招聘候选人储备池</p></details><details><summary>Talent mapping — 人才地图</summary><p><b>核心释义：</b>梳理目标市场人才分布与潜在候选人。</p><p><b>职场英文例句：</b>Talent mapping helps us identify experts in emerging markets.</p><p><b>中文翻译：</b>人才地图绘制有助于我们找到新兴市场的专家。</p><p><b>高频短语：</b>conduct talent mapping · 绘制人才地图</p></details><details><summary>Interview scorecard — 面试评分表</summary><p><b>核心释义：</b>依统一维度记录面试评价及证据。</p><p><b>职场英文例句：</b>Please complete the interview scorecard before the debrief.</p><p><b>中文翻译：</b>请在面试复盘会前填写面试评分表。</p><p><b>高频短语：</b>complete an interview scorecard · 填写面试评分表</p></details><details><summary>Hiring freeze — 招聘冻结</summary><p><b>核心释义：</b>暂缓或停止新增岗位招聘。</p><p><b>职场英文例句：</b>The hiring freeze does not affect approved critical vacancies.</p><p><b>中文翻译：</b>招聘冻结不影响已经获批的关键岗位。</p><p><b>高频短语：</b>temporary hiring freeze · 临时冻结招聘</p></details><details><summary>Contingent worker — 非正式雇佣用工人员</summary><p><b>核心释义：</b>如合同工、派遣工，具体分类依当地法规。</p><p><b>职场英文例句：</b>Contingent workers are engaged through approved vendors.</p><p><b>中文翻译：</b>非正式用工人员通过获批准的供应商聘用。</p><p><b>高频短语：</b>contingent workforce · 非正式雇佣用工群体</p></details><details><summary>Recruitment funnel — 招聘漏斗</summary><p><b>核心释义：</b>衡量候选人从申请到录用的转化过程。</p><p><b>职场英文例句：</b>Our recruitment funnel shows a drop-off after the technical test.</p><p><b>中文翻译：</b>我们的招聘漏斗显示，技术测试后有较多候选人退出。</p><p><b>高频短语：</b>recruitment funnel conversion · 招聘漏斗转化率</p></details><details><summary>Application form — 求职申请表／应聘登记表</summary><p><b>核心释义：</b>候选人应聘某职位时填写的标准化个人与工作背景表单。</p><p><b>职场英文例句：</b>Please complete the application form before your interview.</p><p><b>中文翻译：</b>面试前请填写应聘申请表。</p><p><b>高频短语：</b>complete an application form · 完成求职申请表</p></details><details><summary>Campus recruiting — 校园招聘</summary><p><b>核心释义：</b>企业面向高校学生和应届毕业生开展的集中招聘活动。</p><p><b>职场英文例句：</b>Our campus recruiting campaign starts in September.</p><p><b>中文翻译：</b>我们的校园招聘活动将于九月启动。</p><p><b>高频短语：</b>campus recruiting program · 校园招聘项目</p></details><details><summary>External labor market — 外部劳动力市场</summary><p><b>核心释义：</b>组织之外可供招聘的候选人与劳动力供需环境。</p><p><b>职场英文例句：</b>The external labor market for experienced engineers is tight.</p><p><b>中文翻译：</b>经验丰富的工程师在外部人才市场上供不应求。</p><p><b>高频短语：</b>analyze the external labor market · 分析外部劳动力市场</p></details><details><summary>Candidate — 招聘候选人／应聘者</summary><p><b>核心释义：</b>正在被招聘团队评估或考虑录用的求职人员。</p><p><b>职场英文例句：</b>We have shortlisted three candidates for the final interview.</p><p><b>中文翻译：</b>我们筛选出三位候选人进入最终面试。</p><p><b>高频短语：</b>shortlist a candidate · 将候选人列入入围名单</p></details><details><summary>Competency model — 岗位胜任力模型</summary><p><b>核心释义：</b>用岗位所需知识、技能、行为和能力标准支持招聘与人才评估的框架。</p><p><b>职场英文例句：</b>The interview questions are aligned with our competency model.</p><p><b>中文翻译：</b>面试问题与我们的胜任力模型相匹配。</p><p><b>高频短语：</b>build a competency model · 建立岗位胜任力模型</p></details><details><summary>Initial interview — 初轮面试／初试</summary><p><b>核心释义：</b>招聘流程中的第一次正式面试，用于初步判断岗位匹配度。</p><p><b>职场英文例句：</b>The initial interview will focus on your relevant experience.</p><p><b>中文翻译：</b>初试将重点了解您与岗位相关的工作经历。</p><p><b>高频短语：</b>schedule an initial interview · 安排初轮面试</p></details><details><summary>Job analysis — 岗位分析</summary><p><b>核心释义：</b>通过分析岗位任务、职责、条件和任职能力形成岗位标准的工作。</p><p><b>职场英文例句：</b>We completed the job analysis before revising the job description.</p><p><b>中文翻译：</b>修订岗位说明书前，我们完成了岗位分析。</p><p><b>高频短语：</b>conduct job analysis · 开展岗位分析</p></details><details><summary>Job requirements and qualifications — 岗位任职条件与资格要求</summary><p><b>核心释义：</b>企业招聘时对候选人的学历、经验、能力和必要资格等提出的要求。</p><p><b>职场英文例句：</b>The job requirements and qualifications are listed in the posting.</p><p><b>中文翻译：</b>招聘信息中列明了岗位要求和任职资格。</p><p><b>高频短语：</b>meet the job requirements · 满足岗位任职条件</p></details><details><summary>Behavioral-based interview (BBI) — 行为面试法（BBI）</summary><p><b>核心释义：</b>通过追问过去真实工作行为及其结果评估岗位相关能力的方法。</p><p><b>职场英文例句：</b>We use a behavioral-based interview to assess problem-solving skills.</p><p><b>中文翻译：</b>我们通过行为面试评估候选人的问题解决能力。</p><p><b>高频短语：</b>conduct a behavioral-based interview · 开展行为面试（BBI）</p></details><details><summary>Interview guide — 面试提纲／面试指南</summary><p><b>核心释义：</b>供面试官使用的结构化问题、评分尺度和追问提示。</p><p><b>职场英文例句：</b>Please review the interview guide before meeting the candidate.</p><p><b>中文翻译：</b>与候选人面试前，请先查看面试指南。</p><p><b>高频短语：</b>prepare an interview guide · 准备面试提纲</p></details><details><summary>Candidate shortlist — 候选人短名单／入围名单</summary><p><b>核心释义：</b>经过初步筛选、进入重点评估或面试阶段的候选人名单。</p><p><b>职场英文例句：</b>The recruiter sent the candidate shortlist to the hiring manager.</p><p><b>中文翻译：</b>招聘专员将入围候选人名单发给了用人经理。</p><p><b>高频短语：</b>finalize a candidate shortlist · 敲定候选人短名单</p></details><details><summary>Hiring decision — 录用决策</summary><p><b>核心释义：</b>在评估结果与岗位需求基础上决定是否录用候选人。</p><p><b>职场英文例句：</b>We need the panel&#x27;s feedback before making the hiring decision.</p><p><b>中文翻译：</b>作出录用决定前，我们需要面试小组的反馈。</p><p><b>高频短语：</b>make a hiring decision · 作出录用决策</p></details><details><summary>Offer acceptance rate — 录用通知接受率</summary><p><b>核心释义：</b>在指定期间内，收到录用通知的候选人中接受录用的比例。</p><p><b>职场英文例句：</b>Our offer acceptance rate improved after we simplified approvals.</p><p><b>中文翻译：</b>简化审批流程后，我们的录用接受率提高了。</p><p><b>高频短语：</b>track the offer acceptance rate · 跟踪录用通知接受率</p></details><details><summary>Candidate withdrawal — 候选人退出招聘流程</summary><p><b>核心释义：</b>候选人在招聘流程中主动退出面试或拒绝继续参与的情况。</p><p><b>职场英文例句：</b>We recorded the candidate withdrawal in the ATS.</p><p><b>中文翻译：</b>我们在招聘管理系统中记录了候选人退出招聘流程的情况。</p><p><b>高频短语：</b>record a candidate withdrawal · 记录候选人退出招聘流程</p></details><details><summary>Job advertisement — 岗位招聘广告</summary><p><b>核心释义：</b>用于对外宣传职位空缺、岗位要求和应聘方式的招聘广告。</p><p><b>职场英文例句：</b>We updated the job advertisement to reflect the new salary range.</p><p><b>中文翻译：</b>我们更新了招聘广告，以反映新的薪资范围。</p><p><b>高频短语：</b>publish a job advertisement · 发布岗位招聘广告</p></details><details><summary>Interview feedback — 面试评价反馈</summary><p><b>核心释义：</b>面试官对候选人能力、表现与岗位匹配度形成的具体评价。</p><p><b>职场英文例句：</b>Please submit your interview feedback by the end of the day.</p><p><b>中文翻译：</b>请在今天下班前提交面试反馈。</p><p><b>高频短语：</b>submit interview feedback · 提交面试评价反馈</p></details><details><summary>Pre-employment screening — 录用前资格与背景核验</summary><p><b>核心释义：</b>录用前根据合规流程对候选人资格及必要背景进行核查。</p><p><b>职场英文例句：</b>Pre-employment screening must follow our privacy policy.</p><p><b>中文翻译：</b>入职前背景筛查必须遵守我们的隐私政策。</p><p><b>高频短语：</b>complete pre-employment screening · 完成录用前资格与背景核验</p></details><details><summary>Applicant — 求职申请人／应聘者</summary><p><b>核心释义：</b>已针对某个职位提交应聘申请的人员。</p><p><b>职场英文例句：</b>Each applicant receives a confirmation email.</p><p><b>中文翻译：</b>每位求职申请人都会收到确认邮件。</p><p><b>高频短语：</b>review an applicant&#x27;s profile · 审阅求职申请人</p></details></details><details class="fallback-module"><summary><b>薪酬激励与福利</b> · 56条</summary><details><summary>Base salary — 基本工资</summary><p><b>核心释义：</b>通常不含浮动奖金的固定报酬。</p><p><b>职场英文例句：</b>The base salary for this position is reviewed annually.</p><p><b>中文翻译：</b>该岗位的基本工资每年评估一次。</p><p><b>高频短语：</b>adjust the base salary · 调整基本工资</p></details><details><summary>Gross salary — 税前工资</summary><p><b>核心释义：</b>在税费与法定扣款前的工资。</p><p><b>职场英文例句：</b>The gross salary is listed in the employment offer.</p><p><b>中文翻译：</b>税前工资已在录用文件中列明。</p><p><b>高频短语：</b>calculate gross salary · 计算税前工资</p></details><details><summary>Net pay — 实发工资</summary><p><b>核心释义：</b>扣除适用税费及扣款后的到手金额。</p><p><b>职场英文例句：</b>Your net pay may change when your tax withholding changes.</p><p><b>中文翻译：</b>当预扣税款发生变化时，您的实发工资也可能改变。</p><p><b>高频短语：</b>check net pay · 核对实发工资</p></details><details><summary>Total rewards — 全面薪酬回报</summary><p><b>核心释义：</b>工资、激励、福利及非现金回报的整体组合。</p><p><b>职场英文例句：</b>Our total rewards approach includes benefits and career development.</p><p><b>中文翻译：</b>我们的全面薪酬福利方案还包括福利与职业发展机会。</p><p><b>高频短语：</b>total rewards strategy · 全面薪酬回报策略</p></details><details><summary>Compensation package — 薪酬方案</summary><p><b>核心释义：</b>针对岗位或员工的整体报酬安排。</p><p><b>职场英文例句：</b>We prepared a competitive compensation package for the finalist.</p><p><b>中文翻译：</b>我们为最终候选人准备了有竞争力的薪酬方案。</p><p><b>高频短语：</b>review a compensation package · 审阅薪酬方案</p></details><details><summary>Salary band — 薪资区间</summary><p><b>核心释义：</b>某岗位或职级对应的工资上下限。</p><p><b>职场英文例句：</b>This role falls within the updated salary band.</p><p><b>中文翻译：</b>该岗位属于更新后的薪酬带宽范围。</p><p><b>高频短语：</b>review salary bands · 审查薪资带宽</p></details><details><summary>Pay grade — 薪级／薪酬等级</summary><p><b>核心释义：</b>用于确定岗位或员工薪酬带宽的等级分类。</p><p><b>职场英文例句：</b>The new position has been assigned to the correct pay grade.</p><p><b>中文翻译：</b>新岗位已被划入正确的薪酬职级。</p><p><b>高频短语：</b>assign a pay grade · 分配薪级</p></details><details><summary>Salary benchmark — 薪酬对标</summary><p><b>核心释义：</b>参照市场调查数据比较薪酬水平。</p><p><b>职场英文例句：</b>We use a salary benchmark before adjusting the pay range.</p><p><b>中文翻译：</b>调整薪资区间前，我们会参考市场薪酬基准。</p><p><b>高频短语：</b>market salary benchmark · 市场薪酬对标</p></details><details><summary>Market adjustment — 市场调薪</summary><p><b>核心释义：</b>为保持外部竞争力而作的薪资调整。</p><p><b>职场英文例句：</b>A market adjustment may be needed for scarce technical skills.</p><p><b>中文翻译：</b>对于紧缺技术人才，可能需要进行市场薪酬调整。</p><p><b>高频短语：</b>propose a market adjustment · 提出市场调薪</p></details><details><summary>Internal equity — 内部薪酬公平性</summary><p><b>核心释义：</b>组织内部对可比岗位、职责和绩效等因素进行合理薪酬比较的原则。</p><p><b>职场英文例句：</b>We reviewed internal equity before approving the offer.</p><p><b>中文翻译：</b>批准录用薪酬前，我们评估了内部薪酬公平性。</p><p><b>高频短语：</b>maintain internal equity · 维持内部薪酬公平</p></details><details><summary>Pay transparency — 薪酬透明</summary><p><b>核心释义：</b>明确沟通薪酬规则、范围或决策原则。</p><p><b>职场英文例句：</b>Pay transparency helps employees understand how pay decisions are made.</p><p><b>中文翻译：</b>薪酬透明有助于员工理解薪酬决策的依据。</p><p><b>高频短语：</b>improve pay transparency · 提升薪酬透明度</p></details><details><summary>Pay compression — 薪酬压缩</summary><p><b>核心释义：</b>新人和资深员工的薪酬差距异常缩小。</p><p><b>职场英文例句：</b>Pay compression became a concern after the market adjustment.</p><p><b>中文翻译：</b>市场薪酬调整后，薪酬倒挂或压缩问题引起了关注。</p><p><b>高频短语：</b>address pay compression · 解决薪酬压缩问题</p></details><details><summary>Annual bonus — 年度奖金</summary><p><b>核心释义：</b>按年度绩效或经营结果发放的浮动奖励。</p><p><b>职场英文例句：</b>The annual bonus depends on company and individual results.</p><p><b>中文翻译：</b>年终奖金取决于公司及个人的业绩结果。</p><p><b>高频短语：</b>annual bonus payout · 年度奖金发放</p></details><details><summary>Performance bonus — 绩效奖金</summary><p><b>核心释义：</b>与个人、团队或组织绩效挂钩的奖金。</p><p><b>职场英文例句：</b>The performance bonus is tied to agreed goals.</p><p><b>中文翻译：</b>绩效奖金与双方约定的目标挂钩。</p><p><b>高频短语：</b>performance bonus criteria · 绩效奖金发放标准</p></details><details><summary>Sign-on bonus — 签约奖金</summary><p><b>核心释义：</b>用于吸引候选人入职的一次性激励。</p><p><b>职场英文例句：</b>The sign-on bonus will be paid under the terms of the offer.</p><p><b>中文翻译：</b>签约奖金将按照录用协议中的条款发放。</p><p><b>高频短语：</b>offer a sign-on bonus · 提供签约奖金</p></details><details><summary>Retention bonus — 留任奖金</summary><p><b>核心释义：</b>鼓励关键员工在特定期限内留任的奖励。</p><p><b>职场英文例句：</b>We proposed a retention bonus for the project team.</p><p><b>中文翻译：</b>我们建议为项目团队设立留任奖金。</p><p><b>高频短语：</b>retention bonus agreement · 留任奖金协议</p></details><details><summary>Commission — 销售提成</summary><p><b>核心释义：</b>与销售业绩等指标挂钩的可变收入。</p><p><b>职场英文例句：</b>The sales team earns commission on eligible deals.</p><p><b>中文翻译：</b>销售团队可根据符合条件的交易获得佣金。</p><p><b>高频短语：</b>sales commission plan · 销售提成方案</p></details><details><summary>Incentive plan — 激励计划</summary><p><b>核心释义：</b>规定激励对象、指标和兑现方式。</p><p><b>职场英文例句：</b>The incentive plan should be clear and easy to administer.</p><p><b>中文翻译：</b>激励计划应清晰易懂，便于执行管理。</p><p><b>高频短语：</b>design an incentive plan · 设计激励计划</p></details><details><summary>Long-term incentive (LTI) — 长期激励</summary><p><b>核心释义：</b>鼓励员工关注中长期价值的激励安排。</p><p><b>职场英文例句：</b>The long-term incentive plan is designed for key leaders.</p><p><b>中文翻译：</b>长期激励计划是为关键管理者设计的。</p><p><b>高频短语：</b>LTI eligibility · 长期激励计划的参与资格</p></details><details><summary>Stock option — 股票期权</summary><p><b>核心释义：</b>在约定条件下按指定价格购股的权利。</p><p><b>职场英文例句：</b>Some employees receive stock options as part of their package.</p><p><b>中文翻译：</b>部分员工的薪酬方案中包含股票期权。</p><p><b>高频短语：</b>exercise a stock option · 行使股票期权</p></details><details><summary>Restricted stock unit (RSU) — 限制性股票单位</summary><p><b>核心释义：</b>满足归属条件后取得股票的权益安排。</p><p><b>职场英文例句：</b>The employee received restricted stock units with a vesting schedule.</p><p><b>中文翻译：</b>该员工获得了按计划分期归属的限制性股票单位（RSU）。</p><p><b>高频短语：</b>RSU grant · 授予限制性股票单位（RSU）</p></details><details><summary>Equity vesting — 股权归属</summary><p><b>核心释义：</b>股权奖励按服务期或业绩条件逐步生效。</p><p><b>职场英文例句：</b>Equity vesting normally follows the terms of the award agreement.</p><p><b>中文翻译：</b>股权归属通常依照授予协议的条款执行。</p><p><b>高频短语：</b>vesting schedule · 股权归属时间表</p></details><details><summary>Benefits enrollment — 福利登记</summary><p><b>核心释义：</b>员工选择并加入适用福利计划的流程。</p><p><b>职场英文例句：</b>Benefits enrollment opens next Monday for eligible employees.</p><p><b>中文翻译：</b>符合条件的员工可从下周一开始办理福利登记。</p><p><b>高频短语：</b>complete benefits enrollment · 完成员工福利登记</p></details><details><summary>Health insurance — 医疗保险</summary><p><b>核心释义：</b>帮助支付符合规则的医疗费用的福利。</p><p><b>职场英文例句：</b>Please check which health insurance options are available locally.</p><p><b>中文翻译：</b>请核实当地提供哪些医疗保险方案。</p><p><b>高频短语：</b>health insurance coverage · 医疗保险保障范围</p></details><details><summary>Retirement plan — 退休计划</summary><p><b>核心释义：</b>为员工退休后收入储备提供的安排。</p><p><b>职场英文例句：</b>The retirement plan details vary by country and employer.</p><p><b>中文翻译：</b>退休福利计划的具体规定因国家和雇主而异。</p><p><b>高频短语：</b>retirement plan contribution · 退休计划缴费</p></details><details><summary>Paid time off (PTO) — 带薪休假</summary><p><b>核心释义：</b>公司政策中可带薪使用的休假时间。</p><p><b>职场英文例句：</b>Employees can request paid time off through the HR system.</p><p><b>中文翻译：</b>员工可通过人力资源系统申请带薪休假。</p><p><b>高频短语：</b>PTO balance · 剩余带薪休假天数</p></details><details><summary>Payroll cycle — 薪资发放周期</summary><p><b>核心释义：</b>工资核算与支付的固定节奏。</p><p><b>职场英文例句：</b>Our payroll cycle closes on the last working day of the month.</p><p><b>中文翻译：</b>我们的薪资核算周期在每月最后一个工作日结束。</p><p><b>高频短语：</b>monthly payroll cycle · 每月薪资发放周期</p></details><details><summary>Tax withholding — 预扣税</summary><p><b>核心释义：</b>工资发放时按适用规定代扣的税款。</p><p><b>职场英文例句：</b>Tax withholding follows the employee&#x27;s local tax rules.</p><p><b>中文翻译：</b>预扣税款按照员工所在地的税收规定处理。</p><p><b>高频短语：</b>adjust tax withholding · 调整预扣税额</p></details><details><summary>Overtime pay — 加班报酬</summary><p><b>核心释义：</b>依据适用法律和政策支付的额外工资。</p><p><b>职场英文例句：</b>Overtime pay must be calculated according to local requirements.</p><p><b>中文翻译：</b>加班工资必须依照当地适用规定计算。</p><p><b>高频短语：</b>overtime pay eligibility · 加班工资领取资格</p></details><details><summary>Merit increase — 绩效调薪</summary><p><b>核心释义：</b>基于绩效表现进行的工资增长。</p><p><b>职场英文例句：</b>Merit increases are considered during the annual compensation review.</p><p><b>中文翻译：</b>年度薪酬评审期间会考虑绩效调薪。</p><p><b>高频短语：</b>merit increase budget · 绩效调薪预算</p></details><details><summary>Compa-ratio — 薪酬比率</summary><p><b>核心释义：</b>员工实际工资与对应薪资区间中位值的比率。</p><p><b>职场英文例句：</b>A compa-ratio below one means pay is below the range midpoint.</p><p><b>中文翻译：</b>薪酬比率低于1，表示该员工薪酬低于薪酬区间中位值。</p><p><b>高频短语：</b>calculate the compa-ratio · 计算薪酬比率</p></details><details><summary>Pay range midpoint — 薪资区间中点</summary><p><b>核心释义：</b>岗位薪酬区间的中间参考值。</p><p><b>职场英文例句：</b>The pay range midpoint is used in our compensation analysis.</p><p><b>中文翻译：</b>薪酬区间中位值用于我们的薪酬分析。</p><p><b>高频短语：</b>salary range midpoint · 薪资区间中点</p></details><details><summary>Salary survey — 薪酬调查</summary><p><b>核心释义：</b>收集市场岗位工资数据的研究。</p><p><b>职场英文例句：</b>We use a salary survey to benchmark critical positions.</p><p><b>中文翻译：</b>我们使用薪酬调研数据为关键岗位进行市场对标。</p><p><b>高频短语：</b>participate in a salary survey · 参与薪酬调查</p></details><details><summary>Variable pay — 浮动薪酬</summary><p><b>核心释义：</b>随业绩或条件变化的薪酬部分。</p><p><b>职场英文例句：</b>Variable pay accounts for a larger share of sales compensation.</p><p><b>中文翻译：</b>浮动薪酬在销售人员整体薪酬中占比较高。</p><p><b>高频短语：</b>variable pay component · 浮动薪酬组成部分</p></details><details><summary>Target bonus — 目标奖金</summary><p><b>核心释义：</b>达到约定业绩水平时的预期奖金金额。</p><p><b>职场英文例句：</b>The target bonus is fifteen percent of annual base salary.</p><p><b>中文翻译：</b>目标奖金为年度基本工资的15%。</p><p><b>高频短语：</b>target bonus percentage · 目标奖金比例</p></details><details><summary>Pay-for-performance — 绩效付薪</summary><p><b>核心释义：</b>将薪酬结果与员工或组织绩效关联的原则。</p><p><b>职场英文例句：</b>Our pay-for-performance policy uses clear evaluation criteria.</p><p><b>中文翻译：</b>我们的绩效薪酬政策采用明确的评价标准。</p><p><b>高频短语：</b>pay-for-performance philosophy · 绩效付薪理念</p></details><details><summary>Benefits eligibility — 福利资格</summary><p><b>核心释义：</b>满足参加某项福利计划的条件。</p><p><b>职场英文例句：</b>Benefits eligibility depends on local policy and employment status.</p><p><b>中文翻译：</b>福利资格取决于当地政策和雇佣状态。</p><p><b>高频短语：</b>confirm benefits eligibility · 确认福利享受资格</p></details><details><summary>Flexible benefits — 弹性福利</summary><p><b>核心释义：</b>允许员工从一定范围选择福利方案。</p><p><b>职场英文例句：</b>Flexible benefits let employees choose options that fit their needs.</p><p><b>中文翻译：</b>弹性福利允许员工选择符合自身需要的福利项目。</p><p><b>高频短语：</b>flexible benefits plan · 弹性福利方案</p></details><details><summary>Pay equity — 薪酬公平性（同值工作同等报酬等）</summary><p><b>核心释义：</b>关注薪酬在不同员工群体之间是否公平，并研究与工作价值、职责等相关的差异。</p><p><b>职场英文例句：</b>The pay equity review uses comparable roles and relevant factors.</p><p><b>中文翻译：</b>薪酬公平性审查会考虑可比岗位和其他相关因素。</p><p><b>高频短语：</b>conduct a pay equity review · 开展薪酬公平性审查</p></details><details><summary>Deferred compensation — 递延薪酬</summary><p><b>核心释义：</b>按约定在未来支付的报酬。</p><p><b>职场英文例句：</b>Part of the executive reward package is deferred compensation.</p><p><b>中文翻译：</b>高管薪酬方案中有一部分采用递延薪酬形式。</p><p><b>高频短语：</b>deferred compensation arrangement · 递延薪酬安排</p></details><details><summary>Tuition reimbursement — 员工学费报销／继续教育学费报销</summary><p><b>核心释义：</b>企业福利计划按规定报销员工参加获批课程、学位项目或继续教育发生的学费。</p><p><b>职场英文例句：</b>Employees can apply for tuition reimbursement after completing an approved course.</p><p><b>中文翻译：</b>员工完成经批准的课程后，可以申请学费报销。</p><p><b>高频短语：</b>apply for tuition reimbursement · 申请学费报销</p></details><details><summary>Tuition assistance — 员工学费资助</summary><p><b>核心释义：</b>雇主为员工教育培训提供的财务支持，可能通过预付、补贴或报销实现。</p><p><b>职场英文例句：</b>Our tuition assistance program supports job-related degree courses.</p><p><b>中文翻译：</b>我们的学费资助计划支持与工作相关的学位课程。</p><p><b>高频短语：</b>tuition assistance program · 员工学费资助计划</p></details><details><summary>Education assistance program — 员工教育资助计划</summary><p><b>核心释义：</b>支持员工专业学习、学位和认证等教育费用的综合福利计划。</p><p><b>职场英文例句：</b>The education assistance program covers selected professional courses.</p><p><b>中文翻译：</b>员工教育资助计划涵盖部分专业课程。</p><p><b>高频短语：</b>education assistance program · 员工教育资助计划</p></details><details><summary>Reimbursement policy — 费用报销政策</summary><p><b>核心释义：</b>明确可报销支出、额度、审批、凭证及付款时间的公司规则。</p><p><b>职场英文例句：</b>Please check the reimbursement policy before paying the course fee.</p><p><b>中文翻译：</b>支付课程费用前，请先查看报销政策。</p><p><b>高频短语：</b>review the reimbursement policy · 审阅费用报销政策</p></details><details><summary>Benefits package — 员工福利待遇方案</summary><p><b>核心释义：</b>雇主提供的保险、休假、培训补助和其他非工资性福利组合。</p><p><b>职场英文例句：</b>The benefits package includes medical coverage and learning support.</p><p><b>中文翻译：</b>福利方案包括医疗保障和学习支持。</p><p><b>高频短语：</b>review the benefits package · 审阅员工福利待遇方案</p></details><details><summary>Salary review — 薪酬复核／调薪评审</summary><p><b>核心释义：</b>依据绩效、岗位、市场水平和预算进行薪酬检查与调整评审。</p><p><b>职场英文例句：</b>The annual salary review will take place in March.</p><p><b>中文翻译：</b>年度薪酬评审将在三月份进行。</p><p><b>高频短语：</b>conduct a salary review · 开展薪酬复核</p></details><details><summary>Pay slip — 工资单／薪资明细单</summary><p><b>核心释义：</b>列明员工工资、扣款、税费及实发金额的薪资记录。</p><p><b>职场英文例句：</b>Employees can download their pay slips from the HR portal.</p><p><b>中文翻译：</b>员工可以从人力资源门户下载工资单。</p><p><b>高频短语：</b>download a pay slip · 下载工资单</p></details><details><summary>Salary increase — 工资增长／调薪</summary><p><b>核心释义：</b>因年度调薪、晋升或市场调整导致的员工工资提高。</p><p><b>职场英文例句：</b>The salary increase will take effect next month.</p><p><b>中文翻译：</b>此次加薪将于下个月生效。</p><p><b>高频短语：</b>approve a salary increase · 审批工资增长</p></details><details><summary>Promotion increase — 晋升调薪</summary><p><b>核心释义：</b>员工晋升至更高职级时基于新岗位薪酬政策作出的薪酬调整。</p><p><b>职场英文例句：</b>The promotion increase is effective from the promotion date.</p><p><b>中文翻译：</b>晋升调薪自晋升生效日起执行。</p><p><b>高频短语：</b>calculate a promotion increase · 计算晋升调薪</p></details><details><summary>Cost-of-living adjustment (COLA) — 生活成本调整（薪酬）</summary><p><b>核心释义：</b>为应对生活成本变化而作的工资或津贴调整，具体机制依制度。</p><p><b>职场英文例句：</b>The company approved a cost-of-living adjustment for eligible employees.</p><p><b>中文翻译：</b>公司批准为符合条件的员工进行生活成本调薪。</p><p><b>高频短语：</b>apply a cost-of-living adjustment · 实施生活成本调整</p></details><details><summary>Bonus eligibility — 奖金领取资格</summary><p><b>核心释义：</b>员工是否符合某项奖金计划的参加及领取条件。</p><p><b>职场英文例句：</b>Bonus eligibility depends on the plan rules and employment status.</p><p><b>中文翻译：</b>奖金领取资格取决于计划规定及雇佣状态。</p><p><b>高频短语：</b>confirm bonus eligibility · 确认奖金领取资格</p></details><details><summary>Total cash compensation — 年度现金总薪酬</summary><p><b>核心释义：</b>员工在约定期间内获得的基本工资加现金奖金等现金报酬合计。</p><p><b>职场英文例句：</b>The offer includes a breakdown of total cash compensation.</p><p><b>中文翻译：</b>录用方案列明了总现金薪酬的构成。</p><p><b>高频短语：</b>calculate total cash compensation · 计算年度现金总薪酬</p></details><details><summary>Employee stock purchase plan (ESPP) — 员工股票购买计划</summary><p><b>核心释义：</b>允许符合条件的员工依据计划规则购买公司股票的员工福利计划。</p><p><b>职场英文例句：</b>Eligible employees may join the employee stock purchase plan.</p><p><b>中文翻译：</b>符合条件的员工可以参加员工股票购买计划（ESPP）。</p><p><b>高频短语：</b>enroll in an employee stock purchase plan · 参加员工股票购买计划</p></details><details><summary>Dependent care assistance — 家属照护福利补助</summary><p><b>核心释义：</b>帮助员工承担符合规定的子女或其他受扶养人照护费用的福利。</p><p><b>职场英文例句：</b>The benefits team introduced dependent care assistance this year.</p><p><b>中文翻译：</b>福利团队今年推出了受抚养人照护支持。</p><p><b>高频短语：</b>dependent care assistance benefit · 家属照护福利补助</p></details><details><summary>Wellness allowance — 员工健康津贴</summary><p><b>核心释义：</b>企业按政策提供用于运动、身心健康相关项目的补贴福利。</p><p><b>职场英文例句：</b>Employees can use the wellness allowance for eligible fitness activities.</p><p><b>中文翻译：</b>员工可将健康津贴用于符合规定的健身活动。</p><p><b>高频短语：</b>claim a wellness allowance · 申领员工健康津贴</p></details><details><summary>Payroll deduction — 工资代扣项目</summary><p><b>核心释义：</b>从员工应发工资中依法或依约扣除税费、福利缴费等款项。</p><p><b>职场英文例句：</b>Check that the payroll deduction matches the enrollment form.</p><p><b>中文翻译：</b>请检查工资代扣金额是否与登记表一致。</p><p><b>高频短语：</b>verify a payroll deduction · 核验工资代扣项目</p></details></details><details class="fallback-module"><summary><b>绩效管理</b> · 52条</summary><details><summary>Performance cycle — 绩效周期</summary><p><b>核心释义：</b>制定目标、跟踪、评价及反馈的完整过程。</p><p><b>职场英文例句：</b>The performance cycle starts with goal setting in January.</p><p><b>中文翻译：</b>绩效管理周期从一月份制定目标开始。</p><p><b>高频短语：</b>annual performance cycle · 年度绩效考核周期</p></details><details><summary>Goal setting — 目标制定</summary><p><b>核心释义：</b>明确预期成果与衡量标准。</p><p><b>职场英文例句：</b>Effective goal setting requires clear priorities.</p><p><b>中文翻译：</b>有效的目标设定需要明确优先事项。</p><p><b>高频短语：</b>align on goal setting · 就目标设定达成一致</p></details><details><summary>SMART goals — SMART目标</summary><p><b>核心释义：</b>具体、可衡量、可实现、相关且有时限的目标。</p><p><b>职场英文例句：</b>Managers help employees write SMART goals for the quarter.</p><p><b>中文翻译：</b>管理者协助员工制定本季度的SMART目标。</p><p><b>高频短语：</b>set SMART goals · 设定SMART目标</p></details><details><summary>Key performance indicators (KPIs) — 关键绩效指标</summary><p><b>核心释义：</b>衡量关键工作结果的指标。</p><p><b>职场英文例句：</b>The team tracks key performance indicators in a monthly report.</p><p><b>中文翻译：</b>团队在月报中跟踪关键绩效指标。</p><p><b>高频短语：</b>track KPIs · 跟踪关键绩效指标（KPI）</p></details><details><summary>Objectives and key results (OKRs) — 目标与关键结果</summary><p><b>核心释义：</b>用目标及可衡量结果推进工作。</p><p><b>职场英文例句：</b>Our objectives and key results are reviewed every quarter.</p><p><b>中文翻译：</b>我们的目标与关键成果（OKR）每季度评审一次。</p><p><b>高频短语：</b>review OKRs · 复盘目标与关键结果（OKR）</p></details><details><summary>Performance review — 绩效评估</summary><p><b>核心释义：</b>正式回顾员工在特定周期内的表现。</p><p><b>职场英文例句：</b>The performance review should include specific evidence.</p><p><b>中文翻译：</b>绩效评估应包含具体的事实依据。</p><p><b>高频短语：</b>conduct a performance review · 开展绩效评估</p></details><details><summary>Self-assessment — 自我评价</summary><p><b>核心释义：</b>员工对目标完成情况进行反思和说明。</p><p><b>职场英文例句：</b>Please submit your self-assessment before the manager review.</p><p><b>中文翻译：</b>请在经理评估前提交自我评价。</p><p><b>高频短语：</b>write a self-assessment · 撰写绩效自评</p></details><details><summary>Peer feedback — 同事反馈</summary><p><b>核心释义：</b>由协作同事提供的表现意见。</p><p><b>职场英文例句：</b>Peer feedback can highlight collaboration strengths.</p><p><b>中文翻译：</b>同事反馈能够帮助发现团队协作方面的优势。</p><p><b>高频短语：</b>collect peer feedback · 收集同事反馈</p></details><details><summary>360-degree feedback — 360度反馈</summary><p><b>核心释义：</b>从上级、同事和其他相关方收集意见。</p><p><b>职场英文例句：</b>We use 360-degree feedback for leadership development.</p><p><b>中文翻译：</b>我们使用360度反馈促进领导力发展。</p><p><b>高频短语：</b>launch a 360-degree survey · 发起 360 度反馈调查</p></details><details><summary>Calibration meeting — 绩效校准会</summary><p><b>核心释义：</b>跨团队讨论评估标准和结果的一致性。</p><p><b>职场英文例句：</b>The calibration meeting will review ratings across departments.</p><p><b>中文翻译：</b>绩效校准会议将评审各部门的评分。</p><p><b>高频短语：</b>facilitate a calibration meeting · 主持绩效校准会</p></details><details><summary>Performance rating — 绩效等级</summary><p><b>核心释义：</b>对绩效结果作出的分级评价。</p><p><b>职场英文例句：</b>Each performance rating must be supported by evidence.</p><p><b>中文翻译：</b>每一项绩效评级都必须有事实依据支持。</p><p><b>高频短语：</b>justify a performance rating · 说明绩效评级依据</p></details><details><summary>Rating scale — 评分量表</summary><p><b>核心释义：</b>规定不同评分等级的具体含义。</p><p><b>职场英文例句：</b>The new rating scale has five clearly defined levels.</p><p><b>中文翻译：</b>新的绩效评级量表设有五个定义明确的等级。</p><p><b>高频短语：</b>apply a rating scale · 应用绩效评分量表</p></details><details><summary>Competency framework — 胜任力模型</summary><p><b>核心释义：</b>明确岗位所需能力和行为标准。</p><p><b>职场英文例句：</b>The competency framework guides our assessments.</p><p><b>中文翻译：</b>胜任力框架为我们的评估工作提供指导。</p><p><b>高频短语：</b>update the competency framework · 更新胜任力框架</p></details><details><summary>Behavior indicators — 行为指标</summary><p><b>核心释义：</b>用于观察能力表现的具体行为描述。</p><p><b>职场英文例句：</b>Behavior indicators make performance discussions more objective.</p><p><b>中文翻译：</b>行为指标使绩效讨论更加客观。</p><p><b>高频短语：</b>define behavior indicators · 定义行为指标</p></details><details><summary>Continuous feedback — 持续反馈</summary><p><b>核心释义：</b>在正式考核之外及时交流工作表现。</p><p><b>职场英文例句：</b>Continuous feedback helps employees adjust quickly.</p><p><b>中文翻译：</b>持续反馈有助于员工及时调整工作方式。</p><p><b>高频短语：</b>encourage continuous feedback · 鼓励持续反馈</p></details><details><summary>One-on-one meeting — 一对一沟通</summary><p><b>核心释义：</b>经理与员工定期交流工作及发展的会议。</p><p><b>职场英文例句：</b>The one-on-one meeting is a good time to discuss blockers.</p><p><b>中文翻译：</b>一对一会议是讨论工作障碍的好时机。</p><p><b>高频短语：</b>schedule a one-on-one meeting · 安排一对一沟通会议</p></details><details><summary>Mid-year check-in — 年中回顾</summary><p><b>核心释义：</b>在考核周期中途检查进展和调整目标。</p><p><b>职场英文例句：</b>We use the mid-year check-in to revisit priorities.</p><p><b>中文翻译：</b>我们通过年中沟通重新审视工作重点。</p><p><b>高频短语：</b>complete a mid-year check-in · 完成年中绩效回顾</p></details><details><summary>Year-end review — 年终评估</summary><p><b>核心释义：</b>在年度结束时总结绩效及成长。</p><p><b>职场英文例句：</b>The year-end review will focus on results and lessons learned.</p><p><b>中文翻译：</b>年终评估将聚焦工作成果及经验教训。</p><p><b>高频短语：</b>prepare a year-end review · 准备年终绩效评估</p></details><details><summary>Performance improvement plan (PIP) — 绩效改进计划</summary><p><b>核心释义：</b>明确改进目标、支持措施和时间节点。</p><p><b>职场英文例句：</b>The performance improvement plan sets out clear expectations and support.</p><p><b>中文翻译：</b>绩效改进计划明确了工作期望和支持措施。</p><p><b>高频短语：</b>launch a PIP · 启动绩效改进计划（PIP）</p></details><details><summary>Underperformance — 绩效不达标</summary><p><b>核心释义：</b>工作表现未达到明确约定标准。</p><p><b>职场英文例句：</b>Managers should address underperformance with timely feedback.</p><p><b>中文翻译：</b>管理者应通过及时反馈来处理绩效不达标问题。</p><p><b>高频短语：</b>manage underperformance · 管理低绩效问题</p></details><details><summary>High performer — 高绩效员工</summary><p><b>核心释义：</b>持续交付优异工作成果的人才。</p><p><b>职场英文例句：</b>The high performer took on a challenging cross-team project.</p><p><b>中文翻译：</b>这位高绩效员工承担了一项具有挑战性的跨团队项目。</p><p><b>高频短语：</b>recognize high performers · 表彰高绩效员工</p></details><details><summary>Stretch goal — 挑战性目标</summary><p><b>核心释义：</b>高于常规预期但具有合理路径的目标。</p><p><b>职场英文例句：</b>We agreed on a stretch goal for the next quarter.</p><p><b>中文翻译：</b>我们商定了下一季度的一项挑战性目标。</p><p><b>高频短语：</b>set a stretch goal · 设定挑战性目标</p></details><details><summary>Goal alignment — 目标对齐</summary><p><b>核心释义：</b>确保个人目标支持团队与组织方向。</p><p><b>职场英文例句：</b>Goal alignment helps everyone focus on shared priorities.</p><p><b>中文翻译：</b>目标对齐有助于所有人聚焦共同的优先事项。</p><p><b>高频短语：</b>improve goal alignment · 改善目标对齐</p></details><details><summary>Performance gap — 绩效差距</summary><p><b>核心释义：</b>当前表现与预期标准之间的差异。</p><p><b>职场英文例句：</b>We identified a performance gap in project delivery.</p><p><b>中文翻译：</b>我们发现项目交付方面存在绩效差距。</p><p><b>高频短语：</b>close a performance gap · 弥合绩效差距</p></details><details><summary>Development plan — 发展计划</summary><p><b>核心释义：</b>记录需要发展的能力及具体行动。</p><p><b>职场英文例句：</b>The development plan includes training and mentoring.</p><p><b>中文翻译：</b>发展计划包括培训和导师辅导。</p><p><b>高频短语：</b>create a development plan · 制定员工发展计划</p></details><details><summary>Recognition — 员工认可与表彰</summary><p><b>核心释义：</b>对员工贡献和行为的肯定、表扬或奖励，在绩效和文化管理中常见。</p><p><b>职场英文例句：</b>Regular recognition can reinforce desired behaviors.</p><p><b>中文翻译：</b>经常给予认可可以强化期望的工作行为。</p><p><b>高频短语：</b>give meaningful recognition · 给予有意义的员工认可</p></details><details><summary>Promotion readiness — 晋升准备度</summary><p><b>核心释义：</b>衡量员工是否具备承担更高职责的能力。</p><p><b>职场英文例句：</b>Promotion readiness requires evidence beyond strong current performance.</p><p><b>中文翻译：</b>评估晋升准备度，不能只看当前岗位表现是否出色。</p><p><b>高频短语：</b>assess promotion readiness · 评估晋升准备度</p></details><details><summary>Manager assessment — 经理评价</summary><p><b>核心释义：</b>由直属经理对员工工作及能力作出的判断。</p><p><b>职场英文例句：</b>The manager assessment should reference observable outcomes.</p><p><b>中文翻译：</b>经理评价应以可观察到的工作成果为依据。</p><p><b>高频短语：</b>complete a manager assessment · 完成管理者评价</p></details><details><summary>Rating bias — 评分偏差</summary><p><b>核心释义：</b>评价受到近因、光环等非客观因素影响。</p><p><b>职场英文例句：</b>Calibration helps us reduce rating bias across teams.</p><p><b>中文翻译：</b>绩效校准有助于减少团队之间的评分偏差。</p><p><b>高频短语：</b>reduce rating bias · 降低绩效评分偏差</p></details><details><summary>Performance documentation — 绩效记录</summary><p><b>核心释义：</b>保存目标、反馈与评价证据的材料。</p><p><b>职场英文例句：</b>Good performance documentation supports fair decisions.</p><p><b>中文翻译：</b>完善的绩效记录有助于支持公平决策。</p><p><b>高频短语：</b>maintain performance documentation · 维护绩效记录</p></details><details><summary>Performance calibration — 绩效校准</summary><p><b>核心释义：</b>统一不同团队绩效评价标准与结果的过程。</p><p><b>职场英文例句：</b>Performance calibration should be based on documented evidence.</p><p><b>中文翻译：</b>绩效校准应当以书面记录的事实为基础。</p><p><b>高频短语：</b>calibrate performance ratings · 校准绩效评级</p></details><details><summary>Performance conversation — 绩效沟通</summary><p><b>核心释义：</b>围绕目标、结果和发展需要进行的双向交流。</p><p><b>职场英文例句：</b>A good performance conversation includes specific examples.</p><p><b>中文翻译：</b>高质量的绩效面谈应包含具体事例。</p><p><b>高频短语：</b>hold a performance conversation · 开展绩效沟通</p></details><details><summary>Goal cascading — 目标分解</summary><p><b>核心释义：</b>将组织目标逐层转化为团队和个人目标。</p><p><b>职场英文例句：</b>Goal cascading connects team priorities to business strategy.</p><p><b>中文翻译：</b>目标逐级分解将团队优先事项与业务战略连接起来。</p><p><b>高频短语：</b>cascade organizational goals · 将组织目标逐级分解</p></details><details><summary>Balanced scorecard — 平衡计分卡</summary><p><b>核心释义：</b>从多个业务视角衡量战略执行的管理工具。</p><p><b>职场英文例句：</b>The balanced scorecard tracks financial and nonfinancial outcomes.</p><p><b>中文翻译：</b>平衡计分卡用于跟踪财务和非财务成果。</p><p><b>高频短语：</b>balanced scorecard framework · 平衡计分卡框架</p></details><details><summary>Performance threshold — 绩效门槛</summary><p><b>核心释义：</b>达到某绩效等级或激励的最低要求。</p><p><b>职场英文例句：</b>The incentive plan has a minimum performance threshold.</p><p><b>中文翻译：</b>激励计划设定了最低绩效门槛。</p><p><b>高频短语：</b>meet the performance threshold · 达到绩效门槛</p></details><details><summary>Improvement milestone — 改进里程碑</summary><p><b>核心释义：</b>绩效改进过程中的阶段性检查点。</p><p><b>职场英文例句：</b>The plan sets an improvement milestone for the end of the month.</p><p><b>中文翻译：</b>该计划设定了本月底需要达成的改进里程碑。</p><p><b>高频短语：</b>track improvement milestones · 跟踪改进里程碑</p></details><details><summary>Evidence-based assessment — 基于证据的评价</summary><p><b>核心释义：</b>依实际成果与行为而非印象评分。</p><p><b>职场英文例句：</b>Evidence-based assessment reduces subjective rating decisions.</p><p><b>中文翻译：</b>以事实为依据的评估有助于减少主观评分。</p><p><b>高频短语：</b>evidence-based performance assessment · 基于事实证据的绩效评估</p></details><details><summary>Goal weighting — 目标权重</summary><p><b>核心释义：</b>不同绩效目标在总评价中的占比。</p><p><b>职场英文例句：</b>Goal weighting reflects each objective&#x27;s relative importance.</p><p><b>中文翻译：</b>目标权重反映各项目标的相对重要性。</p><p><b>高频短语：</b>adjust goal weighting · 调整目标权重</p></details><details><summary>Feedback loop — 反馈闭环</summary><p><b>核心释义：</b>收集、处理反馈并追踪改进行动的循环。</p><p><b>职场英文例句：</b>We need a feedback loop to verify the changes are working.</p><p><b>中文翻译：</b>我们需要建立反馈闭环，以验证改进措施是否有效。</p><p><b>高频短语：</b>close the feedback loop · 形成反馈闭环</p></details><details><summary>Career conversation — 职业发展对话</summary><p><b>核心释义：</b>讨论员工长期成长方向与机会。</p><p><b>职场英文例句：</b>Managers hold career conversations at least twice a year.</p><p><b>中文翻译：</b>管理者每年至少开展两次员工职业发展面谈。</p><p><b>高频短语：</b>career development conversation · 职业发展沟通</p></details><details><summary>Performance appraisal — 员工绩效考核／评价</summary><p><b>核心释义：</b>根据岗位目标和绩效标准对员工在一定周期的工作表现作出正式评价。</p><p><b>职场英文例句：</b>The annual performance appraisal includes a manager review.</p><p><b>中文翻译：</b>年度绩效考核包括经理评价。</p><p><b>高频短语：</b>complete a performance appraisal · 完成员工绩效考核</p></details><details><summary>Performance feedback — 绩效反馈</summary><p><b>核心释义：</b>主管基于工作事实向员工反馈表现及改进方向的沟通。</p><p><b>职场英文例句：</b>Managers should provide specific performance feedback throughout the year.</p><p><b>中文翻译：</b>管理者应在全年持续提供具体的绩效反馈。</p><p><b>高频短语：</b>give performance feedback · 给予绩效反馈</p></details><details><summary>Rating distribution — 绩效等级分布</summary><p><b>核心释义：</b>各个绩效等级中员工人数或占比的分布情况。</p><p><b>职场英文例句：</b>HR reviewed the rating distribution before calibration.</p><p><b>中文翻译：</b>校准前，人力资源部门审查了绩效评级分布情况。</p><p><b>高频短语：</b>review the rating distribution · 审阅绩效等级分布</p></details><details><summary>Forced distribution — 强制绩效分布</summary><p><b>核心释义：</b>要求按预设比例将员工分配到绩效等级的评估方法，可能引发公平性争议。</p><p><b>职场英文例句：</b>The company decided not to use forced distribution this year.</p><p><b>中文翻译：</b>公司决定今年不采用强制分布法。</p><p><b>高频短语：</b>use forced distribution · 使用强制绩效分布</p></details><details><summary>Performance objective — 绩效目标</summary><p><b>核心释义：</b>在绩效周期内对员工或团队明确设定的工作成果与要求。</p><p><b>职场英文例句：</b>Each performance objective should be measurable.</p><p><b>中文翻译：</b>每项绩效目标都应可以衡量。</p><p><b>高频短语：</b>set a performance objective · 设定绩效目标</p></details><details><summary>Key result — 关键结果（OKR）</summary><p><b>核心释义：</b>用于衡量目标是否实现的可验证结果，属于 OKR 框架的一部分。</p><p><b>职场英文例句：</b>We revised the key result to include a clear metric.</p><p><b>中文翻译：</b>我们修订了关键结果，加入明确的衡量指标。</p><p><b>高频短语：</b>define a key result · 制定关键结果</p></details><details><summary>Performance evidence — 绩效事实依据</summary><p><b>核心释义：</b>支撑绩效评价的具体工作成果、数据与可核实行为记录。</p><p><b>职场英文例句：</b>The manager collected performance evidence before the review.</p><p><b>中文翻译：</b>经理在绩效评估前收集了绩效证据。</p><p><b>高频短语：</b>document performance evidence · 记录绩效事实依据</p></details><details><summary>Goal achievement rate — 目标达成率</summary><p><b>核心释义：</b>对约定目标实际完成程度进行衡量的比例或指数。</p><p><b>职场英文例句：</b>The goal achievement rate is one input into the review.</p><p><b>中文翻译：</b>目标达成率是绩效评估的参考因素之一。</p><p><b>高频短语：</b>measure goal achievement rate · 衡量目标达成率</p></details><details><summary>Mid-year performance review — 年中绩效回顾／考核</summary><p><b>核心释义：</b>在绩效年度中段对目标进度、成果及后续计划的系统讨论。</p><p><b>职场英文例句：</b>The mid-year performance review will include development goals.</p><p><b>中文翻译：</b>年中绩效评估将包括个人发展目标。</p><p><b>高频短语：</b>hold a mid-year performance review · 召开年中绩效回顾</p></details><details><summary>Performance rating appeal — 绩效评分申诉</summary><p><b>核心释义：</b>员工对绩效评价结果提出异议并申请复核的流程。</p><p><b>职场英文例句：</b>Employees may submit a performance rating appeal within ten working days.</p><p><b>中文翻译：</b>员工可在十个工作日内提出绩效评级申诉。</p><p><b>高频短语：</b>submit a performance rating appeal · 提交绩效评分申诉</p></details><details><summary>Manager effectiveness — 管理者管理效能</summary><p><b>核心释义：</b>衡量管理者在目标达成、团队发展和员工管理方面效果的概念。</p><p><b>职场英文例句：</b>The survey measures manager effectiveness across departments.</p><p><b>中文翻译：</b>该调查衡量不同部门管理者的管理效能。</p><p><b>高频短语：</b>assess manager effectiveness · 评估管理者管理效能</p></details><details><summary>Continuous performance management — 持续绩效管理</summary><p><b>核心释义：</b>通过定期反馈、目标复盘与辅导替代仅依赖年度评价的管理方式。</p><p><b>职场英文例句：</b>Continuous performance management encourages timely coaching.</p><p><b>中文翻译：</b>持续绩效管理鼓励管理者及时辅导员工。</p><p><b>高频短语：</b>adopt continuous performance management · 采用持续绩效管理方式</p></details></details><details class="fallback-module"><summary><b>学习培训与人才发展</b> · 54条</summary><details><summary>Learning needs analysis — 培训需求分析</summary><p><b>核心释义：</b>识别业务目标与能力差距。</p><p><b>职场英文例句：</b>We completed a learning needs analysis before designing the program.</p><p><b>中文翻译：</b>在设计培训项目之前，我们完成了学习需求分析。</p><p><b>高频短语：</b>conduct a learning needs analysis · 开展培训需求分析</p></details><details><summary>Learning objective — 学习目标</summary><p><b>核心释义：</b>明确培训后应掌握的知识或技能。</p><p><b>职场英文例句：</b>Each module has a measurable learning objective.</p><p><b>中文翻译：</b>每个课程模块都有可衡量的学习目标。</p><p><b>高频短语：</b>define learning objectives · 明确学习目标</p></details><details><summary>Training roadmap — 培训路线图</summary><p><b>核心释义：</b>按阶段规划课程与能力建设。</p><p><b>职场英文例句：</b>The training roadmap covers the next two quarters.</p><p><b>中文翻译：</b>培训路线图涵盖未来两个季度。</p><p><b>高频短语：</b>publish a training roadmap · 发布培训路线图</p></details><details><summary>Training budget — 培训预算</summary><p><b>核心释义：</b>用于课程、讲师及学习工具的经费。</p><p><b>职场英文例句：</b>The training budget has been approved for this year.</p><p><b>中文翻译：</b>今年的培训预算已经获批。</p><p><b>高频短语：</b>allocate a training budget · 分配培训预算</p></details><details><summary>Onboarding curriculum — 新人培训课程</summary><p><b>核心释义：</b>帮助员工理解岗位和公司制度的课程组合。</p><p><b>职场英文例句：</b>The onboarding curriculum includes product and security training.</p><p><b>中文翻译：</b>新员工培训课程包括产品和信息安全培训。</p><p><b>高频短语：</b>refresh the onboarding curriculum · 更新新员工培训课程</p></details><details><summary>Instructor-led training — 讲师授课</summary><p><b>核心释义：</b>由讲师主持的现场或在线学习形式。</p><p><b>职场英文例句：</b>Instructor-led training works well for complex discussions.</p><p><b>中文翻译：</b>讲师主导的培训适合需要深入讨论的复杂议题。</p><p><b>高频短语：</b>deliver instructor-led training · 开展讲师主导的培训</p></details><details><summary>Virtual classroom — 线上课堂</summary><p><b>核心释义：</b>具备实时交流功能的远程培训环境。</p><p><b>职场英文例句：</b>The virtual classroom allows participants to ask questions.</p><p><b>中文翻译：</b>虚拟课堂让参与者可以实时提问。</p><p><b>高频短语：</b>join a virtual classroom · 参加线上课堂</p></details><details><summary>E-learning — 在线学习</summary><p><b>核心释义：</b>通过数字化课程自主或分阶段学习。</p><p><b>职场英文例句：</b>E-learning gives employees more flexibility.</p><p><b>中文翻译：</b>在线学习为员工提供了更大的灵活性。</p><p><b>高频短语：</b>launch an e-learning course · 上线在线学习课程</p></details><details><summary>Learning management system (LMS) — 学习管理系统</summary><p><b>核心释义：</b>分发课程并跟踪学习记录的平台。</p><p><b>职场英文例句：</b>The learning management system tracks course completion.</p><p><b>中文翻译：</b>学习管理系统用于跟踪课程完成情况。</p><p><b>高频短语：</b>use the LMS · 使用学习管理系统（LMS）</p></details><details><summary>Blended learning — 混合式学习</summary><p><b>核心释义：</b>结合线上、线下及实践活动的学习方式。</p><p><b>职场英文例句：</b>Blended learning combines short videos with workshops.</p><p><b>中文翻译：</b>混合式学习将短视频与工作坊结合起来。</p><p><b>高频短语：</b>design blended learning · 设计混合式学习方案</p></details><details><summary>Microlearning — 微学习</summary><p><b>核心释义：</b>通过短小内容完成单个学习目标。</p><p><b>职场英文例句：</b>Microlearning is useful for quick policy refreshers.</p><p><b>中文翻译：</b>微学习适合快速复习公司政策。</p><p><b>高频短语：</b>create a microlearning module · 创建微学习模块</p></details><details><summary>Training attendance — 培训出勤情况</summary><p><b>核心释义：</b>记录员工参加培训的到场情况或参训时长。</p><p><b>职场英文例句：</b>Training attendance improved after we changed the schedule.</p><p><b>中文翻译：</b>调整培训时间后，培训出勤率提高了。</p><p><b>高频短语：</b>track training attendance · 记录培训出勤情况</p></details><details><summary>Completion rate — 培训／课程完成率</summary><p><b>核心释义：</b>在规定期间内按要求完成课程或学习任务的学员占比。</p><p><b>职场英文例句：</b>The completion rate reached 92 percent this month.</p><p><b>中文翻译：</b>本月的课程完成率达到了92%。</p><p><b>高频短语：</b>training completion rate · 培训完成率</p></details><details><summary>Knowledge check — 知识测验</summary><p><b>核心释义：</b>快速检验学习者是否掌握要点。</p><p><b>职场英文例句：</b>A short knowledge check follows each lesson.</p><p><b>中文翻译：</b>每节课后都会安排一次简短的知识检测。</p><p><b>高频短语：</b>take a knowledge check · 参加知识测验</p></details><details><summary>Skills assessment — 技能评估</summary><p><b>核心释义：</b>使用任务或标准判断技能掌握程度。</p><p><b>职场英文例句：</b>The skills assessment identified gaps in data analysis.</p><p><b>中文翻译：</b>技能评估发现了数据分析方面的能力差距。</p><p><b>高频短语：</b>run a skills assessment · 开展技能评估</p></details><details><summary>Competency gap — 能力差距</summary><p><b>核心释义：</b>实际能力与岗位所需能力之间的差异。</p><p><b>职场英文例句：</b>We found a competency gap in stakeholder communication.</p><p><b>中文翻译：</b>我们发现利益相关方沟通能力存在短板。</p><p><b>高频短语：</b>address a competency gap · 弥补能力差距</p></details><details><summary>Upskilling — 技能提升</summary><p><b>核心释义：</b>在现有岗位相关领域提高能力。</p><p><b>职场英文例句：</b>Upskilling helps employees adapt to new tools.</p><p><b>中文翻译：</b>技能提升培训帮助员工适应新工具。</p><p><b>高频短语：</b>invest in upskilling · 投入资源提升员工技能</p></details><details><summary>Reskilling — 技能转型</summary><p><b>核心释义：</b>培养胜任不同岗位或任务所需的新技能。</p><p><b>职场英文例句：</b>Reskilling supports employees moving into new roles.</p><p><b>中文翻译：</b>转岗再培训支持员工转入新岗位。</p><p><b>高频短语：</b>reskilling program · 技能转型培训项目</p></details><details><summary>Coaching — 教练式辅导</summary><p><b>核心释义：</b>通过提问与反馈促进个人成长。</p><p><b>职场英文例句：</b>Coaching helps managers improve decision-making skills.</p><p><b>中文翻译：</b>教练式辅导帮助管理者提升决策能力。</p><p><b>高频短语：</b>provide coaching · 提供教练式辅导</p></details><details><summary>Mentoring — 导师指导</summary><p><b>核心释义：</b>由经验丰富者持续提供职业建议。</p><p><b>职场英文例句：</b>Mentoring pairs new leaders with experienced colleagues.</p><p><b>中文翻译：</b>导师计划为新任管理者匹配经验丰富的同事。</p><p><b>高频短语：</b>mentoring relationship · 导师辅导关系</p></details><details><summary>Job shadowing — 岗位跟岗</summary><p><b>核心释义：</b>通过观察他人工作学习实际流程。</p><p><b>职场英文例句：</b>Job shadowing helps new hires understand customer support.</p><p><b>中文翻译：</b>岗位跟岗学习帮助新员工了解客户支持工作。</p><p><b>高频短语：</b>arrange job shadowing · 安排岗位跟岗学习</p></details><details><summary>Cross-training — 交叉培训</summary><p><b>核心释义：</b>学习其他岗位技能以增强协作与弹性。</p><p><b>职场英文例句：</b>Cross-training allows team members to cover critical tasks.</p><p><b>中文翻译：</b>交叉培训让团队成员能够相互承担关键任务。</p><p><b>高频短语：</b>cross-training plan · 交叉培训计划</p></details><details><summary>Learning path — 学习路径</summary><p><b>核心释义：</b>为特定岗位或能力设计的课程顺序。</p><p><b>职场英文例句：</b>The learning path includes beginner and advanced modules.</p><p><b>中文翻译：</b>该学习路径包括初级和高级课程模块。</p><p><b>高频短语：</b>personalized learning path · 个性化学习路径</p></details><details><summary>Leadership development — 领导力发展</summary><p><b>核心释义：</b>系统培养管理与领导能力。</p><p><b>职场英文例句：</b>Leadership development is a priority for new managers.</p><p><b>中文翻译：</b>领导力发展是新任管理者培养的重点。</p><p><b>高频短语：</b>leadership development program · 领导力发展项目</p></details><details><summary>Management trainee program — 管理培训生项目（管培生计划）</summary><p><b>核心释义：</b>面向早期职业人才，以轮岗、培养与实践加速管理人才储备的项目。</p><p><b>职场英文例句：</b>The management trainee program includes rotations across functions.</p><p><b>中文翻译：</b>管理培训生项目包括跨职能轮岗。</p><p><b>高频短语：</b>join a management trainee program · 参加管理培训生项目</p></details><details><summary>Individual development plan (IDP) — 个人发展计划</summary><p><b>核心释义：</b>员工与经理共同制定的成长行动方案。</p><p><b>职场英文例句：</b>Each employee can update their individual development plan quarterly.</p><p><b>中文翻译：</b>员工可以按季度更新个人发展计划（IDP）。</p><p><b>高频短语：</b>review an IDP · 审阅个人发展计划（IDP）</p></details><details><summary>70-20-10 model — 70-20-10学习模型</summary><p><b>核心释义：</b>强调实践、互动与正式学习的组合。</p><p><b>职场英文例句：</b>The 70-20-10 model reminds us to include on-the-job learning.</p><p><b>中文翻译：</b>70-20-10模型提醒我们重视在岗实践学习。</p><p><b>高频短语：</b>apply the 70-20-10 model · 应用70-20-10学习模型</p></details><details><summary>Learning transfer — 学习迁移</summary><p><b>核心释义：</b>把课程中学到的知识用于实际工作。</p><p><b>职场英文例句：</b>Manager follow-ups can improve learning transfer.</p><p><b>中文翻译：</b>管理者的后续跟进有助于促进培训成果转化。</p><p><b>高频短语：</b>support learning transfer · 支持学习迁移</p></details><details><summary>Training effectiveness — 培训有效性</summary><p><b>核心释义：</b>衡量课程是否改善知识、行为或结果。</p><p><b>职场英文例句：</b>We evaluate training effectiveness after three months.</p><p><b>中文翻译：</b>我们会在三个月后评估培训效果。</p><p><b>高频短语：</b>measure training effectiveness · 衡量培训有效性</p></details><details><summary>Return on learning investment — 学习投入回报</summary><p><b>核心释义：</b>比较学习投资与可归因收益的思路。</p><p><b>职场英文例句：</b>We discuss return on learning investment for major programs.</p><p><b>中文翻译：</b>对于大型培训项目，我们会讨论学习投资回报。</p><p><b>高频短语：</b>estimate learning return · 评估学习投入回报</p></details><details><summary>Training needs assessment (TNA) — 培训需求评估</summary><p><b>核心释义：</b>识别业务目标与现有能力之间的培训差距。</p><p><b>职场英文例句：</b>The training needs assessment identified gaps in stakeholder communication.</p><p><b>中文翻译：</b>培训需求评估发现利益相关方沟通方面存在差距。</p><p><b>高频短语：</b>run a training needs assessment · 开展培训需求评估</p></details><details><summary>Instructional design — 教学设计</summary><p><b>核心释义：</b>围绕学习目标设计课程与活动的过程。</p><p><b>职场英文例句：</b>Instructional design starts with clear learning outcomes.</p><p><b>中文翻译：</b>教学设计应从明确的学习成果开始。</p><p><b>高频短语：</b>instructional design principles · 教学设计原则</p></details><details><summary>Learning outcome — 学习成果</summary><p><b>核心释义：</b>完成学习后可以展示的知识或能力。</p><p><b>职场英文例句：</b>Each module has a measurable learning outcome.</p><p><b>中文翻译：</b>每个课程模块都有可衡量的学习成果。</p><p><b>高频短语：</b>define learning outcomes · 制定学习成果</p></details><details><summary>Facilitator — 引导师</summary><p><b>核心释义：</b>组织培训讨论与活动的人。</p><p><b>职场英文例句：</b>The facilitator will guide the leadership workshop.</p><p><b>中文翻译：</b>培训引导师将带领领导力工作坊。</p><p><b>高频短语：</b>workshop facilitator · 培训工作坊引导师</p></details><details><summary>Learning analytics — 学习数据分析</summary><p><b>核心释义：</b>通过学习活动与效果数据优化培训。</p><p><b>职场英文例句：</b>Learning analytics shows which courses have low completion rates.</p><p><b>中文翻译：</b>学习数据分析显示哪些课程的完成率偏低。</p><p><b>高频短语：</b>learning analytics dashboard · 学习数据分析仪表板</p></details><details><summary>Capability building — 能力建设</summary><p><b>核心释义：</b>通过实践与培养提升组织或个人能力。</p><p><b>职场英文例句：</b>Capability building is central to our digital transformation plan.</p><p><b>中文翻译：</b>能力建设是我们数字化转型计划的核心。</p><p><b>高频短语：</b>organizational capability building · 组织能力建设</p></details><details><summary>Learning agility — 学习敏捷性</summary><p><b>核心释义：</b>面对新情境时快速学习并应用经验的能力。</p><p><b>职场英文例句：</b>Learning agility is one factor in leadership potential assessment.</p><p><b>中文翻译：</b>学习敏捷性是评估领导力潜力的因素之一。</p><p><b>高频短语：</b>assess learning agility · 评估学习敏捷性</p></details><details><summary>Peer learning — 同伴学习</summary><p><b>核心释义：</b>通过同事互助和知识分享共同提高。</p><p><b>职场英文例句：</b>Peer learning sessions help teams share practical techniques.</p><p><b>中文翻译：</b>同伴学习活动帮助团队分享实用技巧。</p><p><b>高频短语：</b>peer learning circle · 同伴学习小组</p></details><details><summary>Action learning — 行动学习</summary><p><b>核心释义：</b>以真实业务问题为载体开展学习与反思。</p><p><b>职场英文例句：</b>Action learning teams work on live business challenges.</p><p><b>中文翻译：</b>行动学习小组会解决真实的业务挑战。</p><p><b>高频短语：</b>action learning project · 行动学习项目</p></details><details><summary>Kirkpatrick model — 柯氏四级评估模型</summary><p><b>核心释义：</b>从反应、学习、行为、结果四层评估培训。</p><p><b>职场英文例句：</b>We use the Kirkpatrick model to evaluate training impact.</p><p><b>中文翻译：</b>我们采用柯氏四级评估模型来评估培训影响。</p><p><b>高频短语：</b>Kirkpatrick&#x27;s four levels · 柯氏四级培训效果评估模型</p></details><details><summary>Professional development — 员工职业能力发展</summary><p><b>核心释义：</b>帮助员工提升当前和未来岗位所需能力的持续学习发展过程。</p><p><b>职场英文例句：</b>We support professional development through internal courses.</p><p><b>中文翻译：</b>我们通过内部课程支持员工的职业发展。</p><p><b>高频短语：</b>support professional development · 支持员工职业能力发展</p></details><details><summary>Certification reimbursement — 职业资格认证费用报销</summary><p><b>核心释义：</b>企业依据制度报销员工取得获批专业证书发生的考试或认证费用。</p><p><b>职场英文例句：</b>Certification reimbursement is available for approved credentials.</p><p><b>中文翻译：</b>获批准的专业资格认证可以申请费用报销。</p><p><b>高频短语：</b>request certification reimbursement · 申请职业资格认证费用报销</p></details><details><summary>Training reimbursement agreement — 培训费用返还约定</summary><p><b>核心释义：</b>约定雇主承担专项培训费用及特定条件下费用返还方式的协议，须遵守当地法律。</p><p><b>职场英文例句：</b>HR reviewed the training reimbursement agreement with legal counsel.</p><p><b>中文翻译：</b>人力资源部门与法务顾问共同审查了培训费用返还协议。</p><p><b>高频短语：</b>sign a training reimbursement agreement · 签署培训费用返还约定</p></details><details><summary>Learning stipend — 学习津贴／学习预算补贴</summary><p><b>核心释义：</b>企业为员工自主学习或职业成长提供的固定额度支持。</p><p><b>职场英文例句：</b>Every employee receives an annual learning stipend.</p><p><b>中文翻译：</b>每位员工每年都可获得学习津贴。</p><p><b>高频短语：</b>use a learning stipend · 使用学习津贴</p></details><details><summary>Continuing education — 继续教育／在职进修</summary><p><b>核心释义：</b>员工为更新知识、提升技能或获得资格持续参加的正规或非正规教育。</p><p><b>职场英文例句：</b>The policy supports continuing education related to the role.</p><p><b>中文翻译：</b>该政策支持与岗位相关的继续教育。</p><p><b>高频短语：</b>support continuing education · 支持继续教育</p></details><details><summary>Professional certification — 专业资格证书／职业认证</summary><p><b>核心释义：</b>证明个人在特定职业领域达到相应知识或技能要求的认证。</p><p><b>职场英文例句：</b>This role requires a relevant professional certification.</p><p><b>中文翻译：</b>该岗位要求具备相关专业资格认证。</p><p><b>高频短语：</b>obtain a professional certification · 获取专业资格证书</p></details><details><summary>Training nomination — 培训人员提名／选派</summary><p><b>核心释义：</b>部门或管理者推荐员工参加特定课程或培养项目的安排。</p><p><b>职场英文例句：</b>Managers must submit training nominations by Friday.</p><p><b>中文翻译：</b>管理者必须在周五前提交培训提名。</p><p><b>高频短语：</b>submit a training nomination · 提交培训人员提名</p></details><details><summary>Mandatory training — 强制性培训／必修培训</summary><p><b>核心释义：</b>员工因法律、风险或内部政策要求必须完成的培训。</p><p><b>职场英文例句：</b>All new hires must complete mandatory training within 30 days.</p><p><b>中文翻译：</b>所有新员工都必须在30天内完成必修培训。</p><p><b>高频短语：</b>complete mandatory training · 完成强制性培训</p></details><details><summary>Skills matrix — 员工技能矩阵</summary><p><b>核心释义：</b>按员工与技能维度列示能力水平、资格或培训差距的工具。</p><p><b>职场英文例句：</b>The skills matrix helps us identify capability gaps.</p><p><b>中文翻译：</b>技能矩阵有助于我们识别能力差距。</p><p><b>高频短语：</b>update the skills matrix · 更新员工技能矩阵</p></details><details><summary>Training evaluation — 培训效果评估</summary><p><b>核心释义：</b>通过满意度、知识掌握、行为变化和业务成果评估培训效果。</p><p><b>职场英文例句：</b>We will conduct a training evaluation after the program.</p><p><b>中文翻译：</b>培训项目结束后，我们将开展培训评估。</p><p><b>高频短语：</b>conduct a training evaluation · 开展培训效果评估</p></details><details><summary>Learning budget — 员工学习发展预算</summary><p><b>核心释义：</b>组织用于课程、平台、教材及其他学习发展的资金计划。</p><p><b>职场英文例句：</b>The learning budget covers both internal and external training.</p><p><b>中文翻译：</b>学习预算涵盖内部和外部培训。</p><p><b>高频短语：</b>allocate a learning budget · 分配员工学习发展预算</p></details><details><summary>External training provider — 外部培训服务商</summary><p><b>核心释义：</b>向企业提供课程、讲师或学习项目的外部专业机构。</p><p><b>职场英文例句：</b>We selected an external training provider for the leadership program.</p><p><b>中文翻译：</b>我们为领导力项目选择了一家外部培训机构。</p><p><b>高频短语：</b>select an external training provider · 遴选外部培训供应商</p></details><details><summary>Course completion certificate — 培训结业证书</summary><p><b>核心释义：</b>员工完成约定课程或培训要求后取得的证明文件。</p><p><b>职场英文例句：</b>Please upload your course completion certificate for reimbursement.</p><p><b>中文翻译：</b>请上传课程结业证明，以便申请报销。</p><p><b>高频短语：</b>submit a course completion certificate · 提交培训结业证书</p></details><details><summary>Education benefit eligibility — 教育福利资格要求</summary><p><b>核心释义：</b>员工获得学费报销或教育资助等学习福利须满足的条件。</p><p><b>职场英文例句：</b>Education benefit eligibility depends on tenure and course approval.</p><p><b>中文翻译：</b>教育福利领取资格取决于在职年限和课程审批情况。</p><p><b>高频短语：</b>check education benefit eligibility · 核查教育福利资格要求</p></details></details><details class="fallback-module"><summary><b>组织与人才发展（OD/TD）</b> · 53条</summary><details><summary>Organization development (OD) — 组织发展</summary><p><b>核心释义：</b>通过结构、流程与文化改善组织效能。</p><p><b>职场英文例句：</b>Organization development focuses on long-term organizational effectiveness.</p><p><b>中文翻译：</b>组织发展着眼于提高组织的长期效能。</p><p><b>高频短语：</b>OD initiative · 组织发展举措</p></details><details><summary>Talent development (TD) — 人才发展</summary><p><b>核心释义：</b>系统提升组织所需的关键人才能力。</p><p><b>职场英文例句：</b>Talent development supports our future leadership needs.</p><p><b>中文翻译：</b>人才发展为我们未来的领导人才需求提供支持。</p><p><b>高频短语：</b>TD strategy · 人才发展策略</p></details><details><summary>Organization design — 组织设计</summary><p><b>核心释义：</b>明确组织结构、职责及协作机制。</p><p><b>职场英文例句：</b>The organization design should reflect our new business priorities.</p><p><b>中文翻译：</b>组织设计应体现新的业务优先事项。</p><p><b>高频短语：</b>review organization design · 审阅组织设计</p></details><details><summary>Operating model — 组织运营模式／组织运作模式</summary><p><b>核心释义：</b>描述组织如何配置职能、职责、决策权责和流程以实现业务目标。</p><p><b>职场英文例句：</b>The operating model defines decisions across central and local teams.</p><p><b>中文翻译：</b>运营模式界定总部与本地团队之间的决策职责。</p><p><b>高频短语：</b>target operating model · 目标组织运营模式</p></details><details><summary>Org chart — 组织架构图</summary><p><b>核心释义：</b>展示岗位、团队与汇报关系的图表。</p><p><b>职场英文例句：</b>Please update the org chart after the reorganization.</p><p><b>中文翻译：</b>组织重组后，请更新组织架构图。</p><p><b>高频短语：</b>update the org chart · 更新组织架构图</p></details><details><summary>Span of control — 管理幅度</summary><p><b>核心释义：</b>一位经理直接管理的下属数量。</p><p><b>职场英文例句：</b>A wide span of control may affect coaching capacity.</p><p><b>中文翻译：</b>管理幅度过大可能影响管理者的辅导能力。</p><p><b>高频短语：</b>review span of control · 审阅管理幅度</p></details><details><summary>Reporting line — 汇报关系</summary><p><b>核心释义：</b>规定员工向谁汇报工作。</p><p><b>职场英文例句：</b>The new reporting line becomes effective next month.</p><p><b>中文翻译：</b>新的汇报关系将于下个月生效。</p><p><b>高频短语：</b>change a reporting line · 调整汇报关系</p></details><details><summary>Role clarity — 职责清晰度</summary><p><b>核心释义：</b>员工对自身职责与决策边界的理解。</p><p><b>职场英文例句：</b>Role clarity is essential during a team merger.</p><p><b>中文翻译：</b>在团队合并期间，明确岗位职责至关重要。</p><p><b>高频短语：</b>improve role clarity · 改善职责清晰度</p></details><details><summary>Job architecture — 岗位架构</summary><p><b>核心释义：</b>统一岗位序列、层级和分类的体系。</p><p><b>职场英文例句：</b>Job architecture helps standardize titles and career paths.</p><p><b>中文翻译：</b>岗位体系有助于统一职位名称和职业发展路径。</p><p><b>高频短语：</b>build job architecture · 建立岗位架构</p></details><details><summary>Job family — 职族／岗位族群</summary><p><b>核心释义：</b>按岗位专业技能或工作职能归类的一组岗位，用于岗位体系与职级管理。</p><p><b>职场英文例句：</b>Software engineering belongs to the technology job family.</p><p><b>中文翻译：</b>软件工程属于技术类岗位族群。</p><p><b>高频短语：</b>map job families · 绘制职族分类图</p></details><details><summary>Job leveling — 岗位定级</summary><p><b>核心释义：</b>依据职责复杂度和影响范围确定岗位层级。</p><p><b>职场英文例句：</b>We are reviewing job leveling across business units.</p><p><b>中文翻译：</b>我们正在审查各业务部门的岗位层级划分。</p><p><b>高频短语：</b>job leveling framework · 岗位定级框架</p></details><details><summary>Talent review — 人才盘点</summary><p><b>核心释义：</b>系统讨论员工能力、潜力与发展机会。</p><p><b>职场英文例句：</b>The talent review will identify future leadership candidates.</p><p><b>中文翻译：</b>人才盘点将识别未来的领导人才候选人。</p><p><b>高频短语：</b>conduct a talent review · 开展人才盘点</p></details><details><summary>Nine-box grid — 九宫格</summary><p><b>核心释义：</b>用绩效与潜力两个维度讨论人才。</p><p><b>职场英文例句：</b>The nine-box grid is a discussion tool, not a final label.</p><p><b>中文翻译：</b>九宫格是讨论人才情况的工具，而不是最终标签。</p><p><b>高频短语：</b>use a nine-box grid · 使用九宫格</p></details><details><summary>Talent calibration — 人才校准</summary><p><b>核心释义：</b>跨团队统一人才评价口径。</p><p><b>职场英文例句：</b>Talent calibration improves consistency across departments.</p><p><b>中文翻译：</b>人才校准有助于提高各部门评估标准的一致性。</p><p><b>高频短语：</b>hold talent calibration · 召开人才校准</p></details><details><summary>Succession planning — 继任规划</summary><p><b>核心释义：</b>为关键岗位提前培养备选人才。</p><p><b>职场英文例句：</b>Succession planning reduces leadership continuity risk.</p><p><b>中文翻译：</b>继任规划可以降低领导岗位的接续风险。</p><p><b>高频短语：</b>succession planning process · 继任规划流程</p></details><details><summary>Critical role — 关键岗位</summary><p><b>核心释义：</b>对业务连续性或战略目标影响大的岗位。</p><p><b>职场英文例句：</b>We identified the critical roles for the next planning cycle.</p><p><b>中文翻译：</b>我们明确了下一轮规划周期中的关键岗位。</p><p><b>高频短语：</b>identify critical roles · 识别关键岗位</p></details><details><summary>Key position — 核心职位</summary><p><b>核心释义：</b>组织中具有关键职责或稀缺性的职位。</p><p><b>职场英文例句：</b>Each key position needs a clear development pipeline.</p><p><b>中文翻译：</b>每个关键岗位都需要明确的后备人才培养梯队。</p><p><b>高频短语：</b>map key positions · 绘制核心职位</p></details><details><summary>High-potential employee (HiPo) — 高潜人才</summary><p><b>核心释义：</b>被评估为有潜力承担更高复杂度职责的人才。</p><p><b>职场英文例句：</b>The high-potential employee is ready for broader exposure.</p><p><b>中文翻译：</b>这位高潜员工已准备好接受更广泛的历练。</p><p><b>高频短语：</b>HiPo development · 高潜人才发展</p></details><details><summary>Leadership pipeline — 领导梯队</summary><p><b>核心释义：</b>持续培养各层级未来管理人才的体系。</p><p><b>职场英文例句：</b>Our leadership pipeline needs more mid-level managers.</p><p><b>中文翻译：</b>我们的领导人才梯队需要更多中层管理者。</p><p><b>高频短语：</b>strengthen the leadership pipeline · 加强领导梯队</p></details><details><summary>Bench strength — 后备人才储备度</summary><p><b>核心释义：</b>关键岗位拥有合格继任者的程度。</p><p><b>职场英文例句：</b>Bench strength improved after targeted development programs.</p><p><b>中文翻译：</b>实施有针对性的发展项目后，后备人才储备得到加强。</p><p><b>高频短语：</b>build bench strength · 建立后备人才储备度</p></details><details><summary>Talent mobility — 人才流动</summary><p><b>核心释义：</b>员工在角色、团队或地区之间的发展流转。</p><p><b>职场英文例句：</b>Talent mobility helps us fill roles with internal skills.</p><p><b>中文翻译：</b>人才流动帮助我们利用内部技能填补岗位空缺。</p><p><b>高频短语：</b>enable talent mobility · 促进人才流动</p></details><details><summary>Internal mobility — 内部流动</summary><p><b>核心释义：</b>员工在同一组织内转岗或晋升。</p><p><b>职场英文例句：</b>Internal mobility is encouraged through open internal postings.</p><p><b>中文翻译：</b>公司通过内部公开招聘鼓励内部流动。</p><p><b>高频短语：</b>support internal mobility · 支持内部流动</p></details><details><summary>Job rotation — 岗位轮换</summary><p><b>核心释义：</b>员工阶段性参与不同岗位以积累经验。</p><p><b>职场英文例句：</b>Job rotation gives future leaders a wider perspective.</p><p><b>中文翻译：</b>岗位轮换让未来的领导者获得更广阔的视野。</p><p><b>高频短语：</b>job rotation program · 岗位轮换项目</p></details><details><summary>Workforce segmentation — 人才队伍分层</summary><p><b>核心释义：</b>按业务关键性或技能等维度区分群体。</p><p><b>职场英文例句：</b>Workforce segmentation helps prioritize development investment.</p><p><b>中文翻译：</b>劳动力分层有助于确定人才发展投入的优先次序。</p><p><b>高频短语：</b>segment the workforce · 对员工队伍进行分层分类</p></details><details><summary>Change management — 变革管理</summary><p><b>核心释义：</b>有计划地推动组织变化并支持人员适应。</p><p><b>职场英文例句：</b>Change management must begin before the system launch.</p><p><b>中文翻译：</b>变革管理必须在系统上线前就启动。</p><p><b>高频短语：</b>change management plan · 变革管理计划</p></details><details><summary>Change readiness — 变革准备度</summary><p><b>核心释义：</b>组织或员工对变化的认知和准备程度。</p><p><b>职场英文例句：</b>We will assess change readiness before restructuring.</p><p><b>中文翻译：</b>在组织重组前，我们将评估变革准备度。</p><p><b>高频短语：</b>assess change readiness · 评估变革准备度</p></details><details><summary>Stakeholder mapping — 利益相关方分析</summary><p><b>核心释义：</b>梳理变革中受影响和能施加影响的人。</p><p><b>职场英文例句：</b>Stakeholder mapping helps us plan targeted communication.</p><p><b>中文翻译：</b>利益相关方梳理有助于我们制定有针对性的沟通计划。</p><p><b>高频短语：</b>stakeholder mapping exercise · 开展利益相关方分析</p></details><details><summary>Organizational effectiveness — 组织效能</summary><p><b>核心释义：</b>组织实现目标时的整体运作效果。</p><p><b>职场英文例句：</b>We track organizational effectiveness using several indicators.</p><p><b>中文翻译：</b>我们通过多项指标跟踪组织效能。</p><p><b>高频短语：</b>improve organizational effectiveness · 改善组织效能</p></details><details><summary>Strategic workforce planning — 战略人力规划</summary><p><b>核心释义：</b>根据长期战略预测人才数量和技能需求。</p><p><b>职场英文例句：</b>Strategic workforce planning links hiring to business growth.</p><p><b>中文翻译：</b>战略性人力规划将招聘与业务增长联系起来。</p><p><b>高频短语：</b>strategic workforce planning process · 战略人力规划流程</p></details><details><summary>Talent strategy — 人才战略</summary><p><b>核心释义：</b>围绕吸引、培养、保留人才的整体方向。</p><p><b>职场英文例句：</b>Our talent strategy focuses on critical capabilities.</p><p><b>中文翻译：</b>我们的人才战略聚焦于关键能力。</p><p><b>高频短语：</b>align the talent strategy · 对齐人才战略</p></details><details><summary>Organizational restructuring — 组织重组</summary><p><b>核心释义：</b>调整组织架构、岗位或汇报关系。</p><p><b>职场英文例句：</b>The organizational restructuring will combine two regional teams.</p><p><b>中文翻译：</b>此次组织架构调整将合并两个区域团队。</p><p><b>高频短语：</b>organizational restructuring plan · 组织重组计划</p></details><details><summary>Role mapping — 岗位映射</summary><p><b>核心释义：</b>将当前岗位对应到目标组织结构中的角色。</p><p><b>职场英文例句：</b>Role mapping must be completed before the new structure goes live.</p><p><b>中文翻译：</b>新组织架构生效前必须完成岗位映射。</p><p><b>高频短语：</b>role mapping exercise · 开展岗位映射</p></details><details><summary>Talent segmentation — 人才分层分类</summary><p><b>核心释义：</b>依据战略价值或发展需要划分人才群体。</p><p><b>职场英文例句：</b>Talent segmentation helps tailor development investment.</p><p><b>中文翻译：</b>人才分层有助于制定差异化的发展投入方案。</p><p><b>高频短语：</b>talent segmentation criteria · 人才分层分类标准</p></details><details><summary>Successor readiness — 继任者准备度</summary><p><b>核心释义：</b>衡量候选人承担目标岗位的成熟程度。</p><p><b>职场英文例句：</b>Successor readiness is reviewed annually for critical positions.</p><p><b>中文翻译：</b>我们每年评估关键岗位继任人选的准备情况。</p><p><b>高频短语：</b>ready-now successor · 可立即接任的继任候选人</p></details><details><summary>Leadership bench — 领导人才储备</summary><p><b>核心释义：</b>可在未来承担关键领导岗位的人才群体。</p><p><b>职场英文例句：</b>We need to strengthen the leadership bench in Asia.</p><p><b>中文翻译：</b>我们需要加强亚洲区域的领导人才储备。</p><p><b>高频短语：</b>build a leadership bench · 建立领导人才储备</p></details><details><summary>Critical talent — 关键人才</summary><p><b>核心释义：</b>对战略能力或重要业务连续性影响较大的员工。</p><p><b>职场英文例句：</b>Critical talent retention is part of the annual talent plan.</p><p><b>中文翻译：</b>关键人才保留是年度人才计划的一部分。</p><p><b>高频短语：</b>critical talent retention · 关键人才保留</p></details><details><summary>Change impact assessment — 变革影响评估</summary><p><b>核心释义：</b>识别组织变化对人员、岗位及流程的影响。</p><p><b>职场英文例句：</b>The change impact assessment identified new training needs.</p><p><b>中文翻译：</b>变革影响评估发现了新的培训需求。</p><p><b>高频短语：</b>conduct a change impact assessment · 开展变革影响评估</p></details><details><summary>Organization health — 组织健康度</summary><p><b>核心释义：</b>衡量组织有效性、协作与持续运作能力的状态。</p><p><b>职场英文例句：</b>Our organization health review covers leadership and ways of working.</p><p><b>中文翻译：</b>组织健康度评审涵盖领导力和工作方式。</p><p><b>高频短语：</b>organization health survey · 组织健康度调查</p></details><details><summary>Decision rights — 决策权责</summary><p><b>核心释义：</b>明确谁有权作出不同类别的业务决定。</p><p><b>职场英文例句：</b>Clear decision rights prevent delays between functions.</p><p><b>中文翻译：</b>明确决策权限可以避免不同职能部门之间的延误。</p><p><b>高频短语：</b>clarify decision rights · 明确决策权责</p></details><details><summary>RACI matrix — RACI职责矩阵</summary><p><b>核心释义：</b>区分负责执行、最终负责、需咨询和需知会角色。</p><p><b>职场英文例句：</b>The RACI matrix clarifies ownership across the project.</p><p><b>中文翻译：</b>RACI责任矩阵明确了项目中各方的职责。</p><p><b>高频短语：</b>build a RACI matrix · 建立RACI职责矩阵</p></details><details><summary>Organization structure — 组织结构／组织架构</summary><p><b>核心释义：</b>组织部门、汇报关系、管理层级及岗位分工的总体安排。</p><p><b>职场英文例句：</b>The new organization structure clarifies reporting relationships.</p><p><b>中文翻译：</b>新的组织结构明确了汇报关系。</p><p><b>高频短语：</b>review the organization structure · 审阅组织结构</p></details><details><summary>Position management — 岗位编制与职位管理</summary><p><b>核心释义：</b>对岗位设立、调整、预算、编制和撤销等进行全周期管理。</p><p><b>职场英文例句：</b>Position management ensures hiring stays within approved headcount.</p><p><b>中文翻译：</b>岗位管理确保招聘不超出获批的人员编制。</p><p><b>高频短语：</b>strengthen position management · 加强岗位编制与职位管理</p></details><details><summary>Organizational hierarchy — 组织层级结构</summary><p><b>核心释义：</b>组织内部从高到低的管理层级和汇报链条。</p><p><b>职场英文例句：</b>The organizational hierarchy will be simplified next quarter.</p><p><b>中文翻译：</b>下季度将简化组织层级。</p><p><b>高频短语：</b>simplify organizational hierarchy · 精简组织层级结构</p></details><details><summary>Succession candidate — 继任候选人</summary><p><b>核心释义：</b>被识别为未来可能承担特定关键岗位的内部或外部候选人才。</p><p><b>职场英文例句：</b>We identified two succession candidates for the finance director role.</p><p><b>中文翻译：</b>我们为财务总监岗位确定了两位继任候选人。</p><p><b>高频短语：</b>identify a succession candidate · 识别继任候选人</p></details><details><summary>Career pathing — 职业发展路径规划</summary><p><b>核心释义：</b>为员工规划岗位晋升、横向流动和能力成长路径的过程。</p><p><b>职场英文例句：</b>Career pathing helps employees understand growth opportunities.</p><p><b>中文翻译：</b>职业发展路径规划帮助员工了解成长机会。</p><p><b>高频短语：</b>build a career pathing framework · 建立职业发展路径规划</p></details><details><summary>Promotion criteria — 晋升标准／晋升评审条件</summary><p><b>核心释义：</b>用于判断员工是否满足晋升职级要求的业绩、能力与行为标准。</p><p><b>职场英文例句：</b>The promotion criteria should be transparent to employees.</p><p><b>中文翻译：</b>晋升标准应向员工保持透明。</p><p><b>高频短语：</b>define promotion criteria · 制定晋升标准</p></details><details><summary>Talent pipeline — 人才梯队／人才储备管道</summary><p><b>核心释义：</b>按未来岗位需求持续培养和储备潜在人才的体系。</p><p><b>职场英文例句：</b>We need a stronger leadership talent pipeline.</p><p><b>中文翻译：</b>我们需要加强领导人才梯队储备。</p><p><b>高频短语：</b>build a talent pipeline · 建立人才梯队</p></details><details><summary>Lateral move — 横向岗位调动／平级转岗</summary><p><b>核心释义：</b>员工在相近职级之间转换岗位或职能领域的内部流动。</p><p><b>职场英文例句：</b>A lateral move can broaden an employee&#x27;s experience.</p><p><b>中文翻译：</b>平级调动可以拓宽员工的工作经历。</p><p><b>高频短语：</b>support a lateral move · 支持横向岗位调动</p></details><details><summary>Workforce capacity planning — 人员产能与人力配置规划</summary><p><b>核心释义：</b>将业务需求与可用人力数量、技能及工作负荷进行匹配的规划。</p><p><b>职场英文例句：</b>Workforce capacity planning shows a staffing gap in operations.</p><p><b>中文翻译：</b>人力资源配置能力规划显示，运营部门存在人员缺口。</p><p><b>高频短语：</b>perform workforce capacity planning · 开展人力产能规划</p></details><details><summary>Talent retention plan — 关键人才保留计划</summary><p><b>核心释义：</b>围绕高潜或关键员工制定薪酬、职业发展和管理措施的留才方案。</p><p><b>职场英文例句：</b>The talent retention plan targets hard-to-replace skills.</p><p><b>中文翻译：</b>人才保留计划重点关注难以替代的关键技能。</p><p><b>高频短语：</b>develop a talent retention plan · 制定关键人才保留计划</p></details><details><summary>Succession bench — 关键岗位继任人才储备</summary><p><b>核心释义：</b>能够在不同准备度阶段接替关键岗位的潜在继任者群体。</p><p><b>职场英文例句：</b>Our succession bench for regional leadership is still limited.</p><p><b>中文翻译：</b>我们在区域领导岗位方面的继任人才储备仍然有限。</p><p><b>高频短语：</b>strengthen the succession bench · 加强关键岗位继任人才储备</p></details><details><summary>Organizational capability — 组织能力</summary><p><b>核心释义：</b>组织通过人才、流程和机制持续实现战略目标的整体能力。</p><p><b>职场英文例句：</b>The transformation requires new organizational capabilities.</p><p><b>中文翻译：</b>这次转型需要组织建立新的能力。</p><p><b>高频短语：</b>build organizational capability · 建立组织能力</p></details><details><summary>Job grading — 岗位价值评价与等级划分</summary><p><b>核心释义：</b>依据岗位职责、影响范围等标准对岗位确定相对等级。</p><p><b>职场英文例句：</b>Job grading helps maintain consistent role levels.</p><p><b>中文翻译：</b>岗位职级评定有助于维持岗位层级的一致性。</p><p><b>高频短语：</b>conduct job grading · 开展岗位价值评价与等级划分</p></details></details><details class="fallback-module"><summary><b>员工关系与劳动合规</b> · 56条</summary><details><summary>Employee relations — 员工关系管理</summary><p><b>核心释义：</b>人力资源领域对员工沟通、争议处理、劳动纪律及雇佣关系的管理。</p><p><b>职场英文例句：</b>Employee relations supports fair and consistent workplace practices.</p><p><b>中文翻译：</b>员工关系管理有助于确保职场管理公平且一致。</p><p><b>高频短语：</b>employee relations case · 员工关系个案</p></details><details><summary>Employee handbook — 员工手册</summary><p><b>核心释义：</b>汇总工作场所政策与员工须知的文件。</p><p><b>职场英文例句：</b>The employee handbook explains core workplace policies.</p><p><b>中文翻译：</b>员工手册说明了核心职场规章制度。</p><p><b>高频短语：</b>update the employee handbook · 更新员工手册</p></details><details><summary>Code of conduct — 行为准则</summary><p><b>核心释义：</b>规定组织期望的职业行为及底线。</p><p><b>职场英文例句：</b>All employees must review the code of conduct annually.</p><p><b>中文翻译：</b>所有员工每年都必须学习行为准则。</p><p><b>高频短语：</b>follow the code of conduct · 跟进行为准则</p></details><details><summary>Grievance procedure — 申诉程序</summary><p><b>核心释义：</b>员工正式提出不满或争议的处理机制。</p><p><b>职场英文例句：</b>The grievance procedure describes how to raise concerns.</p><p><b>中文翻译：</b>申诉程序说明员工应如何提出问题或投诉。</p><p><b>高频短语：</b>follow the grievance procedure · 跟进申诉程序</p></details><details><summary>Disciplinary action — 纪律处分</summary><p><b>核心释义：</b>对违反规则的行为采取的正式管理措施。</p><p><b>职场英文例句：</b>Any disciplinary action must follow a fair process.</p><p><b>中文翻译：</b>任何纪律处分都必须遵循公平的程序。</p><p><b>高频短语：</b>consider disciplinary action · 考虑采取纪律处分</p></details><details><summary>Verbal warning — 口头警告</summary><p><b>核心释义：</b>针对违规行为的正式或非正式口头提醒。</p><p><b>职场英文例句：</b>The manager issued a verbal warning after reviewing the facts.</p><p><b>中文翻译：</b>经理核实事实后，对员工作出了口头警告。</p><p><b>高频短语：</b>give a verbal warning · 给予口头警告</p></details><details><summary>Written warning — 书面警告</summary><p><b>核心释义：</b>以书面形式记录的纪律提醒。</p><p><b>职场英文例句：</b>A written warning should clearly state the expected improvement.</p><p><b>中文翻译：</b>书面警告应清楚说明期望的改进要求。</p><p><b>高频短语：</b>issue a written warning · 发出书面警告</p></details><details><summary>Investigation — 调查</summary><p><b>核心释义：</b>对投诉或事件收集事实与证据的过程。</p><p><b>职场英文例句：</b>The investigation should be impartial and documented.</p><p><b>中文翻译：</b>调查应保持公正，并留下书面记录。</p><p><b>高频短语：</b>conduct an investigation · 开展调查</p></details><details><summary>Confidentiality — 保密</summary><p><b>核心释义：</b>按需要知悉原则保护敏感信息。</p><p><b>职场英文例句：</b>Confidentiality is important during employee investigations.</p><p><b>中文翻译：</b>在员工调查期间，保密非常重要。</p><p><b>高频短语：</b>maintain confidentiality · 保持保密</p></details><details><summary>Conflict resolution — 冲突解决</summary><p><b>核心释义：</b>通过沟通和方法处理工作争议。</p><p><b>职场英文例句：</b>Conflict resolution training is available for team leaders.</p><p><b>中文翻译：</b>团队负责人可以参加冲突解决培训。</p><p><b>高频短语：</b>support conflict resolution · 支持冲突解决</p></details><details><summary>Mediation — 调解</summary><p><b>核心释义：</b>由中立第三方协助争议双方沟通。</p><p><b>职场英文例句：</b>Mediation may help resolve this workplace disagreement.</p><p><b>中文翻译：</b>调解可能有助于解决这起职场争议。</p><p><b>高频短语：</b>offer mediation · 提供调解</p></details><details><summary>Workplace harassment — 职场骚扰</summary><p><b>核心释义：</b>不受欢迎并造成伤害或恶劣环境的行为。</p><p><b>职场英文例句：</b>Employees can report workplace harassment through designated channels.</p><p><b>中文翻译：</b>员工可以通过指定渠道举报职场骚扰。</p><p><b>高频短语：</b>prevent workplace harassment · 预防职场骚扰</p></details><details><summary>Discrimination — 歧视</summary><p><b>核心释义：</b>基于受保护特征的不公平对待。</p><p><b>职场英文例句：</b>Our policy prohibits discrimination in hiring and employment.</p><p><b>中文翻译：</b>我们的政策禁止
