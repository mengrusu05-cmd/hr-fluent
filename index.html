<details><summary><span lang="en">Talent differentiation</span> — 人才差异化管理</summary><p>依据一致的标准，考虑员工的贡献、发展潜力或需要，对培养、岗位安排等人才举措采用差异化配置。</p><p lang="en">Talent differentiation should be based on consistent assessment criteria.</p><p>人才差异化管理应基于一致的评估标准。</p></details>
<details><summary><span lang="en">Potential assessment</span> — 潜力评估</summary><p>评估个人未来承担更复杂、范围更大或不同类型职责的成长潜力。</p><p lang="en">A potential assessment considers capacity for future responsibilities.</p><p>潜力评估考虑承担未来职责的能力。</p></details>
<details><summary><span lang="en">Readiness assessment</span> — 任职就绪度评估</summary><p>围绕特定岗位或职责及相关时间范围，评估候选人是否已具备任职所需能力与经验。</p><p lang="en">The readiness assessment identifies gaps before promotion.</p><p>任职就绪度评估识别晋升前的能力差距。</p></details>
<details><summary><span lang="en">Career aspiration</span> — 职业发展意愿</summary><p>个人希望在未来从事的职业方向、承担的职责或实现的职业目标，常用复数 career aspirations。</p><p lang="en">Managers should discuss career aspirations during development conversations.</p><p>管理者应在发展面谈中讨论员工的职业发展意愿。</p></details>
<details><summary><span lang="en">Developmental assignment</span> — 发展性任务</summary><p>以积累特定经验或培养明确能力为目的而安排的一项实际工作。</p><p lang="en">To build negotiation skills, Maya took on a developmental assignment in procurement.</p><p>为了锻炼谈判能力，玛雅承担了一项采购方面的发展性任务。</p></details>
</section>
<section><h2>员工关系与劳动合规</h2>
<details><summary><span lang="en">Employee relations</span> — 员工关系管理</summary><p>人力资源领域对员工沟通、争议处理、劳动纪律及雇佣关系的管理。</p><p lang="en">Employee relations supports fair and consistent workplace practices.</p><p>员工关系管理有助于在工作场所采用公平、一致的管理做法。</p></details>
<details><summary><span lang="en">Employee handbook</span> — 员工手册</summary><p>汇总工作场所政策与员工须知的文件。</p><p lang="en">The employee handbook explains core workplace policies.</p><p>员工手册说明了工作场所的主要规章制度。</p></details>
<details><summary><span lang="en">Code of conduct</span> — 行为准则</summary><p>说明组织对员工或适用人员的行为要求，常涉及利益冲突、工作场所行为和职业诚信。</p><p lang="en">At our company, employees review the code of conduct once a year.</p><p>在我们公司，员工每年复习一次行为准则。</p></details>
<details><summary><span lang="en">Grievance procedure</span> — 员工申诉程序</summary><p>员工正式提出工作相关申诉，及组织受理、处理和复核该申诉的程序。具体步骤依机构政策及适用规则而定。</p><p lang="en">The grievance procedure describes how to raise concerns.</p><p>员工申诉程序说明了员工如何正式反映问题。</p></details>
<details><summary><span lang="en">Disciplinary action</span> — 纪律处分</summary><p>组织依适用程序对认定的违规等事项采取的纪律措施。可采取哪些措施取决于政策和适用规则。</p><p lang="en">Under our policy, managers must give employees a chance to respond before taking disciplinary action.</p><p>根据公司政策，管理者在采取纪律处分前须给员工陈述意见的机会。</p></details>
<details><summary><span lang="en">Verbal warning</span> — 口头警告</summary><p>以口头方式向员工发出的纪律警告。是否属于正式措施、是否须留存记录，依机构政策及适用程序而定。</p><p lang="en">The manager issued a verbal warning after reviewing the facts.</p><p>经理核查事实后，向该员工发出了口头警告。</p></details>
<details><summary><span lang="en">Written warning</span> — 书面警告</summary><p>以书面形式发给员工的纪律警告，通常载明问题、应达到的要求及后续安排。</p><p lang="en">HR kept a copy of the written warning in the case file.</p><p>人力资源部门在个案档案中留存了一份书面警告副本。</p></details>
<details><summary><span lang="en">Investigation</span> — 调查</summary><p>为核实投诉、涉嫌违规或其他事件而收集和分析证据的过程。</p><p lang="en">The investigation should be impartial and documented.</p><p>调查应保持公正，并留下书面记录。</p></details>
<details><summary><span lang="en">Confidentiality</span> — 保密</summary><p>保护敏感信息，并按适用规则将信息披露限制在必要范围内。</p><p lang="en">Confidentiality is important during workplace investigations.</p><p>在工作场所调查中，保密很重要。</p></details>
<details><summary><span lang="en">Conflict resolution</span> — 冲突解决</summary><p>运用沟通、协商、调解等方式处理工作中的分歧，寻求可执行的解决办法。</p><p lang="en">Conflict resolution training is available for team leaders.</p><p>团队负责人可以参加冲突解决培训。</p></details>
<details><summary><span lang="en">Mediation</span> — 调解</summary><p>由中立第三方协助争议各方沟通，帮助他们自行寻求双方可接受的解决方案。</p><p lang="en">Mediation may help resolve this workplace disagreement.</p><p>调解可能有助于解决这起职场争议。</p></details>
<details><summary><span lang="en">Workplace harassment</span> — 职场骚扰</summary><p>工作相关情境中不受欢迎、可能侵犯尊严或造成威胁、羞辱或冒犯性环境的行为。具体涵盖范围依机构政策和适用法律而定。</p><p lang="en">Under our policy, employees can report workplace harassment through designated channels.</p><p>根据公司政策，员工可以通过指定渠道报告职场骚扰。</p></details>
<details><summary><span lang="en">Discrimination</span> — 歧视</summary><p>在招聘、任职或其他工作事项中，因受保护等相关特征受到不利对待，或在部分司法辖区因表面中立的规则受到不利影响。认定标准依适用法律和政策而异。</p><p lang="en">Our policy prohibits discrimination in hiring and employment.</p><p>我们的政策禁止招聘和雇佣过程中的歧视。</p></details>
<details><summary><span lang="en">Retaliation</span> — 打击报复</summary><p>因某人举报、参与调查或行使受保护的权利等而给予不利对待。受保护活动及认定标准依适用法律和机构政策而异。</p><p lang="en">Our policy prohibits retaliation against anyone who raises a concern in good faith.</p><p>公司政策禁止对善意反映问题的人进行打击报复。</p></details>
<details><summary><span lang="en">Whistleblower policy</span> — 举报人保护政策</summary><p>说明涉嫌违规事项的举报渠道、处理方式及举报人保护措施的机构政策。保护范围依政策和适用法律而定。</p><p lang="en">The whistleblower policy provides confidential reporting options.</p><p>举报人保护政策规定了可保密处理身份信息的举报方式。</p></details>
<details><summary><span lang="en">Policy violation</span> — 违反内部政策</summary><p>违反适用的机构内部规则或政策的行为。</p><p lang="en">We need to verify the facts before confirming a policy violation.</p><p>认定行为违反内部政策之前，我们需要先核实事实。</p></details>
<details><summary><span lang="en">Disciplinary hearing</span> — 纪律听证会</summary><p>在机构纪律程序中审议相关事项并听取员工陈述的正式会议，具体安排依政策及适用规则而定。</p><p lang="en">A disciplinary hearing may be required under local rules.</p><p>根据当地规定，可能需要举行纪律听证会。</p></details>
<details><summary><span lang="en">Collective bargaining</span> — 集体谈判</summary><p>雇主一方与工会或有代表资格的员工代表，就薪资、工时及其他劳动条件进行谈判的过程。</p><p lang="en">The employer and union began collective bargaining over next year’s pay and working hours.</p><p>雇主和工会开始就明年的薪酬与工时开展集体谈判。</p></details>
<details><summary><span lang="en">Labor union</span> — 工会</summary><p>代表会员或依法代表相关员工的组织，可参与集体谈判、员工申诉及劳动条件协商。具体代表范围依当地规则而定。</p><p lang="en">HR met with the labor union representatives to discuss changes.</p><p>人力资源团队与工会代表会面讨论相关变更。</p></details>
<details><summary><span lang="en">Employment contract</span> — 劳动合同</summary><p>明确雇佣双方主要权利和义务的协议，可涉及岗位、薪酬、工时和通知期。用语及制度含义依适用法律而异。</p><p lang="en">We ask local counsel to review the employment contract template before we use it in a new jurisdiction.</p><p>在新的司法辖区使用劳动合同模板前，我们会请当地法律顾问审查。</p></details>
<details><summary><span lang="en">Fixed-term contract</span> — 固定期限劳动合同</summary><p>以约定日期、项目完成或其他明确终止条件界定期限的劳动合同，具体规则依适用法律。</p><p lang="en">The fixed-term contract expires at the end of December.</p><p>该固定期限劳动合同将在十二月底到期。</p></details>
<details><summary><span lang="en">Non-compete clause</span> — 竞业限制条款</summary><p>约定在特定期间、地域或业务范围内限制竞争活动的条款，效力与适用条件因司法辖区而异。</p><p lang="en">Legal counsel will review the non-compete clause for enforceability.</p><p>法律顾问将审查竞业限制条款是否具有可执行性。</p></details>
<details><summary><span lang="en">Severance pay</span> — 遣散费／离职经济补偿</summary><p>在裁员或其他符合条件的雇佣终止情形中向离职员工支付的补偿；资格和金额取决于法律、合同或政策。</p><p lang="en">Severance pay is determined by the applicable rules and agreement.</p><p>离职补偿金按照适用规定和双方协议确定。</p></details>
<details><summary><span lang="en">Termination for cause</span> — 因故解除</summary><p>雇主依据适用法律、合同或政策认可的特定事由终止雇佣关系。</p><p lang="en">Termination for cause requires careful legal and factual review.</p><p>因故解雇需要谨慎进行法律及事实审查。</p></details>
<details><summary><span lang="en">Redundancy</span> — 岗位冗余／因岗位冗余裁撤</summary><p>在英国等用法中，指因业务关闭、工作地点关闭或对某类工作的人力需求减少等原因导致员工岗位冗余并可能被裁撤。</p><p lang="en">We must review local obligations before implementing redundancy measures.</p><p>实施裁员措施前，我们必须审查当地的法定义务。</p></details>
<details><summary><span lang="en">Layoff</span> — 裁员／裁撤人员</summary><p>因业务或运营原因减少用工，具体可指永久裁员或暂时停止提供工作，须结合地区和上下文理解。</p><p lang="en">The company announced a layoff alongside a support program.</p><p>公司宣布裁员，同时推出员工支持计划。</p></details>
<details><summary><span lang="en">Exit interview</span> — 离职访谈</summary><p>在员工离职前后开展的访谈，用于了解离职原因和可改进之处。</p><p lang="en">The exit interview revealed recurring concerns about career paths.</p><p>离职面谈反映出员工对职业发展路径的反复担忧。</p></details>
<details><summary><span lang="en">Employee assistance program (EAP)</span> — 员工援助计划</summary><p>雇主提供或委托服务方提供的员工支持项目，可涵盖心理咨询和转介等服务，覆盖范围由方案确定。</p><p lang="en">Our EAP offers short-term counseling and referrals to other services.</p><p>我们的员工援助计划提供短期咨询，并可转介至其他服务。</p></details>
<details><summary><span lang="en">Occupational health and safety</span> — 职业健康与安全</summary><p>在工作中识别和控制可能导致工伤或损害身心健康的风险的管理领域，常缩写为 OHS 或 OSH。</p><p lang="en">Occupational health and safety is part of our compliance training.</p><p>职业健康与安全属于我们的合规培训内容。</p></details>
<details><summary><span lang="en">Reasonable accommodation</span> — 合理便利安排</summary><p>依适用法律和具体情形，为符合条件的员工或求职者调整招聘流程、工作安排或环境，使其能够平等参与就业。</p><p lang="en">HR discussed a reasonable accommodation request with the employee.</p><p>人力资源部门与员工讨论了合理便利安排的申请。</p></details>
<details><summary><span lang="en">Employee grievance</span> — 员工申诉</summary><p>员工就工作条件、待遇或职场行为，通过组织程序正式提出的申诉。</p><p lang="en">The employee grievance was reviewed under the internal procedure.</p><p>这起员工申诉已按内部程序进行了审查。</p></details>
<details><summary><span lang="en">Due process</span> — 正当程序</summary><p>依据适用法律、合同或内部程序，在可能影响当事人权益的决定中提供公平处理，包括适当告知并给予陈述机会。</p><p lang="en">Due process is important in disciplinary matters.</p><p>在纪律处分事项中，正当程序非常重要。</p></details>
<details><summary><span lang="en">Protected characteristic</span> — 受法律保护的个人特征</summary><p>在特定司法辖区的反歧视制度下受保护的个人特征，列举范围与适用场景由当地法律规定。</p><p lang="en">Policies should address discrimination based on protected characteristics.</p><p>政策应明确禁止因受保护特征而产生的歧视。</p></details>
<details><summary><span lang="en">Conflict of interest</span> — 利益冲突</summary><p>个人关系、财务利益或其他外部利益可能妨碍其客观履行工作职责的情况。</p><p lang="en">Employees must disclose potential conflicts of interest.</p><p>员工必须申报潜在的利益冲突。</p></details>
<details><summary><span lang="en">Workplace investigation</span> — 职场调查</summary><p>对工作场所内的投诉、疑似违规或事件，以访谈和材料核查等方式查明事实的程序。</p><p lang="en">The workplace investigation should be impartial and timely.</p><p>职场调查应公正且及时。</p></details>
<details><summary><span lang="en">Collective consultation</span> — 集体协商咨询</summary><p>就可能影响一批员工的组织变动，与符合要求的员工代表交换信息并听取意见的过程；适用范围与义务依法律或协议。</p><p lang="en">Collective consultation may be required before certain redundancies.</p><p>实施某些裁员措施前，可能需要进行集体协商。</p></details>
<details><summary><span lang="en">Notice of termination</span> — 终止雇佣通知</summary><p>正式告知另一方雇佣关系将终止的通知，可载明终止日期等信息，内容和形式依适用要求。</p><p lang="en">The notice of termination must meet applicable requirements.</p><p>终止雇佣通知必须符合适用要求。</p></details>
<details><summary><span lang="en">Garden leave</span> — 离职通知期带薪免到岗（花园假）</summary><p>在英国雇佣等语境中，指员工在通知期仍受雇并依约领薪，由雇主安排在部分或全部期间暂停日常工作。</p><p lang="en">The company placed him on garden leave for the final month of his notice period.</p><p>公司安排他在离职通知期的最后一个月带薪免到岗。</p></details>
<details><summary><span lang="en">Workplace accommodation</span> — 工作场所合理便利／合理调整</summary><p>为使员工能够平等参与工作而对工作环境、设备、流程或时间所作的调整，具体资格及义务以适用制度为准。</p><p lang="en">HR discussed workplace accommodations with the employee.</p><p>人力资源部门与员工讨论了职场合理便利安排。</p></details>
<details><summary><span lang="en">Non-disclosure agreement (NDA)</span> — 保密协议</summary><p>约定一方或各方对特定信息承担保密义务的协议，可规定信息范围、例外和期限。</p><p lang="en">The employee signed a non-disclosure agreement for the project.</p><p>员工为该项目签署了保密协议。</p></details>
<details><summary><span lang="en">Contract renewal</span> — 合同续订／合同续约</summary><p>现有合同临近到期时，按合同约定或适用规则让合同关系延续至下一期的安排。可通过签订新协议或按约定的续订机制办理。</p><p lang="en">Our team starts the contract renewal process 60 days before the current term ends.</p><p>我们团队会在本期合同到期前 60 天启动续订流程。</p></details>
<details><summary><span lang="en">Employment contract renewal</span> — 劳动合同续签</summary><p>依照劳动合同及适用规则，在本期合同到期时延续雇佣约定的安排，可能涉及确认下一期的期限及条款。</p><p lang="en">For this employment contract renewal, HR will send the employee the proposed terms for review.</p><p>这次续签劳动合同，人力资源部门会把拟议条款发给员工审阅。</p></details>
<details><summary><span lang="en">Contract extension</span> — 劳动合同期限延长／合同延期</summary><p>延长既有劳动合同约定期限的安排；与重新签订续约合同的法律效果可能不同。</p><p lang="en">The parties agreed to a three-month contract extension.</p><p>双方同意将合同延长三个月。</p></details>
<details><summary><span lang="en">Contract expiration</span> — 劳动合同到期／合同期满</summary><p>合同约定期限届满。期满后是否续订或继续雇佣，取决于合同约定、实际情况和适用法律。</p><p lang="en">The system will alert HR before contract expiration.</p><p>系统将在合同到期前提醒人力资源部门。</p></details>
<details><summary><span lang="en">Renewal notice</span> — 合同续签通知</summary><p>就合同拟续签、续签选项或办理安排发出的通知。具体内容和法律效力取决于合同、当地规则和通知措辞。</p><p lang="en">HR sent the renewal notice to the employee last week.</p><p>人力资源部门上周已向该员工发出续签通知。</p></details>
<details><summary><span lang="en">Dismissal</span> — 解雇／雇主解除雇佣关系</summary><p>雇主主动结束员工雇佣关系的行为；可能因绩效、违纪或其他适用事由发生。</p><p lang="en">HR checked whether the proposed dismissal followed the procedure required for that case.</p><p>人力资源部门核查了拟议的解雇处理是否遵循该个案适用的程序。</p></details>
<details><summary><span lang="en">Wrongful dismissal</span> — 不当解雇（具体法律含义依地区）</summary><p>雇主解除雇佣关系引发的法律概念，具体请求依据因法域而异。在大不列颠的雇佣语境中，通常指雇主解雇时违反雇佣合同，例如未按约提供通知或相应付款。</p><p lang="en">The legal team reviewed the risk of wrongful dismissal.</p><p>法务团队审查了不当解雇的法律风险。</p></details>
<details><summary><span lang="en">Termination letter</span> — 雇佣关系终止通知书／解雇通知书</summary><p>书面通知员工雇佣关系将结束的文件，常列明终止日期及相关事项。名称和内容要求随情形和当地规定而异。</p><p lang="en">Our termination letter template includes a field for the effective date.</p><p>我们的雇佣关系终止通知书模板设有一栏，用来填写终止生效日期。</p></details>
<details><summary><span lang="en">Mutual separation agreement</span> — 协商解除劳动关系协议</summary><p>雇主与员工通过书面协议约定结束雇佣关系的条件。</p><p lang="en">Both parties signed a mutual separation agreement.</p><p>双方签署了协商解除劳动关系协议。</p></details>
<details><summary><span lang="en">Severance package</span> — 离职补偿方案／遣散方案</summary><p>雇佣关系结束时涉及的补偿与支持安排，可包括现金补偿、福利延续或职业过渡服务，具体视适用规定、政策和协议而定。</p><p lang="en">The proposed severance package includes a lump-sum payment and career transition support.</p><p>拟议的离职补偿方案包括一笔一次性补偿款和职业过渡支持。</p></details>
<details><summary><span lang="en">Payment in lieu of notice (PILON)</span> — 代通知金／以付款替代通知期</summary><p>在适用法律或合同允许的情况下，用付款替代全部或部分通知期的安排。PILON 常见于英式雇佣语境。</p><p lang="en">The employer offered payment in lieu of notice.</p><p>雇主提出支付代通知金。</p></details>
<details><summary><span lang="en">Non-solicitation clause</span> — 禁止招揽条款</summary><p>限制招揽特定客户、员工等对象的合同条款。在雇佣合同中常涉及离职后的行为，适用范围和可执行性依条款及当地法律而异。</p><p lang="en">The agreement includes a non-solicitation clause.</p><p>协议中包含禁止招揽条款。</p></details>
<details><summary><span lang="en">Restrictive covenant</span> — 离职后限制性约定</summary><p>在雇佣语境中，约束员工离职后某些行为的合同约定，例如竞业限制或禁止招揽。具体限制及其可执行性取决于条款与适用法律。</p><p lang="en">Legal counsel reviewed the restrictive covenant before the offer.</p><p>发出录用通知前，法律顾问审查了离职后限制性约定。</p></details>
<details><summary><span lang="en">Suspension</span> — 停职／暂停履职</summary><p>暂时停止员工履行工作职责的措施，可用于调查、风险控制或纪律处理。是否带薪及其他条件取决于当地法律、合同和公司政策。</p><p lang="en">The employee was suspended pending the outcome of the investigation.</p><p>调查结果出来前，该员工暂时停职。</p></details>
<details><summary><span lang="en">Employee misconduct</span> — 员工违纪行为／不当行为</summary><p>员工在工作相关情境中违反适用行为规范、公司政策或法律义务的行为。是否构成违纪需要根据事实及适用规则判断。</p><p lang="en">The investigation examined the alleged employee misconduct.</p><p>调查审查了有关员工涉嫌不当行为的指控。</p></details>
<details><summary><span lang="en">Exit clearance</span> — 离职手续确认／离职交接核验</summary><p>离职流程中核验资产归还、工作交接、系统权限处理等事项是否完成的环节，各组织所需的签核项目可能不同。</p><p lang="en">Our exit clearance checklist asks managers to confirm that company equipment has been returned.</p><p>我们的离职交接清单要求经理确认公司设备已归还。</p></details>
<details><summary><span lang="en">Labor law</span> — 劳动法</summary><p>规范雇佣和劳动关系的法律领域，可涉及劳动标准、工会活动和集体谈判。具体涵盖范围因司法辖区而异。</p><p lang="en">HR must comply with applicable labor law.</p><p>人力资源部门必须遵守适用的劳动法。</p></details>
<details><summary><span lang="en">Grievance handling</span> — 员工申诉处理</summary><p>受理、调查和处理员工申诉的实际工作。</p><p lang="en">We train managers in effective grievance handling.</p><p>我们向管理者提供培训，帮助他们有效处理员工申诉。</p></details>
<details><summary><span lang="en">Resignation</span> — 辞职／主动离职</summary><p>员工主动提出结束雇佣关系。</p><p lang="en">He submitted his resignation on Monday.</p><p>他周一提交了辞职通知。</p></details>
<details><summary><span lang="en">Employment termination</span> — 雇佣关系终止或解除</summary><p>雇佣关系的结束。在人事流程中可按广义使用，涵盖辞职、解雇或某些合同届满情形。具体含义以文件用语及适用法律为准。</p><p lang="en">HR records the reason and effective date for each employment termination.</p><p>人力资源部门记录每次雇佣关系终止的原因和生效日期。</p></details>
<details><summary><span lang="en">Full-time employee</span> — 全职员工</summary><p>按适用的全职工时或工作安排受雇的员工。全职标准可因机构及适用法律而异。</p><p lang="en">We plan to hire a full-time employee for this role.</p><p>我们计划为该岗位招聘一名全职员工。</p></details>
<details><summary><span lang="en">Part-time employee</span> — 兼职员工／非全职员工</summary><p>工作时间少于全职标准的员工，法律定义因地区而异。</p><p lang="en">We hired a part-time employee to cover the evening shift.</p><p>我们招聘了一名兼职员工负责晚班。</p></details>
<details><summary><span lang="en">Contractor</span> — 承包方／独立承包人员</summary><p>按合同承接并提供服务的个人或机构。个人是否属于独立承包人员等类别，须结合实际工作安排和适用法律判断。</p><p lang="en">We engaged an independent contractor to provide specialized services for the project.</p><p>我们委托了一名独立承包人员，为该项目提供专业服务。</p></details>
<details><summary><span lang="en">Non-compete agreement</span> — 竞业限制协议</summary><p>约定个人在特定时期或范围内限制竞争活动的协议，常见于离职后安排。适用对象、范围和效力依当地法律及协议条款而定。</p><p lang="en">Legal counsel will review the non-compete agreement.</p><p>法律顾问将审查竞业限制协议。</p></details>
<details><summary><span lang="en">Put in your notice</span> — 正式提出离职／提交离职通知</summary><p>正式告知雇主自己将离职。</p><p lang="en">I plan to put in my notice next week.</p><p>我计划下周正式提出离职。</p></details>
<details><summary><span lang="en">Last working day</span> — 最后工作日</summary><p>员工实际工作的最后一天，可能不同于雇佣关系终止日。</p><p lang="en">HR will confirm your last working day in writing.</p><p>HR将以书面形式确认你的最后工作日。</p></details>
</section>
<section><h2>企业文化与员工体验</h2>
<details><summary><span lang="en">Organizational culture</span> — 组织文化</summary><p>组织成员在长期协作中形成的共同假设、价值观和行为惯例，影响团队如何理解问题并作决定。</p><p lang="en">Organizational culture shapes how teams make decisions.</p><p>组织文化影响团队作出决策的方式。</p></details>
<details><summary><span lang="en">Core values</span> — 核心价值观</summary><p>组织认同并希望在日常决策和行为中体现的基本原则。</p><p lang="en">Our core values guide hiring and leadership decisions.</p><p>我们的核心价值观指导招聘和领导决策。</p></details>
<details><summary><span lang="en">Company mission</span> — 企业使命</summary><p>说明企业为何存在、服务谁或希望为其创造何种价值的陈述。</p><p lang="en">The company mission explains why our work matters.</p><p>公司使命说明了我们的工作为什么重要。</p></details>
<details><summary><span lang="en">Company vision</span> — 企业愿景</summary><p>对企业希望在长期实现的未来状态或方向的描述。</p><p lang="en">Our company vision helps employees see the bigger picture.</p><p>公司的愿景帮助员工理解更宏观的发展方向。</p></details>
<details><summary><span lang="en">Cultural fit</span> — 文化匹配</summary><p>候选人或员工的工作方式与组织价值观或行为标准相契合的程度。招聘时应以与岗位有关、可观察的标准评估。</p><p lang="en">We should not use cultural fit as a vague reason to reject candidates.</p><p>我们不应以含糊的“文化契合度”为由拒绝候选人。</p></details>
<details><summary><span lang="en">Culture add</span> — 文化增益／文化互补</summary><p>候选人或员工为现有团队带来的互补经验、观点或工作方式。</p><p lang="en">We assess culture add by exploring diverse experiences and ideas.</p><p>我们通过考察多样化的经历和观点来评价候选人能带来的文化增益。</p></details>
<details><summary><span lang="en">Employee engagement</span> — 员工敬业度</summary><p>员工对工作及组织表现出的投入程度和心理联结，具体维度因所用评估框架而异。</p><p lang="en">Employee engagement improved after managers acted on survey feedback.</p><p>管理者根据敬业度调查反馈采取行动后，员工敬业度提高了。</p></details>
<details><summary><span lang="en">Employee experience (EX)</span> — 员工体验</summary><p>员工在与组织互动的各个阶段形成的总体感受，包括入职、日常工作、发展及离职等环节。</p><p lang="en">Employee experience includes every major moment in the employee journey.</p><p>员工体验涵盖员工职业旅程中的每一个重要时刻。</p></details>
<details><summary><span lang="en">Employee value proposition (EVP)</span> — 雇主价值主张</summary><p>雇主为吸引、激励和留住员工而提供的整体价值组合，包括薪酬、成长机会和工作体验等。</p><p lang="en">Our employee value proposition emphasizes growth and flexibility.</p><p>我们的员工价值主张突出成长机会和灵活性。</p></details>
<details><summary><span lang="en">Psychological safety</span> — 心理安全感</summary><p>团队成员相信自己可以提问、承认错误或提出不同意见，而不必担心受到羞辱或不当惩罚的共同感受。</p><p lang="en">Psychological safety encourages people to speak up early.</p><p>心理安全感鼓励员工及早表达意见。</p></details>
<details><summary><span lang="en">Belonging</span> — 归属感</summary><p>员工感到自己被接纳、受到尊重，并是团队或组织一员的体验。</p><p lang="en">A sense of belonging helps new hires settle in.</p><p>归属感有助于新员工融入团队。</p></details>
<details><summary><span lang="en">Inclusion</span> — 包容</summary><p>通过移除参与障碍，使不同背景和处境的人能够参与、表达并影响工作事务。</p><p lang="en">Inclusion means everyone&#x27;s ideas can be heard.</p><p>包容性意味着每个人的想法都有被倾听的机会。</p></details>
<details><summary><span lang="en">Diversity, equity and inclusion (DEI)</span> — 多元、公平与包容</summary><p>关注群体多元性、减少制度中的不公平障碍，以及让不同人员参与并作出贡献的一组管理议题。</p><p lang="en">Our diversity, equity and inclusion initiatives focus on fair processes.</p><p>我们的多元、公平与包容举措聚焦于公平的流程。</p></details>
<details><summary><span lang="en">Employee resource group (ERG)</span> — 员工资源社群</summary><p>通常由员工发起或参与、以共同身份、经历或兴趣为纽带，并由组织提供不同程度支持的内部网络。</p><p lang="en">The employee resource group hosts mentoring events.</p><p>员工资源小组会举办导师交流活动。</p></details>
<details><summary><span lang="en">Pulse survey</span> — 短频调查（脉搏调查）</summary><p>以较短问卷快速了解员工对某一主题的反馈，可按较短周期开展以跟踪变化。</p><p lang="en">We run a pulse survey after each major organizational change.</p><p>每次重大组织变革后，我们都会开展一次脉搏调查。</p></details>
<details><summary><span lang="en">Engagement survey</span> — 敬业度调查</summary><p>通过问卷衡量员工投入与组织联结，并收集工作环境、管理支持等相关反馈。</p><p lang="en">The engagement survey showed a need for better career conversations.</p><p>员工敬业度调查显示，需要开展更好的职业发展沟通。</p></details>
<details><summary><span lang="en">Employee Net Promoter Score (eNPS)</span> — 员工净推荐值</summary><p>以 0 至 10 分询问员工向他人推荐本组织为雇主的意愿，通常用 9–10 分人数占比减去 0–6 分人数占比计算。</p><p lang="en">The latest survey put our employee Net Promoter Score at 24.</p><p>最新调查显示，我们的员工净推荐值为 24。</p></details>
<details><summary><span lang="en">Employee recognition</span> — 员工认可</summary><p>以口头肯定、公开表扬、奖项等方式，承认员工的具体贡献、成果或有价值的行为。</p><p lang="en">Our employee recognition program celebrates cross-team support.</p><p>我们的员工认可计划表彰跨团队协作和支持。</p></details>
<details><summary><span lang="en">Leadership communication</span> — 领导层沟通</summary><p>领导层与员工就组织方向、决策、进展或关切进行的信息交流，可包括提问和反馈。</p><p lang="en">Leadership communication should explain both the decision and the rationale.</p><p>领导层沟通既要说明决策，也要解释决策依据。</p></details>
<details><summary><span lang="en">Town hall meeting</span> — 全员交流会</summary><p>通常由领导层面向较广泛的员工群体交流组织信息并回应员工问题的会议。</p><p lang="en">The CEO will answer questions at the town hall meeting.</p><p>首席执行官将在全员沟通会上回答问题。</p></details>
<details><summary><span lang="en">All-hands meeting</span> — 全体员工会议</summary><p>以整个公司、部门或团队的所有成员为对象的会议，常用于同步信息、优先事项和进展。</p><p lang="en">The all-hands meeting will cover our quarterly priorities.</p><p>全员会议将讨论本季度的重点工作。</p></details>
<details><summary><span lang="en">Feedback culture</span> — 反馈文化</summary><p>团队习惯于及时、具体、尊重地提供和接收反馈，并将反馈用于改进。</p><p lang="en">A strong feedback culture makes coaching part of daily work.</p><p>良好的反馈文化使辅导成为日常工作的一部分。</p></details>
<details><summary><span lang="en">Speak-up culture</span> — 敢言文化</summary><p>鼓励员工放心提出问题、异议和疑虑，并期待组织认真回应的工作氛围。</p><p lang="en">A speak-up culture depends on how leaders respond to concerns.</p><p>鼓励员工发声的文化取决于领导者如何回应员工关切。</p></details>
<details><summary><span lang="en">Cross-functional collaboration</span> — 跨职能协作</summary><p>来自不同职能的人员共同解决问题、协调工作或交付成果。</p><p lang="en">Cross-functional collaboration is critical for the product launch.</p><p>跨职能协作对产品发布至关重要。</p></details>
<details><summary><span lang="en">Team norms</span> — 团队协作规范</summary><p>团队形成的共同工作约定或行为预期，例如沟通、会议和决策方式。</p><p lang="en">We agreed on team norms for hybrid meetings.</p><p>我们就混合办公会议的团队规范达成了共识。</p></details>
<details><summary><span lang="en">Hybrid work</span> — 混合办公</summary><p>在工作周期内结合现场办公和远程办公的工作安排，频率和地点由组织制度或双方约定。</p><p lang="en">Our hybrid work policy sets expectations for team collaboration.</p><p>我们的混合办公政策明确了团队协作的期望。</p></details>
<details><summary><span lang="en">Remote work policy</span> — 远程办公政策</summary><p>说明远程办公适用资格、工作要求、设备和信息安全等事项的组织政策。</p><p lang="en">The remote work policy covers equipment and information security.</p><p>远程办公政策涵盖设备和信息安全要求。</p></details>
<details><summary><span lang="en">Work-life balance</span> — 工作生活平衡</summary><p>工作责任与非工作生活之间可持续的协调状态，具体需求和安排因人而异。</p><p lang="en">Flexible schedules can support work-life balance.</p><p>灵活的工作时间安排有助于实现工作与生活平衡。</p></details>
<details><summary><span lang="en">Employee wellbeing</span> — 员工身心健康</summary><p>员工在工作环境中及工作影响下的身心健康和良好状态，可涉及工作量、人际支持等因素。</p><p lang="en">Employee wellbeing requires both resources and manageable workloads.</p><p>员工身心健康既需要支持资源，也需要合理的工作负荷。</p></details>
<details><summary><span lang="en">Change communication</span> — 变革沟通</summary><p>在组织变革期间与相关人员交流变革缘由、预期影响、时间安排和后续行动的过程。</p><p lang="en">Change communication should address employee questions honestly.</p><p>变革沟通应坦诚回应员工的疑问。</p></details>
<details><summary><span lang="en">Employee listening</span> — 倾听员工意见</summary><p>通过调查、访谈等渠道持续了解员工的感受与意见，并跟进和反馈的做法。</p><p lang="en">Employee listening should lead to visible follow-up.</p><p>倾听员工意见后，应采取员工看得见的跟进行动。</p></details>
<details><summary><span lang="en">Culture survey</span> — 组织文化调查</summary><p>了解员工如何看待组织倡导的价值观及日常行为的调查。</p><p lang="en">The culture survey revealed gaps between stated values and daily behavior.</p><p>组织文化调查发现，公司倡导的价值观与日常行为之间存在差距。</p></details>
<details><summary><span lang="en">Inclusion index</span> — 包容性指数</summary><p>依据选定的题项或指标汇总员工包容体验的量化分数，题项与算法由具体调查设定。</p><p lang="en">The inclusion index improved in the latest employee survey.</p><p>最新员工调查中的包容性指数有所提高。</p></details>
<details><summary><span lang="en">Employee journey map</span> — 员工旅程地图</summary><p>从员工视角呈现工作历程中的关键接触点、体验和障碍的可视化工具。</p><p lang="en">The employee journey map highlights pain points during onboarding.</p><p>员工旅程地图突出了入职环节的体验痛点。</p></details>
<details><summary><span lang="en">Moments that matter</span> — 关键体验时刻</summary><p>显著影响员工感受的重要事件节点。</p><p lang="en">We focused on moments that matter, such as an employee’s first day or first promotion.</p><p>我们重点关注员工入职第一天、首次晋升等关键体验时刻。</p></details>
<details><summary><span lang="en">Workplace flexibility</span> — 灵活工作安排</summary><p>对工作时间、地点或方式作出的灵活安排。</p><p lang="en">Workplace flexibility can improve access to talent.</p><p>灵活的工作安排有助于扩大组织可以接触的人才范围。</p></details>
<details><summary><span lang="en">Burnout prevention</span> — 职业倦怠预防</summary><p>通过调整工作负荷、管理方式和工作支持等，降低长期工作压力导致职业倦怠的风险。</p><p lang="en">Burnout prevention can involve revising workloads and changing management practices.</p><p>预防职业倦怠可以从调整工作负荷和改变管理方式入手。</p></details>
<details><summary><span lang="en">Employee advocacy</span> — 员工倡导</summary><p>在雇主品牌语境中，指员工自愿向外界分享在职经历或推荐雇主。</p><p lang="en">Employee advocacy can give job seekers a firsthand view of the workplace.</p><p>员工倡导可以让求职者从员工的亲身分享中了解工作环境。</p></details>
<details><summary><span lang="en">Recognition platform</span> — 员工认可平台</summary><p>用于同事互相表扬或记录贡献的工具。</p><p lang="en">The recognition platform makes peer appreciation more visible.</p><p>员工认可平台让同事之间的认可与感谢更容易被看见。</p></details>
<details><summary><span lang="en">Culture transformation</span> — 文化转型</summary><p>通过制度、行为和领导方式改变组织文化的过程。</p><p lang="en">Culture transformation depends on sustained leadership action.</p><p>文化转型依赖领导层持续采取行动。</p></details>
<details><summary><span lang="en">Employer brand</span> — 雇主品牌</summary><p>求职者、员工与社会公众对企业作为雇主的整体认知和评价。</p><p lang="en">Our employer brand is strongest among early-career talent.</p><p>在初入职场的人才群体中，我们的雇主品牌最具吸引力。</p></details>
<details><summary><span lang="en">Employee satisfaction</span> — 员工满意度</summary><p>员工对工作内容、管理方式、薪酬福利或整体任职体验的满意程度。</p><p lang="en">The employee satisfaction score improved this quarter.</p><p>本季度员工满意度得分有所提升。</p></details>
<details><summary><span lang="en">Stay interview</span> — 留任访谈</summary><p>雇主主动与在职员工沟通其留任动机、风险与改善需求的访谈。</p><p lang="en">Managers will conduct stay interviews with key employees.</p><p>管理者将与关键员工开展留任访谈。</p></details>
<details><summary><span lang="en">Employee feedback channel</span> — 员工意见反馈渠道</summary><p>员工用来提交意见、建议、问题或关切的途径，例如反馈表、热线或定期座谈。</p><p lang="en">We launched an anonymous employee feedback channel.</p><p>我们开通了匿名员工反馈渠道。</p></details>
<details><summary><span lang="en">Employer reputation</span> — 雇主声誉</summary><p>员工、求职者和社会公众基于雇佣实践、员工待遇等形成的对企业的评价。</p><p lang="en">A strong employer reputation can encourage more qualified candidates to apply.</p><p>良好的雇主声誉有助于吸引更多符合条件的候选人申请。</p></details>
<details><summary><span lang="en">New hire experience</span> — 新员工入职体验</summary><p>员工从录用到融入团队期间，对手续、培训、支持和文化的整体感受。</p><p lang="en">The survey tracks the new hire experience during employees&#x27; first 90 days on the job.</p><p>这项调查跟踪新员工入职后前 90 天的体验。</p></details>
<details><summary><span lang="en">Employee volunteering</span> — 员工志愿服务</summary><p>企业组织或支持员工自愿参加公益与社区服务的活动。</p><p lang="en">Employee volunteering is part of our community program.</p><p>员工志愿服务是公司社区项目的一部分。</p></details>
<details><summary><span lang="en">Recognition program</span> — 员工表彰计划</summary><p>以公开致谢、提名、奖项等方式认可员工贡献和团队成就的制度化安排。</p><p lang="en">The recognition program celebrates employees who collaborate across teams.</p><p>员工表彰计划嘉奖积极开展跨团队协作的员工。</p></details>
<details><summary><span lang="en">Employee sentiment</span> — 员工情绪与态度／员工态度倾向</summary><p>通过调查、访谈或其他反馈反映出的员工对工作、政策或组织的总体情绪与态度。</p><p lang="en">Survey responses suggested that employee sentiment toward the policy became more positive after the update.</p><p>调查反馈显示，政策更新后，员工对该政策的态度似乎更加积极。</p></details>
<details><summary><span lang="en">Workplace climate</span> — 职场氛围／工作氛围</summary><p>员工对团队互动、领导方式及日常工作环境的集体体验。</p><p lang="en">The survey assesses workplace climate across teams.</p><p>调查评估了不同团队的职场氛围。</p></details>
<details><summary><span lang="en">Employee voice</span> — 员工发声／员工意见表达</summary><p>员工通过个人或集体渠道表达意见、提出关切，并有机会影响工作相关决策的实践。</p><p lang="en">Employee voice is a key part of an inclusive culture.</p><p>员工发声是包容性文化的重要组成部分。</p></details>
<details><summary><span lang="en">Culture fit interview</span> — 文化契合度面试</summary><p>围绕与岗位相关的组织价值观及工作方式，以结构化问题了解候选人过往行为的面试安排。</p><p lang="en">For the culture fit interview, ask each candidate the same job-related questions and use a common scoring guide.</p><p>做文化契合度面试时，应向每位候选人提出同样的岗位相关问题，并采用统一的评分指引。</p></details>
<details><summary><span lang="en">Wellbeing program</span> — 员工身心健康支持计划</summary><p>为员工身心健康、压力管理和工作生活平衡提供的企业项目。</p><p lang="en">Our wellbeing program includes access to counseling through an external provider.</p><p>我们的员工身心健康支持计划包括由外部服务机构提供的心理咨询。</p></details>
<details><summary><span lang="en">Employee satisfaction survey</span> — 员工满意度调查</summary><p>收集员工对工作环境、待遇等满意程度的调查。</p><p lang="en">We will conduct an employee satisfaction survey next month.</p><p>我们将在下个月开展员工满意度调查。</p></details>
<details><summary><span lang="en">Diversity and inclusion (D&amp;I)</span> — 多元与包容</summary><p>推动人员背景和观点的多样性，并改善不同员工参与、表达和发挥作用的条件。</p><p lang="en">Our managers promote diversity and inclusion in their teams.</p><p>我们的管理者在团队中促进多元与包容。</p></details>
<details><summary><span lang="en">Remote work</span> — 远程办公</summary><p>在常规办公场所以外开展工作。</p><p lang="en">The policy allows remote work two days a week.</p><p>该政策允许每周远程办公两天。</p></details>
<details><summary><span lang="en">Flexible working hours</span> — 弹性工作时间</summary><p>在约定范围内灵活安排上下班时间。</p><p lang="en">Our team offers flexible working hours.</p><p>我们团队提供弹性工作时间。</p></details>
</section>
<section><h2>HR运营与数据分析</h2>
<details><summary><span lang="en">Human resources information system (HRIS)</span> — 人力资源信息系统</summary><p>集中维护员工与组织数据并支持核心人力资源事务的信息系统。</p><p lang="en">The human resources information system stores employee records.</p><p>人力资源信息系统（HRIS）保存员工档案。</p></details>
<details><summary><span lang="en">Human capital management (HCM)</span> — 人力资本管理</summary><p>覆盖人员配置、绩效、发展和薪酬等环节的人力资本管理体系。软件语境中也常指支持这些流程的系统。</p><p lang="en">Our human capital management platform supports global HR processes.</p><p>我们的人力资本管理（HCM）平台支持全球人力资源流程。</p></details>
<details><summary><span lang="en">Employee master data</span> — 员工主数据</summary><p>识别员工、任职及组织归属并供多个流程或系统复用的核心结构化数据。</p><p lang="en">Please verify employee master data before payroll closes.</p><p>薪资结算前，请核对员工主数据。</p></details>
<details><summary><span lang="en">Personnel file</span> — 员工人事档案</summary><p>按员工归集的与雇佣关系有关的记录，如劳动合同、岗位变动文件等。</p><p lang="en">Access to a personnel file is restricted to authorized staff.</p><p>只有获得授权的人员才能访问人事档案。</p></details>
<details><summary><span lang="en">Employee lifecycle</span> — 员工全生命周期</summary><p>员工与组织建立、发展和结束雇佣关系所经历的各阶段，通常包括招聘、入职、发展及离职。</p><p lang="en">We mapped the employee lifecycle to find service gaps.</p><p>我们梳理了员工全生命周期，以识别人力资源服务中的缺口。</p></details>
<details><summary><span lang="en">HR shared services</span> — 人力资源共享服务</summary><p>集中提供标准化HR事务服务的模式。</p><p lang="en">Our HR shared services team handles routine employee inquiries.</p><p>我们的人力资源共享服务团队负责处理员工的日常咨询。</p></details>
<details><summary><span lang="en">Service level agreement (SLA)</span> — 服务级别协议</summary><p>约定服务范围及响应时限、办结时限或质量标准等服务目标的协议。</p><p lang="en">Our service level agreement sets a target of two business days for the first response.</p><p>我们的服务级别协议规定，首次响应目标为两个工作日。</p></details>
<details><summary><span lang="en">Case management</span> — 工单管理</summary><p>记录、分派和跟进员工服务请求的流程。</p><p lang="en">Case management helps us track complex HR requests.</p><p>工单管理有助于跟踪较复杂的人力资源服务请求。</p></details>
<details><summary><span lang="en">Employee self-service (ESS)</span> — 员工自助服务</summary><p>员工自行查工资条、请假等的功能。</p><p lang="en">Employee self-service reduces routine HR tickets.</p><p>员工自助服务减少了常规人力资源工单。</p></details>
<details><summary><span lang="en">Manager self-service (MSS)</span> — 经理自助服务</summary><p>经理直接提交或审批相关HR事项的功能。</p><p lang="en">Manager self-service lets leaders approve team requests.</p><p>经理自助服务让管理者能够审批团队申请。</p></details>
<details><summary><span lang="en">Attendance tracking</span> — 考勤记录</summary><p>记录员工到岗、离岗和缺勤等情况，并识别考勤异常的过程。</p><p lang="en">Our attendance tracking system feeds into payroll.</p><p>我们的考勤系统向薪资系统提供数据。</p></details>
<details><summary><span lang="en">Leave of absence</span> — 正式离岗休假</summary><p>员工因特定事由按适用制度暂时离岗的正式休假安排，可有薪或无薪，时长视具体情形而定。</p><p lang="en">The employee requested a leave of absence for family reasons.</p><p>该员工因家庭原因提出了正式离岗休假申请。</p></details>
<details><summary><span lang="en">Sick leave</span> — 病假</summary><p>因疾病或健康原因按规定休假。</p><p lang="en">Record sick leave in line with the policy that applies to the employee’s work location.</p><p>请按适用于员工工作所在地的政策登记病假。</p></details>
<details><summary><span lang="en">Maternity leave</span> — 产假</summary><p>与分娩相关的法定或公司休假安排。</p><p lang="en">Maternity leave entitlements depend on local law and policy.</p><p>产假权益取决于当地法律和公司政策。</p></details>
<details><summary><span lang="en">Paternity leave</span> — 陪产假</summary><p>父亲或其他符合适用规定的非生育方在子女出生前后可享有的休假，资格、时长和待遇依地区及政策而异。</p><p lang="en">The employee asked HR about paternity leave eligibility.</p><p>该员工向人力资源部门询问陪产假申请资格。</p></details>
<details><summary><span lang="en">Shift scheduling</span> — 排班</summary><p>规划轮班时间与人员覆盖。</p><p lang="en">Shift scheduling must account for any applicable minimum rest periods.</p><p>排班时须遵守适用的最短休息时限。</p></details>
<details><summary><span lang="en">Time sheet</span> — 工时表</summary><p>用于记录工作时间或项目投入的表格。</p><p lang="en">Please submit your time sheet before Friday.</p><p>请在周五之前提交工时表。</p></details>
<details><summary><span lang="en">Data privacy</span> — 数据隐私</summary><p>关于如何恰当收集、使用、共享和保留个人数据，以及如何尊重相关个人权利的要求与实践。</p><p lang="en">Data privacy is essential when handling employee records.</p><p>处理员工档案时，保护数据隐私至关重要。</p></details>
<details><summary><span lang="en">Access control</span> — 访问控制</summary><p>按身份、角色或其他权限规则，决定谁可以访问系统或数据以及可以执行哪些操作。</p><p lang="en">Access controls can restrict who is allowed to change salary data.</p><p>访问控制可以限制哪些人员有权修改薪资数据。</p></details>
<details><summary><span lang="en">HR audit</span> — 人力资源审计</summary><p>依据适用法规、制度或其他既定标准，对人力资源流程、控制与记录进行检查和评价。</p><p lang="en">The HR audit identified gaps in document retention.</p><p>人力资源审计发现了文件留存方面的不足。</p></details>
<details><summary><span lang="en">Compliance training</span> — 合规培训</summary><p>帮助员工理解法规及内部要求的课程。</p><p lang="en">Our policy requires employees who handle payments to complete this compliance training.</p><p>根据本公司的规定，经手付款的员工须完成这项合规培训。</p></details>
<details><summary><span lang="en">Headcount report</span> — 员工人数报告</summary><p>汇总某一时点或期间的实际员工人数及变动，可按部门、地点等维度呈现，并视用途与已批准岗位数对照。</p><p lang="en">The headcount report shows both actual employee counts and the number of approved positions.</p><p>员工人数报告同时列出实际员工人数和已批准岗位数。</p></details>
<details><summary><span lang="en">Attrition rate</span> — 员工流失率</summary><p>特定统计期内离开组织的员工相对员工规模的比例；应明确是否包含自愿及非自愿离职及所用分母。</p><p lang="en">Our employee attrition rate rose from 8% last year to 10% this year.</p><p>我们的员工流失率从去年的 8% 升至今年的 10%。</p></details>
<details><summary><span lang="en">Voluntary turnover</span> — 员工主动离职</summary><p>员工自行提出并结束雇佣关系的离职。退休等特殊情形是否计入，视组织统计口径而定。</p><p lang="en">The report tracks voluntary turnover by department and reason for leaving.</p><p>报告按部门和离职原因跟踪员工主动离职情况。</p></details>
<details><summary><span lang="en">Retention rate</span> — 留任率</summary><p>在约定观察期内，基准人群中到期末仍在职的员工所占比例。需明确基准人群和统计时点。</p><p lang="en">The retention rate is one indicator of workforce stability.</p><p>员工留任率是衡量人员队伍稳定性的指标之一。</p></details>
<details><summary><span lang="en">Absenteeism rate</span> — 员工缺勤率</summary><p>某一期间内缺勤天数或工时占相应计划天数或工时的比例。需明确哪些缺勤纳入统计。</p><p lang="en">The absenteeism rate should be interpreted alongside leave policies.</p><p>解读缺勤率时，应结合休假政策考虑。</p></details>
<details><summary><span lang="en">Cost per hire</span> — 人均招聘成本</summary><p>按约定期间及费用范围，将内部和外部招聘费用合计除以录用人数得出的平均成本。</p><p lang="en">Our cost per hire calculation includes recruiter time and agency fees.</p><p>我们计算人均招聘成本时，将招聘人员投入的工时成本和招聘机构服务费计入。</p></details>
<details><summary><span lang="en">Time to productivity</span> — 达到预期产出所需时间</summary><p>从入职或到岗等约定起点，到员工首次达到事先定义的岗位产出标准所需的时间。</p><p lang="en">Better onboarding can shorten time to productivity.</p><p>改善入职支持可以缩短新员工达到预期产出所需的时间。</p></details>
<details><summary><span lang="en">HR dashboard</span> — 人力资源看板</summary><p>集中展示关键人事指标的可视化页面。</p><p lang="en">The HR dashboard shows headcount and turnover trends.</p><p>人力资源看板展示员工人数和离职率的变化趋势。</p></details>
<details><summary><span lang="en">People analytics</span> — 人力数据分析</summary><p>通过分析员工及组织相关数据，为人员管理和组织决策提供依据。</p><p lang="en">People analytics helped us identify which onboarding steps were taking new hires the longest.</p><p>人力数据分析帮助我们找出哪些入职环节对新员工来说最耗时。</p></details>
<details><summary><span lang="en">Full-time equivalent (FTE)</span> — 全职当量</summary><p>将不同工时折算为标准全职工作量的指标。</p><p lang="en">The workforce plan assumes 120 full-time equivalents.</p><p>人力规划按 120 个全职当量（FTE）编制。</p></details>
<details><summary><span lang="en">Vacancy rate</span> — 岗位空缺率</summary><p>在指定时点或报告期，空缺岗位占纳入统计的岗位总数的比例。需说明哪些岗位计入分子和分母。</p><p lang="en">The vacancy rate is highest in customer operations.</p><p>客户运营部门的职位空缺率最高。</p></details>
<details><summary><span lang="en">Regrettable attrition</span> — 组织希望避免的人才流失</summary><p>依据组织预先设定的保留标准，认定为原本希望留住的员工离职，例如具有关键技能的员工离开。</p><p lang="en">We track regrettable attrition among employees with hard-to-replace skills.</p><p>我们跟踪具备难以替代技能的员工中，哪些离职属于组织希望避免的人才流失。</p></details>
<details><summary><span lang="en">Data governance</span> — 数据治理</summary><p>为数据的定义、质量、访问和使用等建立规则，并明确管理责任和决策权限。</p><p lang="en">HR data governance requires clear ownership of employee records.</p><p>人力资源数据治理需要明确员工数据的管理责任人。</p></details>
<details><summary><span lang="en">Data retention policy</span> — 数据保留政策</summary><p>规定不同类别数据的保留原则、期限和到期处置方式，并说明何时需要暂停处置的政策。</p><p lang="en">The data retention policy specifies when records should be deleted or archived.</p><p>数据保留政策规定了何时应删除或归档记录。</p></details>
<details><summary><span lang="en">Workforce analytics</span> — 员工队伍分析</summary><p>分析人员规模、能力构成、工时、成本和流动趋势等信息，以支持人员配置和规划。</p><p lang="en">Workforce analytics helps us forecast staffing needs.</p><p>员工队伍分析帮助我们预测人员配置需求。</p></details>
<details><summary><span lang="en">People metrics</span> — 人力资源指标</summary><p>用于衡量员工和组织情况的各类指标。</p><p lang="en">We agreed on consistent definitions for our people metrics.</p><p>我们就各项人力资源指标的统一定义达成了共识。</p></details>
<details><summary><span lang="en">Data dictionary</span> — 数据字典</summary><p>记录数据字段的含义、类型、来源、允许取值等信息的文档，也可包含指标口径。</p><p lang="en">The data dictionary defines which employment statuses count as active.</p><p>数据字典明确了哪些雇佣状态归为在职。</p></details>
<details><summary><span lang="en">HR service ticket</span> — 人力资源服务工单</summary><p>记录人力资源服务请求及其进度、沟通和处理结果的单条记录。</p><p lang="en">The team resolved the HR service ticket within the agreed resolution time.</p><p>团队在人力资源服务约定的办结时限内处理完了这张工单。</p></details>
<details><summary><span lang="en">Predictive analytics</span> — 预测分析</summary><p>利用已有数据和统计或机器学习方法估计未来可能发生的结果。</p><p lang="en">Before using predictive analytics in HR, assess how well the model performs overall and across relevant groups.</p><p>将预测分析用于人力资源决策前，应评估模型的整体表现，以及它在相关群体中的表现。</p></details>
<details><summary><span lang="en">Employee turnover rate</span> — 员工离职率</summary><p>一定统计期内离职人数相对于同期约定在职人数基数的比例，常以期间平均在职人数为分母。需说明纳入哪些离职类型。</p><p lang="en">The employee turnover rate declined in the second quarter.</p><p>第二季度员工离职率下降了。</p></details>
<details><summary><span lang="en">Employee ID</span> — 员工编号／工号</summary><p>在组织或 HR 系统中用于区分员工记录的唯一标识，可由数字或字母组成。</p><p lang="en">Please enter your employee ID to access the HR portal.</p><p>请输入工号以访问人力资源门户。</p></details>
<details><summary><span lang="en">Employee status</span> — 员工雇佣状态</summary><p>人事系统记录的员工任职状态，例如在职、休假或雇佣已结束。具体分类和生效规则依系统配置而异。</p><p lang="en">HR updated the employee status in the system to reflect the confirmed separation date.</p><p>人力资源部门根据已确认的离职日期更新了系统中的雇佣状态。</p></details>
<details><summary><span lang="en">Payroll processing</span> — 薪资处理／工资核算与发放</summary><p>按薪资周期收集和核对数据，计算工资、扣款和实发金额，并按流程安排支付和相关记录。</p><p lang="en">Payroll processing for this pay cycle includes a review of overtime and deductions.</p><p>本薪资周期的处理工作包括核对加班工资和扣款。</p></details>
<details><summary><span lang="en">Payroll cutoff date</span> — 薪资数据提交截止日</summary><p>在常规薪资流程中，为将变更、考勤或津贴等数据纳入当期核算而规定的最迟提交时间。</p><p lang="en">Our payroll team reviews changes submitted after the payroll cutoff date to determine when they can be processed.</p><p>薪资团队会审核在数据提交截止后收到的变更，确定何时可以处理。</p></details>
<details><summary><span lang="en">Leave balance</span> — 剩余休假额度／假期余额</summary><p>截至某个日期，员工某类假期的剩余额度。是否扣除已预约但尚未休的假期，取决于系统口径。</p><p lang="en">Employees can check their leave balance in self-service.</p><p>员工可在自助服务系统中查看剩余休假额度。</p></details>
<details><summary><span lang="en">Leave accrual</span> — 休假额度累计</summary><p>员工按服务时间、工作时数或适用规则逐步取得休假额度的过程。</p><p lang="en">Annual leave accrual is calculated monthly under the policy.</p><p>根据政策，年假按月累计。</p></details>
<details><summary><span lang="en">Unpaid leave</span> — 无薪假／不带薪休假</summary><p>员工暂时休假且相应期间不领取正常工资的安排，可依政策获批或按当地规定享有。</p><p lang="en">The employee requested two weeks of unpaid leave.</p><p>该员工申请了两周无薪假。</p></details>
<details><summary><span lang="en">Offboarding checklist</span> — 离职流程清单／离职手续清单</summary><p>用于分派和跟踪工作交接、资产归还、系统权限处理等离职任务的清单，通常由多个部门协作完成。</p><p lang="en">The offboarding checklist includes system access removal.</p><p>离职清单包括取消系统访问权限。</p></details>
<details><summary><span lang="en">Headcount reconciliation</span> — 人员数量对账／在职人数与编制核对</summary><p>核对 HR、薪资或财务系统中的人员数量和相关编制数据，按统一时点和口径解释并处理差异。</p><p lang="en">We conduct headcount reconciliation before monthly reporting.</p><p>我们在出具月报前核对人员数量。</p></details>
<details><summary><span lang="en">Employment verification</span> — 雇佣信息核验／任职证明</summary><p>按组织流程和适用规则，核实个人现任或过往雇佣关系、任职期间或岗位等信息。出具书面证明是常见方式之一。</p><p lang="en">The bank requested employment verification with the employee&#x27;s authorization.</p><p>银行在取得员工授权后提出了任职信息核验请求。</p></details>
<details><summary><span lang="en">Personnel action</span> — 人事异动／人事变更</summary><p>对员工人事记录作出的正式变更，例如调岗、晋升、调薪或离职。具体所用表单和审批流程因组织而异。</p><p lang="en">HR submitted a personnel action for the employee&#x27;s transfer.</p><p>人力资源部门已提交该员工的调岗申请。</p></details>
<details><summary><span lang="en">HR compliance audit</span> — 人力资源合规审计</summary><p>对劳动用工、员工记录、权限或政策执行的合规性进行系统核查。</p><p lang="en">The HR compliance audit identified gaps in record retention.</p><p>人力资源合规审计发现档案留存方面存在不足。</p></details>
<details><summary><span lang="en">Outsourcing</span> — 业务外包</summary><p>将部分业务或服务委托外部供应商。</p><p lang="en">HR is evaluating outsourcing options for payroll administration.</p><p>人力资源部门正在评估薪资管理的外包方案。</p></details>
<details><summary><span lang="en">Benchmarking</span> — 对标分析</summary><p>与外部或内部参照对象比较指标和实践。</p><p lang="en">We use benchmarking to compare our benefits with those offered by similar employers.</p><p>我们通过对标分析，将公司的福利与同类雇主提供的福利进行比较。</p></details>
<details><summary><span lang="en">HR business partner (HRBP)</span> — 人力资源业务伙伴</summary><p>与业务负责人合作，将人员管理和组织能力等议题纳入业务决策的人力资源岗位。</p><p lang="en">The HR business partner helped the warehouse manager review turnover on the night shift.</p><p>人力资源业务伙伴协助仓库经理分析夜班员工的离职情况。</p></details>
<details><summary><span lang="en">HR operating model</span> — 人力资源运营模式</summary><p>人力资源职能组织分工、治理、流程和服务交付的整体方式。</p><p lang="en">We are redesigning the HR operating model to clarify responsibilities.</p><p>我们正在重新设计HR运营模式，以明确职责。</p></details>
<details><summary><span lang="en">HR service delivery</span> — 人力资源服务交付</summary><p>向员工和管理者提供人力资源服务所采用的流程、渠道和支持方式。</p><p lang="en">We track response times to improve HR service delivery.</p><p>我们跟踪响应时间，以改善HR服务交付。</p></details>
<details><summary><span lang="en">Center of excellence (CoE)</span> — 专业能力中心（CoE）</summary><p>集中专业知识、制定标准并为业务提供专门方案的团队，如薪酬、人才发展专业中心。</p><p lang="en">The compensation center of excellence develops reward frameworks.</p><p>薪酬专业能力中心负责制定薪酬激励框架。</p></details>
<details><summary><span lang="en">Workforce demand forecast</span> — 人力需求预测</summary><p>依据业务计划、工作量等信息，估算未来需要的员工数量、岗位或技能。</p><p lang="en">The workforce demand forecast reflects expected business growth.</p><p>人力需求预测反映预期业务增长。</p></details>
<details><summary><span lang="en">Workforce supply forecast</span> — 人力供给预测</summary><p>考虑内部流动、离职、招聘渠道等因素，估计未来可获得的人员数量与技能。</p><p lang="en">The workforce supply forecast accounts for expected departures.</p><p>人力供给预测考虑预计离职情况。</p></details>
<details><summary><span lang="en">Build-buy-borrow strategy</span> — 培养、招聘与引入外部人才策略</summary><p>通过内部培养、对外招聘和短期引入外部人才或服务，填补技能与人力缺口的策略。</p><p lang="en">We use a build-buy-borrow strategy to close capability gaps.</p><p>我们通过内部培养、外部招聘和借助外部人才弥补能力差距。</p></details>
<details><summary><span lang="en">Workforce scenario planning</span> — 人力情景规划</summary><p>设定若干有实质差异的未来情景，并据此分析人员需求、供给和应对措施。</p><p lang="en">Workforce scenario planning helps us prepare for different growth rates.</p><p>人力情景规划帮助我们应对不同增长速度。</p></details>
<details><summary><span lang="en">People strategy</span> — 人才与组织战略</summary><p>围绕人力配置、人才发展、组织能力与员工体验等议题制定的整体战略，用于支持业务目标。</p><p lang="en">Our people strategy supports the company&#x27;s expansion plans.</p><p>我们的人才与组织战略支持公司的扩张计划。</p></details>
<details><summary><span lang="en">Strategic alignment</span> — 战略一致性／战略协同</summary><p>不同层级或职能的目标、决策和行动对共同战略目标形成支持的程度。</p><p lang="en">We review HR priorities to ensure strategic alignment with business goals.</p><p>我们审视HR重点工作，确保与业务目标保持战略协同。</p></details>
<details><summary><span lang="en">Revenue per employee</span> — 人均营收</summary><p>在约定统计期间内，以营收除以按统一规则确定的员工人数或全职当量所得的指标。</p><p lang="en">We calculate revenue per employee using average quarterly headcount.</p><p>我们以季度平均员工人数为分母计算人均营收。</p></details>
<details><summary><span lang="en">Labor cost ratio</span> — 人工成本比率</summary><p>人工成本与营收、总成本等约定财务基数之比，比较时应统一分子与分母口径。</p><p lang="en">In this report, the labor cost ratio is total labor costs divided by revenue.</p><p>在本报告中，人工成本比率等于人工总成本除以营收。</p></details>
<details><summary><span lang="en">Human capital return on investment</span> — 人力资本投资回报率</summary><p>按明确的方法，将可归于人力资本的产出或财务回报与相应的人力资本成本联系起来测算的指标。</p><p lang="en">We calculate human capital return on investment using a documented methodology.</p><p>我们采用有明确记录的方法计算人力资本投资回报率。</p></details>
<details><summary><span lang="en">Cohort analysis</span> — 群组分析</summary><p>按共同特征或起始事件划分群组，并追踪或比较各群组在可比时间跨度内的结果。</p><p lang="en">We conducted a cohort analysis of employees hired in the same quarter.</p><p>我们对同一季度入职的员工开展群组分析。</p></details>
<details><summary><span lang="en">Leading indicator</span> — 领先指标</summary><p>在目标结果出现前可观察、用于提示未来变化风险或趋势的指标，其预测价值需要验证。</p><p lang="en">We are testing whether engagement scores serve as a leading indicator of turnover.</p><p>我们正在验证敬业度得分能否作为员工离职的领先指标。</p></details>
<details><summary><span lang="en">Lagging indicator</span> — 滞后指标</summary><p>反映已经发生的结果或变化，往往在相关事件发生后才可计算的指标。</p><p lang="en">Last quarter’s turnover rate is a lagging indicator of workforce retention.</p><p>上季度离职率是反映员工留任结果的滞后指标。</p></details>
</section>
<section><h2>海外派遣与全球流动</h2>
<details><summary><span lang="en">Global mobility</span> — 全球人才流动</summary><p>管理员工跨境工作或调动的实践，可涵盖国际派遣、长期调动、跨境远程工作等安排。</p><p lang="en">Our global mobility policy covers international assignments.</p><p>我们的全球人才流动政策涵盖国际派遣。</p></details>
<details><summary><span lang="en">International assignment</span> — 国际派遣</summary><p>组织安排员工在一定期限内赴另一国家或地区执行工作任务。</p><p lang="en">The international assignment will last eighteen months.</p><p>此次国际派遣将持续18个月。</p></details>
<details><summary><span lang="en">Expatriate</span> — 外派员工</summary><p>在企业全球流动语境中，指被派往境外生活和工作的员工。</p><p lang="en">The expatriate will receive relocation support.</p><p>该外派员工将获得搬迁支持。</p></details>
<details><summary><span lang="en">Host country</span> — 派驻国</summary><p>员工被派往工作的国家。</p><p lang="en">The host-country HR team will help with local onboarding.</p><p>派驻国的人力资源团队将协助办理当地的入职手续。</p></details>
<details><summary><span lang="en">Home country</span> — 派出国</summary><p>全球流动政策为某次派遣确定的来源国，通常依据派遣前的工作地或雇佣关系认定。</p><p lang="en">The home-country HR team will retain the employee’s personnel file under our records policy.</p><p>根据我们的档案政策，派出国的人力资源团队将继续保管该员工的人事档案。</p></details>
<details><summary><span lang="en">Assignment letter</span> — 外派函</summary><p>载明派遣地点、期限、职责、薪酬福利及其他约定的书面文件。</p><p lang="en">HR is preparing the assignment letter for approval.</p><p>人力资源部门正在准备外派函并将提交审批。</p></details>
<details><summary><span lang="en">Assignment allowance</span> — 外派津贴</summary><p>根据外派安排额外发放的津贴，发放目的、金额及期限由适用政策或约定确定。</p><p lang="en">The assignment allowance is outlined in the mobility policy.</p><p>外派津贴的具体规定载于全球流动政策。</p></details>
<details><summary><span lang="en">Cost-of-living allowance (COLA)</span> — 生活成本补贴</summary><p>在外派薪酬语境中，为补偿派驻地与政策基准地之间纳入口径的生活成本差额而设的补贴。</p><p lang="en">A cost-of-living allowance may be available if the host location is more expensive under the policy’s calculation.</p><p>如果按政策测算的派驻地生活成本更高，员工可能符合领取生活成本补贴的条件。</p></details>
<details><summary><span lang="en">Housing allowance</span> — 住房津贴</summary><p>按外派政策或约定，补助员工在派驻地符合条件的住房支出的津贴。</p><p lang="en">The housing allowance is subject to the approved cap.</p><p>住房津贴不得超过核准的上限。</p></details>
<details><summary><span lang="en">Relocation assistance</span> — 搬迁支持</summary><p>协助员工搬迁及落脚的支持，可包括搬家服务、过渡住宿、费用报销或津贴。</p><p lang="en">Our relocation assistance covers shipment of household goods and temporary accommodation.</p><p>我们的搬迁支持包括运输家庭物品和提供临时住宿。</p></details>
<details><summary><span lang="en">Work permit</span> — 工作许可</summary><p>按目的地制度取得的工作授权，可对雇主、岗位、工作活动或期限设限。</p><p lang="en">If a work permit is required, check its effective date before the employee starts work.</p><p>如需办理工作许可，应在员工开始工作前核对许可的生效日期。</p></details>
<details><summary><span lang="en">Employment visa</span> — 工作签证</summary><p>用于就业目的的签证类别，其允许的入境、停留及工作活动取决于目的地制度与获批条件。</p><p lang="en">The supporting documents for an employment visa vary by destination and visa category.</p><p>工作签证所需的证明材料因目的地和签证类别而异。</p></details>
<details><summary><span lang="en">Immigration compliance</span> — 移民合规</summary><p>在跨境工作场景中，遵守目的地适用的入境、停留、居留和工作授权等要求。</p><p lang="en">Our immigration compliance review covers the activities planned for each destination.</p><p>我们的移民合规审查涵盖计划在各目的地开展的活动。</p></details>
<details><summary><span lang="en">Tax equalization</span> — 税负平衡</summary><p>按公司外派政策，将员工应负担的约定范围内税款与假设留在基准地应承担的税负对齐的安排。</p><p lang="en">Tax equalization is explained in the assignment policy.</p><p>税负平衡安排在外派政策中作了说明。</p></details>
<details><summary><span lang="en">Hypothetical tax</span> — 假设税额</summary><p>税负平衡下，以员工留在政策基准地为假设，对政策涵盖的收入测算的税额。</p><p lang="en">Under our tax equalization policy, payroll deducts hypothetical tax each month.</p><p>按我们的税负平衡政策，薪资团队每月从工资中扣除假设税额。</p></details>
<details><summary><span lang="en">Tax protection</span> — 税负保护</summary><p>按政策保护员工不因派遣承担超出某基准的税负。</p><p lang="en">Tax protection may apply if the covered tax liability exceeds the policy baseline.</p><p>如果政策涵盖的应纳税额高于政策基准，可能适用税负保护。</p></details>
<details><summary><span lang="en">Tax residency</span> — 税收居民身份</summary><p>依适用税法及相关税收协定确定的税收居民身份，可影响纳税和申报范围。</p><p lang="en">The tax team reviewed the employee’s tax residency in both jurisdictions.</p><p>税务团队审查了该员工在两个税收管辖区的税收居民身份。</p></details>
<details><summary><span lang="en">Permanent establishment (PE)</span> — 常设机构</summary><p>在适用国内法或税收协定下，企业在另一税收管辖区的固定营业场所或符合条件的代理人活动等形成的企业所得税征税联结。</p><p lang="en">We need to assess permanent establishment risk before approving the role.</p><p>在批准该岗位前，我们需要评估常设机构（PE）税务风险。</p></details>
<details><summary><span lang="en">Social security coverage</span> — 社保参保安排</summary><p>员工在跨境工作期间适用的法定社会保障制度及其涵盖项目，具体取决于各地规则和适用的协调协定。</p><p lang="en">Social security coverage depends on local rules and any applicable agreements.</p><p>社保参保安排取决于当地规则及适用的协调协定。</p></details>
<details><summary><span lang="en">Certificate of coverage</span> — 社保适用证明</summary><p>主管机构根据适用的跨境社保协调安排签发，用于证明特定期间适用哪一方社保制度的文件。</p><p lang="en">Under an applicable agreement, a certificate of coverage can help establish an exemption from duplicate contributions for covered programs.</p><p>在适用协定下，社保适用证明可作为对所涵盖社保项目免于重复缴费的依据。</p></details>
<details><summary><span lang="en">Split payroll</span> — 分地发薪</summary><p>将同一员工的实际薪酬分由两个国家或地区的薪资系统或实体支付的安排。</p><p lang="en">Split payroll requires coordination between the two payroll teams.</p><p>分地发薪需要两地的薪资团队相互协调。</p></details>
<details><summary><span lang="en">Shadow payroll</span> — 影子薪资核算</summary><p>对在另一地支付的薪酬在本地作并行核算，以满足适用的申报或代扣代缴要求，通常不产生第二笔净工资。</p><p lang="en">Shadow payroll may be needed to report compensation paid abroad.</p><p>申报在境外支付的薪酬时，可能需要通过影子薪资核算办理。</p></details>
<details><summary><span lang="en">Balance sheet approach</span> — 外派薪酬平衡表法</summary><p>以派出地的薪酬和消费结构为基准，按政策调整派驻地生活成本、住房、税务等项目的外派薪酬设计方法。</p><p lang="en">The balance sheet approach aims to maintain purchasing power.</p><p>外派薪酬平衡表法旨在帮助员工在派驻期间保持原有的购买力水平。</p></details>
<details><summary><span lang="en">Localization</span> — 雇佣待遇本地化</summary><p>在外派语境中，指结束或逐步退出外派待遇，转为派驻地的雇佣条件和薪酬福利安排。</p><p lang="en">Localization may be considered after the assignment ends.</p><p>外派结束后，可以考虑按派驻地的雇佣待遇安排员工转为当地任职。</p></details>
<details><summary><span lang="en">Local-plus package</span> — 当地薪酬加额外福利方案</summary><p>以派驻地市场薪酬和当地待遇为基础，按约定增加选定津贴或福利的方案。</p><p lang="en">Our local-plus package combines a local salary with a temporary housing allowance.</p><p>我们的当地薪酬加额外福利方案包括当地薪资和限期发放的住房津贴。</p></details>
<details><summary><span lang="en">Repatriation</span> — 外派回任</summary><p>在全球流动语境中，指员工外派结束后返回外派前的工作地或原组织的过程。</p><p lang="en">Repatriation planning should begin before the assignment ends.</p><p>外派回任规划应在派遣结束前启动。</p></details>
<details><summary><span lang="en">Reintegration</span> — 回任融入</summary><p>员工结束外派后重新融入原组织并适应回任岗位的过程，可包括明确职责、重建协作关系和分享外派经验。</p><p lang="en">Our reintegration program pairs returnees with a manager who can help them settle into their new role.</p><p>我们的回任融入计划为外派回任员工安排一名经理，帮助他们适应新的岗位。</p></details>
<details><summary><span lang="en">Assignment extension</span> — 派遣延期</summary><p>延长原定国际派遣期限的安排。</p><p lang="en">The business requested an assignment extension of six months.</p><p>业务部门申请将外派期限延长六个月。</p></details>
<details><summary><span lang="en">Assignment termination</span> — 外派终止</summary><p>按约定结束某次外派安排。提前结束时，可能需另行安排职责交接、待遇结算或返程。</p><p lang="en">Early assignment termination requires a clear transition plan.</p><p>提前终止外派需要明确的交接和过渡计划。</p></details>
<details><summary><span lang="en">Dependent support</span> — 随行家属支持</summary><p>为符合外派政策条件的家属提供的跨境搬迁及安置支持，范围可能涵盖择校和办理当地手续等。</p><p lang="en">Dependent support may include school search assistance.</p><p>随行家属支持可能包括协助择校。</p></details>
<details><summary><span lang="en">Destination services</span> — 目的地安置服务</summary><p>围绕员工及家属在派驻地安家所提供的服务，可包括找房、熟悉当地环境及办理登记等。</p><p lang="en">Destination services can help with housing and local registration.</p><p>目的地安置服务可包括协助找房及办理当地登记手续。</p></details>
<details><summary><span lang="en">Hardship allowance</span> — 艰苦地区津贴</summary><p>根据适用政策，为在生活或工作条件较为艰苦的地点任职而发放的津贴。</p><p lang="en">We review hardship allowance rates when a location’s rating changes.</p><p>派驻地点的评级变化时，我们会复核艰苦地区津贴的标准。</p></details>
<details><summary><span lang="en">Foreign exchange risk</span> — 汇率风险</summary><p>汇率波动使薪资折算、外派成本或员工实际购买力偏离预期的风险。</p><p lang="en">Foreign exchange risk matters when an assignment budget includes expenses payable in another currency.</p><p>外派预算纳入以其他币种支付的费用时，应考虑汇率风险。</p></details>
<details><summary><span lang="en">Assignment cost projection</span> — 外派成本预测</summary><p>根据外派期限和相关假设，估算派驻期间及相关搬迁阶段的薪酬福利、雇主承担的税费和支持服务等支出。</p><p lang="en">This assignment cost projection includes housing and tax preparation fees.</p><p>这份外派成本预测包括住房支出和税务申报服务费。</p></details>
<details><summary><span lang="en">Mobility policy exception</span> — 全球流动政策例外</summary><p>组织依据内部授权，对某项全球流动安排批准偏离标准政策条款的个案。</p><p lang="en">Our company requires written approval for a mobility policy exception.</p><p>我们公司规定，全球流动政策例外须获得书面批准。</p></details>
<details><summary><span lang="en">Cross-border remote work</span> — 跨境远程办公</summary><p>员工在其通常工作地所在国家或地区以外远程履行工作职责的安排，可涉及临时或持续性的跨境工作。</p><p lang="en">Cross-border remote work can create tax and immigration issues.</p><p>跨境远程办公可能引发税务和移民合规问题。</p></details>
<details><summary><span lang="en">Business traveler</span> — 商务出差人员</summary><p>在全球人才流动语境中，指为开会、谈判等短期商务活动赴境外的员工，具体合规类别取决于实际活动及当地规定。</p><p lang="en">Tracking business travelers helps the mobility team identify trips that need a compliance review.</p><p>跟踪商务出差人员的行程，有助于全球流动团队识别需要开展合规审查的出差安排。</p></details>
<details><summary><span lang="en">Duty of care</span> — 雇主保护义务</summary><p>在适用法律及具体情境下，雇主为保护员工健康和安全应采取合理措施的义务。</p><p lang="en">As part of our duty of care, we provide employees with an emergency contact for overseas travel.</p><p>为境外出差员工提供紧急联系人，是我们履行雇主保护义务的措施之一。</p></details>
<details><summary><span lang="en">Emergency evacuation</span> — 紧急撤离</summary><p>在安全等紧急风险下，将人员从受影响地点转移到较安全地点的行动及相关安排。</p><p lang="en">The emergency evacuation plan includes a 24-hour contact line.</p><p>紧急撤离预案列有一条 24 小时联络热线。</p></details>
<details><summary><span lang="en">Assignment ROI</span> — 外派投资回报</summary><p>衡量可归因于外派的收益与成本之间的关系。采用财务口径时，通常用净收益除以成本。难以货币化的成效可另行报告。</p><p lang="en">Our assignment ROI review compares documented savings with the total cost of the placement.</p><p>评估外派投资回报时，我们将有记录的成本节约额与外派总成本对照。</p></details>
<details><summary><span lang="en">Assignee</span> — 国际派遣员工／外派员工</summary><p>在全球流动语境中，指按派遣安排到另一国家或地区工作一定期间的员工。</p><p lang="en">The assignee will relocate to Singapore next month.</p><p>这位外派员工下个月将搬到新加坡。</p></details>
<details><summary><span lang="en">Secondment</span> — 借调／临时派驻</summary><p>员工暂时到另一团队、关联实体或外部组织工作的一种安排，通常保留与原单位的雇佣关系，具体职责和安排由适用规则及协议确定。</p><p lang="en">The secondment agreement defines the employee&#x27;s reporting line.</p><p>借调协议规定了该员工的汇报关系。</p></details>
<details><summary><span lang="en">Short-term assignment</span> — 短期国际派遣</summary><p>按组织全球流动政策归为期限较短的跨境派遣，常见为数周或数月。时长门槛及移民、税务义务需分别按相关规则判断。</p><p lang="en">For this short-term assignment, the mobility team confirmed that a work permit was required.</p><p>全球流动团队已确认，这次短期国际派遣需要工作许可。</p></details>
<details><summary><span lang="en">Long-term assignment</span> — 长期国际派遣</summary><p>按组织全球流动政策划分的较长时间跨境派遣，通常有预计结束日期，期限门槛和福利以具体政策为准。</p><p lang="en">The long-term assignment package includes housing support.</p><p>这份长期国际派遣的待遇方案包含住房支持。</p></details>
<details><summary><span lang="en">International transfer</span> — 跨国岗位调动</summary><p>员工正式从一国的岗位或工作地点调动到另一国的安排，可能伴随雇佣主体或合同条件变更。</p><p lang="en">HR reviewed the employment terms for the international transfer.</p><p>人力资源部门审查了该员工跨国调动的雇佣条款。</p></details>
<details><summary><span lang="en">Host-country payroll</span> — 派驻国薪资处理</summary><p>针对外派员工在派驻国办理的薪资记录、计算、预扣或申报等流程。是否实际由当地发薪取决于具体安排。</p><p lang="en">The host-country payroll team will confirm local tax withholding.</p><p>派驻国薪资团队将核实当地的税款预扣安排。</p></details>
<details><summary><span lang="en">Home leave</span> — 外派探亲假／返乡休假</summary><p>部分外派政策或合同约定的返回派出地或指定地点休假安排，可包含符合条件的旅费福利。</p><p lang="en">Under the assignment policy, the assignee is eligible for one home leave trip each year.</p><p>按外派政策，这位外派员工每年可享受一次返乡探亲安排。</p></details>
<details><summary><span lang="en">Dependent visa</span> — 随行家属签证／家属陪同签证</summary><p>供符合条件的主申请人家属陪同或团聚的签证类别。当地也可能采用居留许可等形式，资格和附带权利依目的地及类别而异。</p><p lang="en">The mobility team will assist with the dependent visa application.</p><p>全球流动团队将协助准备随行家属签证申请。</p></details>
<details><summary><span lang="en">Immigration sponsorship</span> — 雇主移民担保／雇主签证担保</summary><p>雇主在适用的移民类别下，以担保方身份为员工的工作签证、移民或工作许可申请提交材料或履行相应义务。</p><p lang="en">The host entity confirmed that it could provide immigration sponsorship for the role.</p><p>接收实体确认可为该岗位提供雇主移民担保。</p></details>
<details><summary><span lang="en">Relocation reimbursement</span> — 搬迁费用报销</summary><p>员工因工作地点变更而支出费用后，按已有协议或组织政策核销符合条件的搬家、交通等费用。</p><p lang="en">Under our relocation policy, employees need prior approval and receipts to claim relocation reimbursement.</p><p>按公司搬迁政策，员工须事先获批并提供收据，才能申请搬迁费用报销。</p></details>
<details><summary><span lang="en">Cross-border tax compliance</span> — 跨境税务合规（全球流动语境）</summary><p>在跨境派遣、出差等安排中，识别并履行相关法域的税务义务，可涉及个人所得税申报和雇主预扣、申报等义务。</p><p lang="en">Our mobility policy calls for a cross-border tax compliance review before an assignment begins.</p><p>公司全球流动政策要求在派遣开始前进行跨境税务合规审查。</p></details>
<details><summary><span lang="en">Tax gross-up</span> — 税款补足／税前金额加算</summary><p>在约定的薪酬或津贴基础上增加税前金额，以覆盖纳入计算的税费，让税后金额达到约定目标。适用项目、税费和计算口径以具体安排为准。</p><p lang="en">The assignment package includes a tax gross-up for certain allowances.</p><p>外派方案对部分津贴提供税款补足安排。</p></details>
<details><summary><span lang="en">Repatriation support</span> — 外派回任支持</summary><p>员工结束海外派遣返回派出地前后获得的支持，可涉及返程搬迁、岗位衔接和重新融入。</p><p lang="en">Our repatriation support starts before the assignment ends.</p><p>我们的外派回任支持在派遣结束前就会启动。</p></details>
<details><summary><span lang="en">Assignment policy</span> — 海外派遣政策</summary><p>机构管理跨境员工派遣的内部规则，通常规定派遣类型、适用资格、审批流程和支持项目。</p><p lang="en">HR checks the assignment policy before confirming an assignee’s relocation benefits.</p><p>人力资源部门在确认派遣员工的搬迁福利前，会查阅海外派遣政策。</p></details>
<details><summary><span lang="en">Assignment duration</span> — 派遣期限</summary><p>员工被派往某地或承担指定职责的时长，通常按约定起止日期计算。</p><p lang="en">The assignment duration is twelve months, starting in April.</p><p>派遣期限为十二个月，从四月开始。</p></details>
<details><summary><span lang="en">Pre-departure briefing</span> — 派遣前说明会</summary><p>员工赴接收地前举行的说明会，通常介绍出行、安置、准备事项及当地联系人。</p><p lang="en">The pre-departure briefing covers health and safety guidance for the host location.</p><p>派遣前说明会将介绍接收地的健康与安全指引。</p></details>
<details><summary><span lang="en">Post-arrival orientation</span> — 抵达后适应培训</summary><p>员工抵达派遣接收地后参加的介绍和适应活动，内容可包括当地办公流程、工作场所和生活信息。</p><p lang="en">The host office arranges post-arrival orientation for assignees.</p><p>接收地办公室为派遣员工安排抵达后适应培训。</p></details>
<details><summary><span lang="en">Accompanied assignment</span> — 家属随行派遣</summary><p>机构安排员工赴接收地任职，并允许符合条件的家属随同迁居。实际迁居须符合适用的入境及居留规定。</p><p lang="en">Family benefits depend on the terms of the accompanied assignment.</p><p>家属可享受哪些福利，取决于家属随行派遣的具体条款。</p></details>
<details><summary><span lang="en">Unaccompanied assignment</span> — 家属不随行派遣</summary><p>员工赴接收地任职、家属不随同迁居的派遣安排。探亲和家属支持视具体条款而定。</p><p lang="en">He opted for an unaccompanied assignment lasting one year.</p><p>他选择了一年期的家属不随行派遣。</p></details>
<details><summary><span lang="en">Commuter assignment</span> — 跨境通勤式派遣</summary><p>跨境派遣的一种安排。员工通常保留原居住地，按约定频率往返原居住地与另一国家或地区的工作地点。</p><p lang="en">We’re considering a commuter assignment to cover two sites on either side of the border.</p><p>我们正在考虑采用跨境通勤式派遣，为边境两侧的工作地点提供支持。</p></details>
<details><summary><span lang="en">Home-country payroll</span> — 派出国薪资发放</summary><p>派出国的薪资处理和发放安排。Home country 在这里指派出国，员工的国籍可能不同。</p><p lang="en">The employee remains on the home-country payroll during the assignment.</p><p>派遣期间，该员工继续由派出国发薪。</p></details>
<details><summary><span lang="en">Tax briefing</span> — 税务说明会</summary><p>向派遣员工介绍可能涉及的纳税、申报和记录要求的说明会，内容随涉及的司法辖区及个人情况而异。</p><p lang="en">We schedule a tax briefing to explain potential filing obligations.</p><p>我们安排税务说明会，解释员工可能涉及的纳税申报义务。</p></details>
<details><summary><span lang="en">Tax return preparation</span> — 纳税申报准备</summary><p>为提交纳税申报表而收集资料、核算相关信息并编制申报表的过程。适用材料和程序取决于司法辖区及个案。</p><p lang="en">The tax adviser assists eligible assignees with tax return preparation.</p><p>税务顾问协助符合条件的派遣员工准备纳税申报材料。</p></details>
<details><summary><span lang="en">Immigration counsel</span> — 移民事务法律顾问</summary><p>就签证、居留身份或工作许可等事项提供法律意见的移民事务专业法律顾问。执业资格及服务范围依当地规则而定。</p><p lang="en">HR consults immigration counsel before confirming the start date.</p><p>人力资源部门在确认到岗日期前会咨询移民事务法律顾问。</p></details>
<details><summary><span lang="en">Relocation vendor</span> — 搬迁服务供应商</summary><p>受企业或员工委托，提供跨地区搬迁服务的外部供应商。</p><p lang="en">Procurement and HR jointly select a relocation vendor.</p><p>采购部门与HR共同选择搬迁服务供应商。</p></details>
<details><summary><span lang="en">Temporary accommodation</span> — 临时住宿</summary><p>员工在正式入住前，或在短期派遣期间使用的过渡性住所。</p><p lang="en">The mobility team books temporary accommodation for eligible assignees.</p><p>全球人才流动团队为符合条件的外派员工预订临时住宿。</p></details>
<details><summary><span lang="en">Household goods shipment</span> — 家庭物品运输</summary><p>员工搬迁时将家具和个人生活用品运往目的地的服务或安排。</p><p lang="en">The vendor coordinates the shipment of household goods and prepares customs documentation.</p><p>供应商协调家庭物品运输并准备海关申报文件。</p></details>
<details><summary><span lang="en">Repatriation planning</span> — 回任规划</summary><p>预先安排派遣员工返回原工作地或派出单位，以及回任后岗位衔接和重新融入的过程。</p><p lang="en">HR starts repatriation planning before the overseas assignment ends.</p><p>人力资源部门在海外派遣结束前着手制定回任计划。</p></details>
</section>
<section><h2>HR商务沟通与汇报</h2>
<details><summary><span lang="en">Stakeholder alignment</span> — 利益相关方达成共识</summary><p>与项目有关的各方对目标、方案或职责分工形成共同理解的状态，或达成这一状态的过程。</p><p lang="en">We need stakeholder alignment before launching the new policy.</p><p>在推出新政策之前，我们需要与利益相关方达成一致。</p></details>
<details><summary><span lang="en">Executive summary</span> — 管理层摘要</summary><p>在汇报中简述关键发现、影响、风险和需要管理层决策的要点。</p><p lang="en">The executive summary highlights the decisions needed and the main risks.</p><p>管理层摘要重点列出了待决策事项和主要风险。</p></details>
<details><summary><span lang="en">Key takeaway</span> — 核心结论</summary><p>汇报或分析中最重要的信息。</p><p lang="en">The key takeaway is that retention improved in critical roles.</p><p>最重要的结论是，关键岗位的员工留存情况有所改善。</p></details>
<details><summary><span lang="en">Action item</span> — 待办事项</summary><p>在会议、评审等工作沟通中明确提出、需要落实的具体任务。</p><p lang="en">Each action item has an owner and a deadline.</p><p>每项待办事项都有负责人和截止日期。</p></details>
<details><summary><span lang="en">Next steps</span> — 下一步安排</summary><p>当前阶段之后拟开展的工作及其先后顺序、分工或时间安排。</p><p lang="en">Let&#x27;s summarize the next steps before we close the meeting.</p><p>结束会议前，我们总结一下下一步安排吧。</p></details>
<details><summary><span lang="en">Decision log</span> — 决策记录</summary><p>集中记录已作决定、相关依据和决策人等信息，供项目后续查阅的文档。</p><p lang="en">The decision log records why we selected this option.</p><p>决策记录说明了我们选择这一方案的原因。</p></details>
<details><summary><span lang="en">Meeting minutes</span> — 会议纪要</summary><p>会议讨论、决定和任务的书面记录。</p><p lang="en">I&#x27;ll circulate the meeting minutes after the call.</p><p>通话结束后，我会发送会议纪要。</p></details>
<details><summary><span lang="en">Escalation path</span> — 升级处理路径</summary><p>问题超出当前人员的权限、处理能力或时限时，转交适当负责人或团队的规则和路径。</p><p lang="en">The escalation path is documented in the service guide.</p><p>升级处理路径已记录在服务指南中。</p></details>
<details><summary><span lang="en">Business case</span> — 立项论证／商业论证</summary><p>说明为什么值得采取某项方案或投入资源的材料，通常涵盖需求、备选方案、成本、收益和风险。</p><p lang="en">The business case supports additional investment in hiring.</p><p>这份论证为增加招聘投入提供了依据。</p></details>
<details><summary><span lang="en">Trade-off</span> — 权衡取舍</summary><p>在相互冲突的目标或资源限制下作出的选择。</p><p lang="en">We discussed the trade-off between speed and cost.</p><p>我们讨论了速度与成本之间需要作出的权衡。</p></details>
<details><summary><span lang="en">Risk mitigation</span> — 风险缓解</summary><p>降低风险发生概率或影响的措施。</p><p lang="en">Risk mitigation measures include extra compliance checks.</p><p>风险缓解措施包括增加合规检查。</p></details>
<details><summary><span lang="en">Assumption</span> — 假设</summary><p>分析或预算中暂时成立的前提条件。</p><p lang="en">The forecast is based on the assumption that monthly turnover will remain stable.</p><p>这份预测以月度离职率保持稳定为前提。</p></details>
<details><summary><span lang="en">Dependency</span> — 依赖事项</summary><p>一项工作启动或完成所依赖的其他工作、资源或决定，也指这种依赖关系。</p><p lang="en">System integration is a key dependency for the launch.</p><p>完成系统集成是项目上线的一项关键前提。</p></details>
<details><summary><span lang="en">Timeline</span> — 项目时间表／时间安排</summary><p>按时间顺序列出项目阶段、主要活动和关键日期的安排。</p><p lang="en">The timeline includes policy drafting and manager training.</p><p>项目时间表包括政策起草和管理者培训。</p></details>
<details><summary><span lang="en">Milestone</span> — 里程碑</summary><p>标识项目阶段完成的关键节点。</p><p lang="en">The next milestone is executive approval of the policy.</p><p>下一个里程碑是获得管理层对政策的批准。</p></details>
<details><summary><span lang="en">Deliverable</span> — 交付成果</summary><p>项目需在约定节点提交的具体产出。</p><p lang="en">The revised policy handbook is our final deliverable.</p><p>修订后的政策手册是我们的最终交付成果。</p></details>
<details><summary><span lang="en">Scope</span> — 工作范围</summary><p>项目或流程涵盖与不涵盖的内容。</p><p lang="en">The scope includes HR operations in five markets.</p><p>本次工作范围包括五个市场的人力资源运营。</p></details>
<details><summary><span lang="en">Out of scope</span> — 超出范围／不在范围内</summary><p>用于说明某事项不属于当前约定的项目、阶段或任务范围。</p><p lang="en">Payroll system replacement is out of scope for phase one.</p><p>第一阶段不包括替换薪资系统。</p></details>
<details><summary><span lang="en">Alignment meeting</span> — 协调会／对齐会议</summary><p>为统一目标、方案与分工召开的会议。</p><p lang="en">The alignment meeting will address outstanding questions.</p><p>协调会将讨论仍待解决的问题。</p></details>
<details><summary><span lang="en">Touch base</span> — 简短联系／简短沟通</summary><p>在较非正式的工作沟通中，与某人简短联系，交换近况或确认信息。</p><p lang="en">Let&#x27;s touch base on the hiring plan tomorrow.</p><p>明天我们再简短沟通一下招聘计划。</p></details>
<details><summary><span lang="en">Follow up</span> — 跟进</summary><p>就上一轮沟通继续确认或推进。</p><p lang="en">I’ll follow up with the legal team about the contract wording.</p><p>我会联系法务团队，跟进合同措辞的问题。</p></details>
<details><summary><span lang="en">Circle back</span> — 稍后再讨论</summary><p>把当前议题暂放一边，待有更多信息或时机合适时再继续讨论。</p><p lang="en">Let&#x27;s circle back once the budget is confirmed.</p><p>等预算确定后，我们再讨论这件事。</p></details>
<details><summary><span lang="en">Heads-up</span> — 提前提醒</summary><p>在事情发生前给相关方一个简短通知。</p><p lang="en">Just a heads-up, the survey closes on Friday.</p><p>提醒一下，调查周五截止。</p></details>
<details><summary><span lang="en">Flag an issue</span> — 指出问题／提醒关注问题</summary><p>在沟通中指出某个问题，让相关人员注意并视情况处理。</p><p lang="en">I want to flag an issue with the assignment timeline.</p><p>我想提醒大家关注外派时间安排上的一个问题。</p></details>
<details><summary><span lang="en">On the same page</span> — 理解一致／有共同认识</summary><p>对信息和预期有一致理解。</p><p lang="en">Let&#x27;s make sure we are on the same page about the criteria.</p><p>我们要确保对相关标准的理解保持一致。</p></details>
<details><summary><span lang="en">Deep dive</span> — 深入分析</summary><p>针对某个问题进行细致讨论或研究。</p><p lang="en">We will do a deep dive into the attrition data next week.</p><p>下周我们将深入分析员工流失数据。</p></details>
<details><summary><span lang="en">High-level overview</span> — 概览</summary><p>对主题的背景、主要组成部分或整体安排作简要介绍，省略操作层面的细节。</p><p lang="en">I&#x27;ll start with a high-level overview of the talent strategy.</p><p>我先简要介绍一下人才战略的整体情况。</p></details>
<details><summary><span lang="en">Bottom line</span> — 最终结论</summary><p>在讨论中指最终归纳出的关键判断或实际结果，在财务语境中也可指净利润。</p><p lang="en">The bottom line is that the program needs a larger budget.</p><p>归根结底，这个项目需要更多预算。</p></details>
<details><summary><span lang="en">Data point</span> — 数据点</summary><p>数据中的一项观测或数值，可以用于比较或支持分析。</p><p lang="en">One data point alone is not enough to explain turnover.</p><p>仅凭一个数据点不足以解释员工流失情况。</p></details>
<details><summary><span lang="en">Insight</span> — 洞察</summary><p>通过分析、比较或观察获得的、能够加深对问题理解的判断。</p><p lang="en">One insight from the survey was that employees wanted more specific feedback from their managers.</p><p>调查揭示的一点是，员工希望直属主管给出更具体的反馈。</p></details>
<details><summary><span lang="en">Root cause</span> — 根本原因</summary><p>使问题发生或反复出现的深层成因，一个问题可能有多个根本原因。</p><p lang="en">We should investigate the root cause before changing the policy.</p><p>调整政策前，我们应该先调查根本原因。</p></details>
<details><summary><span lang="en">Recommendation</span> — 建议方案</summary><p>基于评估提出的具体行动方向。</p><p lang="en">My recommendation is to pilot the policy in two markets.</p><p>我的建议是先在两个市场试点这项政策。</p></details>
<details><summary><span lang="en">Approval workflow</span> — 审批流程</summary><p>规定申请如何提交、流转、审核和决定，并明确相应角色的流程。</p><p lang="en">The approval workflow involves HR, finance and legal.</p><p>这套审批流程涉及人力资源、财务和法务部门。</p></details>
<details><summary><span lang="en">Sign-off</span> — 正式确认／签批</summary><p>由授权负责人对文件、预算或方案作出最后批准或签字确认。</p><p lang="en">We need legal sign-off before sending the announcement.</p><p>发布公告前，我们需要法务正式确认。</p></details>
<details><summary><span lang="en">Rollout plan</span> — 推行计划</summary><p>新政策或项目上线的沟通与执行安排。</p><p lang="en">The rollout plan includes training for managers.</p><p>推行计划包括面向管理者的培训。</p></details>
<details><summary><span lang="en">Pilot program</span> — 试点项目</summary><p>先在小范围验证方案效果的项目。</p><p lang="en">The pilot program will run in two offices for eight weeks.</p><p>试点项目将在两个办公地点开展八周。</p></details>
<details><summary><span lang="en">Lessons learned</span> — 经验教训</summary><p>根据项目中有效或失误的做法总结出的经验和教训，供今后工作参考。</p><p lang="en">We captured lessons learned after the policy rollout.</p><p>政策推行后，我们总结了经验教训。</p></details>
<details><summary><span lang="en">Status update</span> — 进度更新</summary><p>向相关方说明当前状态与风险的沟通。</p><p lang="en">The status update covers progress, risks and blockers.</p><p>进度更新涵盖工作进展、风险和当前障碍。</p></details>
<details><summary><span lang="en">Blocker</span> — 阻碍事项</summary><p>使某项工作无法继续推进、需先解决的障碍。</p><p lang="en">Lack of data access is the main blocker for this analysis.</p><p>缺少数据访问权限是这项分析目前面临的主要障碍。</p></details>
<details><summary><span lang="en">Stakeholder feedback</span> — 利益相关方意见</summary><p>受方案影响或参与实施的相关人员或团队对方案、过程或成果提出的意见。</p><p lang="en">We incorporated stakeholder feedback into the final draft.</p><p>我们已将利益相关方的反馈纳入最终草案。</p></details>
<details><summary><span lang="en">Policy briefing</span> — 人力资源政策宣讲／说明会</summary><p>向特定受众介绍政策内容、变更、实施安排或注意事项的简报或说明活动。</p><p lang="en">HR will hold a policy briefing for line managers.</p><p>人力资源部门将为直线经理举办政策说明会。</p></details>
<details><summary><span lang="en">Business justification</span> — 业务必要性说明／业务理由</summary><p>在招聘、预算或项目审批中，说明提议对应的业务需求、预期价值或不采取行动的影响。</p><p lang="en">The headcount request must include a clear business justification.</p><p>人员编制申请必须包含清晰的业务必要性说明。</p></details>
<details><summary><span lang="en">Budget sign-off</span> — 预算正式审批／预算签批</summary><p>具备相应权限的人或机构对预算作出正式批准，可通过审批系统、书面签批等方式记录。</p><p lang="en">Our team can launch the program once it has budget sign-off.</p><p>预算正式获批后，我们团队就可以启动这个项目。</p></details>
<details><summary><span lang="en">Approval matrix</span> — 审批权限矩阵</summary><p>按事项、金额或岗位明确各级审核与批准权限的管理表。</p><p lang="en">The approval matrix identifies who signs off on each request.</p><p>审批权限矩阵明确了每类申请由谁正式批准。</p></details>
<details><summary><span lang="en">Leadership briefing</span> — 管理层简报／面向管理层的情况说明</summary><p>面向管理层集中呈现进展、风险和待决事项的简短材料或说明会。</p><p lang="en">The CHRO prepared a leadership briefing on workforce risks.</p><p>首席人力资源官准备了一份关于用工风险的管理层简报。</p></details>
<details><summary><span lang="en">Implementation timeline</span> — 实施时间表</summary><p>按时间列出政策或项目实施的主要阶段、任务及关键节点的安排。</p><p lang="en">The implementation timeline includes a two-week pilot.</p><p>实施时间表包括为期两周的试点。</p></details>
<details><summary><span lang="en">Meeting agenda</span> — 会议议程</summary><p>会前准备的议题和讨论顺序，可列出预期成果、各议题负责人和计划用时。</p><p lang="en">Please circulate the meeting agenda before the HR review.</p><p>请在人力资源评审会前分发会议议程。</p></details>
<details><summary><span lang="en">Decision memo</span> — 决策备忘录／决策建议书</summary><p>供决策人审议的简短文件，通常说明待决事项、备选方案、取舍和建议，也可用于记录决定及理由。</p><p lang="en">The decision memo summarizes the proposed policy changes.</p><p>决策备忘录汇总了拟议的政策变更。</p></details>
<details><summary><span lang="en">Stakeholder engagement</span> — 相关方沟通与参与</summary><p>持续识别并与受项目或政策影响、或能影响实施的各方沟通，让其提供意见或参与推进。</p><p lang="en">Our global policy rollout plan includes stakeholder engagement in each region.</p><p>按全球政策实施计划，我们会在各地区与相关方沟通，请他们参与实施。</p></details>
<details><summary><span lang="en">Working session</span> — 专题工作会议／协同研讨会</summary><p>围绕某个具体问题开展讨论和协作，并争取当场推进方案、决定或其他成果的会议。</p><p lang="en">Let&#x27;s schedule a working session to finalize the HR process.</p><p>我们安排一次工作会议，敲定人力资源流程吧。</p></details>
<details><summary><span lang="en">Compliance update</span> — 合规动态通报／合规进展通报</summary><p>用于向相关方通报法规或内部要求变动、审查发现或整改进展的消息、简报或定期更新。</p><p lang="en">HR shared a compliance update with regional managers.</p><p>人力资源部门向区域管理者通报了最新合规动态。</p></details>
<details><summary><span lang="en">Follow-up email</span> — 跟进邮件／会后跟进邮件</summary><p>在会议、沟通或提交请求之后发送的邮件，用于确认结果、补充资料、催询进度或推进后续行动。</p><p lang="en">I will send a follow-up email with the agreed next steps.</p><p>我会发一封跟进邮件，列明已商定的下一步行动。</p></details>
<details><summary><span lang="en">Revise</span> — 修订（人力资源政策／岗位说明书等）</summary><p>在 HR 工作中指根据反馈、组织变化或法律要求，对岗位说明书、员工手册、薪酬政策等正式文件作出修改或修订。</p><p lang="en">We need to revise the job description before posting the vacancy.</p><p>发布岗位招聘信息前，我们需要修订岗位说明书。</p></details>
<details><summary><span lang="en">Push back</span> — 提出异议／表达反对意见</summary><p>对提议或要求提出异议或质疑。</p><p lang="en">We should push back on unrealistic deadlines and suggest alternatives.</p><p>我们应对不切实际的截止日期提出异议，并建议替代方案。</p></details>
